apiVersion: apps/v1
kind: Deployment
metadata:
  name: report-wooz
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "vox.labels" . | nindent 4 }}
    app: report-wooz
spec:
  replicas: 1
  selector:
    matchLabels:
      app: report-wooz
  template:
    metadata:
      labels:
        app: report-wooz
        {{- include "vox.labels" . | nindent 8 }}
    spec:
      initContainers:
        {{- include "vox.waitForCertForge" . | nindent 8 }}
        {{- include "vox.waitForObservability" . | nindent 8 }}
        {{- include "vox.waitForAugurCanis" . | nindent 8 }}
      containers:
        - name: report-wooz
          image: {{ .Values.registry }}/{{ .Values.imagePrefix }}report-wooz:{{ .Values.reportWooz.tag }}
          imagePullPolicy: Always
          ports:
            - containerPort: {{ .Values.reportWooz.port }}
          env:
            - name: PORT
              value: {{ .Values.reportWooz.port | quote }}
            - name: SERVICE_NAME
              value: "report-wooz"
            - name: CERT_FORGE_URL
              value: "https://cert-forge:{{ .Values.certForge.port }}"
            - name: ENROLLMENT_PORT
              value: {{ .Values.certForge.enrollmentPort | quote }}
            - name: PUBLIC_PORT
              value: {{ .Values.certForge.publicPort | quote }}
            - name: ENROLLMENT_CERT
              value: "/certs/enrollment.crt"
            - name: ENROLLMENT_KEY
              value: "/certs/enrollment.key"
            - name: ENROLLMENT_CA
              value: "/certs/enrollment-ca.crt"
            - name: AUGUR_CANIS_URL
              value: "https://augur-canis:{{ .Values.augurCanis.port }}"
            - name: REDIS_URL
              value: "redis:6379"
            - name: HOSTNAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: OBSERVABILITY_URL
              value: "https://observability-service:{{ .Values.observabilityService.port }}"
            - name: OLLAMA_URL
              value: "http://host.docker.internal:11434"
          volumeMounts:
            - name: vox-certs
              mountPath: /certs
              readOnly: true
          livenessProbe:
            exec:
              command: ["/healthcheck"]
            initialDelaySeconds: 45
            periodSeconds: 30
            failureThreshold: 3
      volumes:
        - name: vox-certs
          secret:
            secretName: {{ .Values.certSecretName }}
---
apiVersion: v1
kind: Service
metadata:
  name: report-wooz
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "vox.labels" . | nindent 4 }}
    app: report-wooz
spec:
  selector:
    app: report-wooz
  ports:
    - port: {{ .Values.reportWooz.port }}
      targetPort: {{ .Values.reportWooz.port }}
