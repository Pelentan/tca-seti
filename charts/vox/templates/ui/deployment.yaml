apiVersion: apps/v1
kind: Deployment
metadata:
  name: ui
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "vox.labels" . | nindent 4 }}
    app: ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ui
  template:
    metadata:
      labels:
        app: ui
        {{- include "vox.labels" . | nindent 8 }}
    spec:
      containers:
        - name: ui
          image: {{ .Values.registry }}/{{ .Values.imagePrefix }}ui:{{ .Values.ui.tag }}
          imagePullPolicy: Always
          ports:
            - containerPort: {{ .Values.ui.port }}
          livenessProbe:
            tcpSocket:
              port: {{ .Values.ui.port }}
            initialDelaySeconds: 15
            periodSeconds: 30
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: ui
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "vox.labels" . | nindent 4 }}
    app: ui
spec:
  selector:
    app: ui
  ports:
    - port: {{ .Values.ui.port }}
      targetPort: {{ .Values.ui.port }}
