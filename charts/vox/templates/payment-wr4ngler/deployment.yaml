apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-wr4ngler
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "vox.labels" . | nindent 4 }}
    app: payment-wr4ngler
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payment-wr4ngler
  template:
    metadata:
      labels:
        app: payment-wr4ngler
        {{- include "vox.labels" . | nindent 8 }}
    spec:
      initContainers:
        {{- include "vox.waitForCertForge" . | nindent 8 }}
        {{- include "vox.waitForObservability" . | nindent 8 }}
        {{- include "vox.waitForAugurCanis" . | nindent 8 }}
      containers:
        - name: payment-wr4ngler
          image: {{ .Values.registry }}/payment-wr4ngler:{{ .Values.paymentWr4ngler.tag }}
          imagePullPolicy: Always
          ports:
            - containerPort: {{ .Values.paymentWr4ngler.port }}
          env:
            - name: PORT
              value: {{ .Values.paymentWr4ngler.port | quote }}
            - name: SERVICE_NAME
              value: "payment-wr4ngler"
            - name: CERT_FORGE_URL
              value: "https://cert-forge:{{ .Values.certForge.port }}"
            - name: ENROLLMENT_PORT
              value: {{ .Values.certForge.enrollmentPort | quote }}
            - name: PUBLIC_PORT
              value: {{ .Values.certForge.publicPort | quote }}
            - name: ENROLLMENT_CERT
              value: "/certs/enrollment.crt"
            - name: ENROLLMENT_KEY
              value: "/certs/enrollment.key"
            - name: ENROLLMENT_CA
              value: "/certs/enrollment-ca.crt"
            - name: AUGUR_CANIS_URL
              value: "https://augur-canis:{{ .Values.augurCanis.port }}"
            - name: REDIS_URL
              value: "redis:6379"
            - name: HOSTNAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: OBSERVABILITY_URL
              value: "https://observability-service:{{ .Values.observabilityService.port }}"
          volumeMounts:
            - name: vox-certs
              mountPath: /certs
              readOnly: true
          livenessProbe:
            exec:
              command: ["/healthcheck"]
            initialDelaySeconds: 45
            periodSeconds: 30
            failureThreshold: 3
      volumes:
        - name: vox-certs
          secret:
            secretName: {{ .Values.certSecretName }}
---
apiVersion: v1
kind: Service
metadata:
  name: payment-wr4ngler
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "vox.labels" . | nindent 4 }}
    app: payment-wr4ngler
spec:
  selector:
    app: payment-wr4ngler
  ports:
    - port: {{ .Values.paymentWr4ngler.port }}
      targetPort: {{ .Values.paymentWr4ngler.port }}
