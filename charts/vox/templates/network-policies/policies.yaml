# NetworkPolicy for TCA Vox constellation.
# Default-deny ingress. Explicit allow per service.
# Enforced when CNI supports NetworkPolicy (Calico, Cilium).
# k3d with flannel enforces these — plan accordingly.
#
# Key rules derived from lessons learned in SETI migration:
# - cert-forge and observability-service accept from all constellation pods
#   (every pod needs cert enrollment and every pod reports events)
# - Redis accepts from all constellation pods
#   (every service may use Redis directly)
# - Per-service ingress lists exact callers at runtime

# ---------------------------------------------------------------------------
# Default deny all ingress
# ---------------------------------------------------------------------------
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: {{ .Values.namespace }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
# ---------------------------------------------------------------------------
# cert-forge — accepts from all constellation pods (enrollment is universal)
# ---------------------------------------------------------------------------
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cert-forge-ingress
  namespace: {{ .Values.namespace }}
spec:
  podSelector:
    matchLabels:
      app: cert-forge
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: vox
      ports:
        - port: {{ .Values.certForge.port }}
        - port: {{ .Values.certForge.enrollmentPort }}
        - port: {{ .Values.certForge.publicPort }}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: seti
      ports:
        - port: {{ .Values.certForge.publicPort }}
---
# ---------------------------------------------------------------------------
# Redis — accepts from all constellation pods
# (healthcheck binary, sessions, pub/sub, streams)
# ---------------------------------------------------------------------------
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: redis-ingress
  namespace: {{ .Values.namespace }}
spec:
  podSelector:
    matchLabels:
      app: redis
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: vox
      ports:
        - port: 6379
---
# ---------------------------------------------------------------------------
# observability-service — accepts from all constellation pods
