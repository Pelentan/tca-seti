spec:
  podSelector:
    matchLabels:
      app: augur-canis
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: vox
      ports:
        - port: {{ .Values.augurCanis.port }}
        - port: {{ .Values.augurCanis.uiPort }}
---
# ---------------------------------------------------------------------------
# augur-canis — SETI cross-namespace ingress
#
# Allows SETI pods (in the seti namespace) to reach augur-canis on the
# mTLS port only.  SETI's connie-agent initiates federation registration,
# holds the /stream SSE connection, and triggers /plots/run.
# The UI port is deliberately excluded — SETI has no need for the dev UI.
#
# Requires the seti namespace to carry the label:
#   kubernetes.io/metadata.name: seti
# (applied automatically by K8s >= 1.21; verify with:
#   kubectl get namespace seti --show-labels)
# ---------------------------------------------------------------------------
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: augur-canis-seti-ingress
  namespace: {{ .Values.namespace }}
spec:
  podSelector:
    matchLabels:
      app: augur-canis
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: seti
      ports:
        - port: {{ .Values.augurCanis.port }}
        - port: {{ .Values.augurCanis.federationPort }}
