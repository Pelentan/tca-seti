apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cert-forge-secret-writer
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "seti.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "update"]
    # resourceNames cannot be combined with "create" (resource doesn't exist yet),
    # so scope is limited to the namespace. The namespace itself provides isolation.
