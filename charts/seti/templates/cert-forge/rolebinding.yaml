apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cert-forge-secret-writer
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "seti.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: cert-forge
    namespace: {{ .Values.namespace }}
roleRef:
  kind: Role
  name: cert-forge-secret-writer
  apiGroup: rbac.authorization.k8s.io
