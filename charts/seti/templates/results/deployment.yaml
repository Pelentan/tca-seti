apiVersion: apps/v1
kind: Deployment
metadata:
  name: results
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "seti.labels" . | nindent 4 }}
    app: results
spec:
  replicas: 1
  selector:
    matchLabels:
      app: results
  template:
    metadata:
      labels:
        app: results
        {{- include "seti.labels" . | nindent 8 }}
    spec:
      initContainers:
        {{- include "seti.waitForCertForge" . | nindent 8 }}
        {{- include "seti.waitForAugurCanis" . | nindent 8 }}
      containers:
        - name: results
          image: {{ .Values.registry }}/{{ .Values.imagePrefix }}results:{{ .Values.results.tag }}
          imagePullPolicy: Always
          ports:
            - containerPort: {{ .Values.results.port }}
          env:
            - name: PORT
              value: {{ .Values.results.port | quote }}
            - name: REDIS_URL
              value: {{ .Values.redis.url | quote }}
            - name: SERVICE_NAME
              value: "results"
            - name: PUBLIC_PORT
              value: {{ .Values.certForge.publicPort | quote }}
            - name: ENROLLMENT_CERT
              value: "/certs/enrollment.crt"
            - name: ENROLLMENT_KEY
              value: "/certs/enrollment.key"
            - name: ENROLLMENT_CA
              value: "/certs/enrollment-ca.crt"
            - name: CERT_FORGE_URL
              value: "https://cert-forge:{{ .Values.certForge.port }}"
            - name: ENROLLMENT_PORT
              value: {{ .Values.certForge.enrollmentPort | quote }}
            - name: AUGUR_CANIS_URL
              value: "https://augur-canis:{{ .Values.augurCanis.port }}"
            - name: HOSTNAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: OBSERVABILITY_URL
              value: "https://seti-observability:{{ .Values.setiObservability.port }}"
          volumeMounts:
            - name: seti-certs
              mountPath: /certs
              readOnly: true
          readinessProbe:
            exec:
              command: ["python3", "/healthcheck.py"]
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          livenessProbe:
            exec:
              command: ["python3", "/healthcheck.py"]
            initialDelaySeconds: 45
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
      volumes:
        - name: seti-certs
          secret:
            secretName: {{ .Values.certSecretName }}
---
apiVersion: v1
kind: Service
metadata:
  name: results
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "seti.labels" . | nindent 4 }}
    app: results
spec:
  selector:
    app: results
  ports:
    - port: {{ .Values.results.port }}
      targetPort: {{ .Values.results.port }}
