apiVersion: apps/v1
kind: Deployment
metadata:
  name: contract-test
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "seti.labels" . | nindent 4 }}
    app: contract-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: contract-test
  template:
    metadata:
      labels:
        app: contract-test
        {{- include "seti.labels" . | nindent 8 }}
    spec:
      initContainers:
        {{- include "seti.waitForCertForge" . | nindent 8 }}
        {{- include "seti.waitForAugurCanis" . | nindent 8 }}
      containers:
        - name: contract-test
          image: {{ .Values.registry }}/{{ .Values.imagePrefix }}contract-test:{{ .Values.contractTest.tag }}
          imagePullPolicy: Always
          ports:
            - containerPort: {{ .Values.contractTest.port }}
          env:
            - name: PORT
              value: {{ .Values.contractTest.port | quote }}
            - name: REDIS_URL
              value: {{ .Values.redis.url | quote }}
            - name: SERVICE_NAME
              value: "contract-test"
            - name: PUBLIC_PORT
              value: {{ .Values.certForge.publicPort | quote }}
            - name: ENROLLMENT_CERT
              value: "/certs/enrollment.crt"
            - name: ENROLLMENT_KEY
              value: "/certs/enrollment.key"
            - name: ENROLLMENT_CA
              value: "/certs/enrollment-ca.crt"
            - name: CERT_FORGE_URL
              value: "https://cert-forge:{{ .Values.certForge.port }}"
            - name: ENROLLMENT_PORT
              value: {{ .Values.certForge.enrollmentPort | quote }}
            - name: AUGUR_CANIS_URL
              value: "https://augur-canis:{{ .Values.augurCanis.port }}"
            - name: HOSTNAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: OBSERVABILITY_URL
              value: "https://seti-observability:{{ .Values.setiObservability.port }}"
            - name: POLICY_URL
              value: "https://policy:{{ .Values.policy.port }}"
            - name: RESULTS_URL
              value: "https://results:{{ .Values.results.port }}"
            - name: CONTRACTS_PATH
              value: "/contracts/openapi"
          volumeMounts:
            - name: seti-certs
              mountPath: /certs
              readOnly: true
            - name: contracts
              mountPath: /contracts
              readOnly: true
          readinessProbe:
            exec:
              command: ["/healthcheck"]
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          livenessProbe:
            exec:
              command: ["/healthcheck"]
            initialDelaySeconds: 45
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
      volumes:
        - name: seti-certs
          secret:
            secretName: {{ .Values.certSecretName }}
        - name: contracts
          configMap:
            name: seti-contracts
---
apiVersion: v1
kind: Service
metadata:
  name: contract-test
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "seti.labels" . | nindent 4 }}
    app: contract-test
spec:
  selector:
    app: contract-test
  ports:
    - port: {{ .Values.contractTest.port }}
      targetPort: {{ .Values.contractTest.port }}
