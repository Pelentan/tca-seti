apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: seti-gateway
  namespace: {{ .Release.Namespace }}
spec:
  entryPoints:
    - websecure
  routes:
    - match: HostSNI(`{{ .Values.gateway.externalHostname }}`)
      services:
        - name: gateway
          port: 4000
  tls:
    passthrough: true
