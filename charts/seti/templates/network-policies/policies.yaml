# NetworkPolicy for the SETI constellation.
#
# These policies declare the intended communication topology.
# They are enforced automatically when the CNI plugin supports NetworkPolicy
# (Calico, Cilium, etc.). k3d with flannel does not enforce them in dev —
# that is intentional. The policies are authoritative documentation of the
# topology regardless of enforcement.
#
# Design:
#   - Default deny all ingress to all pods in the namespace
#   - Explicit allow rules per service based on actual call relationships
#   - augur-canis gets unrestricted egress — it must reach every service
#   - cert-forge accepts ingress from all pods (enrollment is universal)
#   - Redis and postgres accept ingress only from their legitimate callers

# ---------------------------------------------------------------------------
# Default deny — ingress
# ---------------------------------------------------------------------------
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: {{ .Values.namespace }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
# ---------------------------------------------------------------------------
# augur-canis — unrestricted egress so it can reach every service
# ---------------------------------------------------------------------------
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: augur-canis-egress
  namespace: {{ .Values.namespace }}
spec:
  podSelector:
    matchLabels:
      app: augur-canis
  policyTypes:
    - Egress
  egress:
    - {} # Allow all egress from augur-canis
---
# ---------------------------------------------------------------------------
# cert-forge — accepts enrollment and signing calls from all constellation pods
# ---------------------------------------------------------------------------
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cert-forge-ingress
  namespace: {{ .Values.namespace }}
spec:
  podSelector:
    matchLabels:
      app: cert-forge
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: seti
      ports:
        - port: {{ .Values.certForge.port }}        # sign (constellation mTLS)
        - port: {{ .Values.certForge.enrollmentPort }} # instance-cert (enrollment mTLS)
        - port: {{ .Values.certForge.publicPort }}   # /ca (plain HTTP)
---
# ---------------------------------------------------------------------------
# redis — accepts from all constellation pods
# Every service's healthcheck binary connects to Redis directly.
# ---------------------------------------------------------------------------
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: redis-ingress
  namespace: {{ .Values.namespace }}
spec:
  podSelector:
    matchLabels:
      app: redis
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: seti
      ports:
        - port: 6379
---
# ---------------------------------------------------------------------------
# postgres — accepts only from lore
# ---------------------------------------------------------------------------
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-ingress
  namespace: {{ .Values.namespace }}
spec:
  podSelector:
    matchLabels:
      app: postgres
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: lore
      ports:
        - port: 5432
---
# ---------------------------------------------------------------------------
# seti-observability — accepts reportEvent() calls from all Jobs
# ---------------------------------------------------------------------------
apiVersion: networking.k8s.io/v1
