---
# ---------------------------------------------------------------------------
# augur-canis — accepts from all constellation pods.
# Every service's init container probes augur-canis:4010 to gate startup.
# Runtime callers are a subset, but the init container probe runs inside
# every service pod carrying the seti label.
# ---------------------------------------------------------------------------
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: augur-canis-ingress
  namespace: {{ .Values.namespace }}
spec:
  podSelector:
    matchLabels:
      app: augur-canis
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: seti
      ports:
        - port: {{ .Values.augurCanis.port }}
---
# ---------------------------------------------------------------------------
