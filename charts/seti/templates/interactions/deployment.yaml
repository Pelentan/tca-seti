apiVersion: apps/v1
kind: Deployment
metadata:
  name: interactions
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "seti.labels" . | nindent 4 }}
    app: interactions
spec:
  replicas: 1
  selector:
    matchLabels:
      app: interactions
  template:
    metadata:
      labels:
        app: interactions
        {{- include "seti.labels" . | nindent 8 }}
    spec:
      initContainers:
        {{- include "seti.waitForCertForge" . | nindent 8 }}
        {{- include "seti.waitForAugurCanis" . | nindent 8 }}
      terminationGracePeriodSeconds: 20
      containers:
        - name: interactions
          image: {{ .Values.registry }}/{{ .Values.imagePrefix }}interactions:{{ .Values.interactions.tag }}
          imagePullPolicy: Always
          ports:
            - containerPort: {{ .Values.interactions.port }}
          env:
            - name: PORT
              value: {{ .Values.interactions.port | quote }}
            - name: REDIS_URL
              value: {{ .Values.redis.url | quote }}
            - name: SERVICE_NAME
              value: "interactions"
            - name: PUBLIC_PORT
              value: {{ .Values.certForge.publicPort | quote }}
            - name: ENROLLMENT_CERT
              value: "/certs/enrollment.crt"
            - name: ENROLLMENT_KEY
              value: "/certs/enrollment.key"
            - name: ENROLLMENT_CA
              value: "/certs/enrollment-ca.crt"
            - name: CERT_FORGE_URL
              value: "https://cert-forge:{{ .Values.certForge.port }}"
            - name: ENROLLMENT_PORT
              value: {{ .Values.certForge.enrollmentPort | quote }}
            - name: AUGUR_CANIS_URL
              value: "https://augur-canis:{{ .Values.augurCanis.port }}"
            - name: HOSTNAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: OBSERVABILITY_URL
              value: "https://seti-observability:{{ .Values.setiObservability.port }}"
            - name: AI_LIEN_URL
              value: "https://ai-lien:{{ .Values.aiLien.port }}"
            - name: NOTIFIER_URL
              value: "https://notifier:{{ .Values.notifier.port }}"
            - name: LORE_URL
              value: "https://lore:{{ .Values.lore.port }}"
            - name: RESULTS_URL
              value: "https://results:{{ .Values.results.port }}"
          volumeMounts:
            - name: seti-certs
              mountPath: /certs
              readOnly: true
          livenessProbe:
            exec:
              command: ["/healthcheck"]
            initialDelaySeconds: 45
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
      volumes:
        - name: seti-certs
          secret:
            secretName: {{ .Values.certSecretName }}
---
apiVersion: v1
kind: Service
metadata:
  name: interactions
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "seti.labels" . | nindent 4 }}
    app: interactions
spec:
  selector:
    app: interactions
  ports:
    - port: {{ .Values.interactions.port }}
      targetPort: {{ .Values.interactions.port }}
