apiVersion: v1
kind: ConfigMap
metadata:
  name: seti-contracts
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "seti.labels" . | nindent 4 }}
data:
  ai-lien.yaml: |
    openapi: 3.1.0
    
    info:
      title: SETI - AI-lien Job
      description: |
        Internal AI reasoning engine for the SETI constellation. The only
        Job in the constellation running a local AI model instance.
    
        AI-lien has exactly one external caller relationship: SETI. No
        user-facing traffic, no concurrent session management, no external
        exposure. The single-caller constraint is what makes an internal
        AI Job viable here — the concurrency argument that pushes AI to
        external services in every other TCA application does not apply.
    
        AI-lien accepts structured analysis packages from authorized SETI
        Jobs (Interactions, Watchdog) and returns structured assessments.
        The model underneath is an implementation detail — Ollama with
        Qwen2.5-Coder in the demo environment. The contract defines the
        surface. What runs inside the container is opaque to all callers.
    
        DOUBLE-TAP PATTERN:
        Every analysis request executes in two model calls.
    
        First tap: AI-lien feeds the package and supporting data to the
        model with a meta-prompt asking it to construct the optimal query
        for the analysis type requested. The model produces a well-formed,
        context-aware prompt in its own idiom — better than any
        deterministic assembler can produce from structured fields.
    
        Second tap: AI-lien submits the first-tap prompt to the model as
        the actual analysis query, requesting a response conforming to the
        caller-supplied response_schema.
    
        The first-tap prompt is returned in the response and persisted in
        the Results Job audit trail. When an assessment is reviewed later —
        by a human, by the Watchdog, by a future diagnostic — the exact
        question asked of the model is visible, not just the raw input.
    
        This is the first TCA Job to run an AI model as an internal
        implementation component rather than calling an external service.
        The three-year lifecycle applies. Model selection is an operational
        decision. The contract is what persists.
    
        Internal service — mTLS only, not externally exposed.
      version: 0.1.0
    
    x-tca-security:
      transport: mtls
      tls-min-version: "1.3"
      client-cert-required: true
      reject-without-client-cert: true
      ca-cert: /certs/ca.crt
      service-cert: /certs/ai-lien.crt
      service-key: /certs/ai-lien.key
      implementation:
        server:
          load-ca-cert: true
          load-service-cert: true
          load-service-key: true
          require-and-verify-client-cert: true
        client:
          load-ca-cert: true
          load-service-cert: true
          load-service-key: true
          verify-server-cert: true
      notes: >
        Every inbound connection must present a certificate signed by the
        SETI CA. Connections without a valid client certificate must be
        rejected. Authorized callers: Interactions Job, Watchdog Job.
        No other Job in the constellation has legitimate reason to call
        AI-lien directly. Any unrecognized caller certificate must be
        rejected and logged as a security event — AI-lien sitting behind
        a compromised intermediary is a meaningful threat vector.
    
    x-tca-observability:
      report-outbound-calls: true
      endpoint: https://seti-observability:4011/event
      pattern: fire-and-forget
      caller-name: "ai-lien"
      required-fields:
        - caller
        - callee
        - method
        - path
        - status_code
        - latency_ms
        - protocol
      implementation:
        timing: wrap-every-outbound-http-call
        non-blocking: true
        on-failure: log-and-drop
        do-not-instrument:
          - seti-observability
      notes: >
        Report all outbound HTTP calls to the SETI Observability Job.
        AI-lien's outbound calls are to the local Ollama instance only.
        The Ollama endpoint is treated as an internal dependency for
        observability reporting purposes — caller: "ai-lien",
        callee: "ollama". Model inference latency is the primary
        operational signal worth tracking here. Two calls per analysis
        request (first tap + second tap) — both are reported.
    
    servers:
      - url: https://ai-lien:4252
        description: Internal SETI network (mTLS enforced)
    
    tags:
      - name: analysis
        description: Analysis request processing
      - name: health
        description: Service health and model status
    
    paths:
    
      /analyze:
        post:
          tags: [analysis]
          summary: Submit a structured analysis package for AI assessment
          description: |
            Accepts a structured analysis package and returns an AI-generated
            assessment using the double-tap pattern.
    
            First tap constructs an optimized prompt from the package and
            supporting data. Second tap executes the analysis using that
            prompt and returns a structured response conforming to the
            caller-supplied response_schema.
    
            Callers supply the analysis_type to identify what kind of
            reasoning is needed. AI-lien uses this to select the appropriate
            first-tap meta-prompt template. New analysis types are added
            by extending the enum and adding a corresponding meta-prompt
            template inside the Job — no contract change required for
            callers unless the package or response shapes change.
    
            Latency note: two model inference calls means response time
            is 2x single-call latency. Callers must not put AI-lien on
            any critical path. It is an advisory engine, not a gating
            component. Timeouts should be set accordingly — 120 seconds
            default, configurable per caller in the request meta.
          requestBody:
            required: true
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/AnalysisRequest'
                example:
                  analysis_type: "failure_analysis"
                  package:
                    application_id: "app-tca-vox-prod"
                    job_name: "vote-handler"
                    test_tier: "contract"
                    failure_detail: "POST /vote returning 500 on missing poll_guid field instead of 400"
                    consecutive_failures: 3
                    first_failure_at: "2026-03-27T01:45:00Z"
                  supporting_data:
                    recent_deployments:
                      - job: "vote-handler"
                        deployed_at: "2026-03-27T01:30:00Z"
                        version: "0.4.1"
                    trend_7d:
                      pass_rate: "0.94"
                      previous_failures: 2
                    call_chain_anomaly: false
                  response_schema:
                    assessment: "string — diagnosis of the failure"
                    likely_cause: "string — most probable root cause"
                    recommended_action: "string enum: investigate, rollback, monitor, escalate"
                    supporting_evidence: "array of strings — evidence supporting the assessment"
                    confidence: "string decimal 0.0-1.0"
                  meta:
                    max_tokens: 1000
                    confidence_threshold: "0.70"
                    allow_escalate: true
                    timeout_seconds: 120
          responses:
            '200':
              description: Analysis completed
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/AnalysisResponse'
            '400':
              description: Invalid analysis request
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
            '422':
              description: >
                Model returned a response that could not be validated
                against the supplied response_schema. Raw model output
                included for diagnostic purposes.
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/ValidationFailureResponse'
            '503':
              description: >
                Model unavailable. Ollama instance unreachable or
                model not loaded. Caller should retry with backoff
                or route to human escalation.
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
            '504':
              description: Analysis timed out
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/TimeoutResponse'
            '500':
              description: Internal error
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
    
      /health:
        get:
          tags: [health]
          summary: Service health and model status
          description: |
            Returns AI-lien service health including Ollama connectivity
            and model load status. A degraded status here means callers
            should route to human escalation rather than waiting for
            AI-lien to recover.
          responses:
            '200':
              description: Health status returned
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/HealthResponse'
    
    components:
      schemas:
    
        AnalysisRequest:
          type: object
          required:
            - analysis_type
            - package
            - response_schema
            - meta
          properties:
            analysis_type:
              type: string
              enum:
                - failure_analysis
                - anomaly_detection
                - trend_assessment
                - plot_regeneration_advisory
                - cross_application_correlation
              description: >
                Identifies the reasoning context for first-tap prompt
                template selection. New types are added to the enum as
                SETI's analysis needs expand — callers use whatever type
                matches their need, AI-lien handles the prompt construction
                internally.
    
                failure_analysis — test failure diagnosis for Interactions Job.
                anomaly_detection — behavioral signal analysis for Watchdog.
                trend_assessment — pattern analysis over historical results.
                plot_regeneration_advisory — guidance on what changed in a
                contract and what a regenerated Plot should cover.
                cross_application_correlation — multi-application pattern
                analysis, Watchdog primary use case.
            package:
              type: object
              description: >
                Structured request data typed to the analysis_type.
                Contents vary by analysis type — AI-lien uses the
                analysis_type to interpret the package correctly.
                Financial values within the package must be strings.
                No schema enforcement at the contract level — the
                fluidity is intentional. Pydantic validation inside
                AI-lien enforces type safety per analysis_type.
            supporting_data:
              type: object
              description: >
                Freeform JSON containing any additional context the
                caller wants the model to have access to. Recent
                deployment history, trend data, call chain observations,
                cross-application signals — whatever enriches the
                analysis. AI-lien feeds this to the first tap alongside
                the package so the prompt constructor has full context.
            response_schema:
              type: object
              description: >
                Caller-supplied description of the desired response
                structure. AI-lien instructs the model to conform to
                this shape on the second tap and validates the output
                before returning. Described as a JSON object where
                keys are field names and values are type descriptions.
                Example: {"assessment": "string", "confidence": "decimal string"}
            meta:
              $ref: '#/components/schemas/AnalysisMeta'
    
        AnalysisMeta:
          type: object
          required:
            - max_tokens
            - confidence_threshold
            - allow_escalate
          properties:
            max_tokens:
              type: integer
              minimum: 100
              maximum: 4000
              description: >
                Maximum tokens for the second-tap model response.
                Does not apply to first tap — prompt construction
                is always allowed full token budget.
              example: 1000
            confidence_threshold:
              type: string
              description: >
                Minimum acceptable confidence as decimal string.
                Responses below this threshold are flagged as
                low_confidence. Does not suppress the response —
                the assessment is still returned with the flag set.
              example: "0.70"
            allow_escalate:
              type: boolean
              description: >
                Whether AI-lien may return escalation_requested: true
                when it determines it lacks sufficient data to make
                a confident assessment. When false, AI-lien always
                returns an assessment regardless of confidence.
              example: true
            timeout_seconds:
              type: integer
              minimum: 30
              maximum: 300
              description: >
                Maximum time allowed for both taps combined before
                returning 504. Default 120 seconds.
              example: 120
            model_preference:
              type: string
              description: >
                Optional model identifier hint. If the specified model
                is loaded and available in Ollama, it will be used.
                If not available, AI-lien falls back to its configured
                default model. This is a preference, not a requirement —
                callers must not depend on a specific model being used.
              example: "qwen2.5-coder:32b"
    
        AnalysisResponse:
          type: object
          required:
            - analysis_type
            - first_tap_prompt
            - assessment
            - confidence
            - low_confidence
            - escalation_requested
            - model_used
            - first_tap_latency_ms
            - second_tap_latency_ms
            - processed_at
          properties:
            analysis_type:
              type: string
              description: Echo of the request analysis_type
            first_tap_prompt:
              type: string
              description: >
                The AI-generated prompt produced by the first tap.
                Preserved verbatim for audit trail. Persisted by
                callers in the Results Job. When an assessment is
                reviewed later, this field shows exactly what was
                asked of the model — not just the raw input data.
            assessment:
              type: object
              description: >
                Structured assessment conforming to the caller-supplied
                response_schema. Validated by Pydantic inside AI-lien
                before this response is returned. If validation fails,
                422 is returned instead of 200.
            confidence:
              type: string
              description: >
                Model's self-assessed confidence in the assessment
                as decimal string. Extracted from model output and
                validated as a decimal between 0.0 and 1.0.
              example: "0.87"
            low_confidence:
              type: boolean
              description: >
                True when confidence is below the caller-supplied
                threshold. Assessment is still returned — caller
                decides how to handle low-confidence results.
            low_confidence_reason:
              type: string
              description: >
                Present when low_confidence is true. Model's
                explanation of why confidence is limited.
              example: >
                Insufficient historical failure data for this Job.
                Only 2 prior failures in 30-day window — pattern
                analysis requires more data points for reliable
                root cause assessment.
            escalation_requested:
              type: boolean
              description: >
                True when allow_escalate was true and the model
                determined it cannot make a useful assessment
                with the available data.
            escalation_reason:
              type: string
              description: >
                Present when escalation_requested is true.
                Specific description of what additional data
                or human judgment is needed.
            model_used:
              type: string
              description: >
                Actual model identifier used for both taps.
                May differ from model_preference if the preferred
                model was unavailable.
              example: "qwen2.5-coder:32b"
            first_tap_latency_ms:
              type: integer
              description: Time for first tap (prompt construction) in milliseconds
            second_tap_latency_ms:
              type: integer
              description: Time for second tap (analysis execution) in milliseconds
            processed_at:
              type: string
              format: date-time
    
        ValidationFailureResponse:
          type: object
          required:
            - analysis_type
            - first_tap_prompt
            - validation_error
            - raw_model_output
            - model_used
            - processed_at
          properties:
            analysis_type:
              type: string
            first_tap_prompt:
              type: string
              description: >
                First tap prompt preserved for diagnostic purposes
                even on validation failure.
            validation_error:
              type: string
              description: >
                Pydantic validation error describing why the model
                output did not conform to response_schema.
            raw_model_output:
              type: string
              description: >
                Verbatim model output that failed validation.
                Included so callers can diagnose whether the
                response_schema description needs refinement.
            model_used:
              type: string
            processed_at:
              type: string
              format: date-time
    
        TimeoutResponse:
          type: object
          required:
            - analysis_type
            - timed_out_at_seconds
            - tap_reached
            - processed_at
          properties:
            analysis_type:
              type: string
            timed_out_at_seconds:
              type: integer
              description: Configured timeout that was exceeded
            tap_reached:
              type: string
              enum: [first, second]
              description: >
                Which tap was executing when the timeout occurred.
                first — timed out during prompt construction.
                second — timed out during analysis execution.
            first_tap_prompt:
              type: string
              description: >
                Present when tap_reached is second — the prompt
                that was constructed before the second tap timed out.
            processed_at:
              type: string
              format: date-time
    
        HealthResponse:
          type: object
          required:
            - status
            - ollama_reachable
            - model_loaded
            - model_name
            - analyses_completed
            - analyses_failed
            - analyses_escalated
            - average_first_tap_ms
            - average_second_tap_ms
            - uptime_seconds
          properties:
            status:
              type: string
              enum: [healthy, degraded, unavailable]
              description: >
                healthy — model loaded and responding.
                degraded — model loaded but response quality metrics
                suggest issues (high validation failure rate).
                unavailable — Ollama unreachable or model not loaded.
                Callers should route to human escalation when unavailable.
            ollama_reachable:
              type: boolean
            model_loaded:
              type: boolean
            model_name:
              type: string
              description: Currently loaded model identifier
              example: "qwen2.5-coder:32b"
            analyses_completed:
              type: integer
              description: Successful analyses since last restart
            analyses_failed:
              type: integer
              description: >
                Analyses that returned 422 or 504 since last restart.
                Growing failure count is a signal to check model health.
            analyses_escalated:
              type: integer
              description: >
                Analyses where the model requested escalation.
                High escalation rate may indicate insufficient
                supporting_data being provided by callers.
            validation_failure_rate:
              type: string
              description: >
                Ratio of 422 responses to total completed analyses
                as decimal string. Above 0.05 warrants investigation.
              example: "0.02"
            average_first_tap_ms:
              type: integer
              description: Rolling average first tap latency since last restart
            average_second_tap_ms:
              type: integer
              description: Rolling average second tap latency since last restart
            uptime_seconds:
              type: integer
    
        Error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
              example: "MODEL_UNAVAILABLE"
            message:
              type: string
              example: "Ollama instance unreachable at configured endpoint"
  augur-canis.yaml: |
    openapi: 3.1.0
    
    info:
      title: SETI - Augur Canis (AC)
      description: |
        Augur Canis (AC) is a standard TCA component — not SETI-specific.
        Every TCA constellation includes one. It provides behavioral health
        verification for every Job in the constellation and publishes health
        state to a Redis pub/sub channel that SETI subscribes to.
    
        NETWORK TOPOLOGY — POINT-TO-POINT ISOLATION:
        Augur Canis connects to each Job via its own dedicated network
        containing exactly two members: Augur Canis and that Job. If the
        constellation has N Jobs, there are N dedicated watchdog networks.
        No Job has visibility into any other Job through these networks.
        A compromised Job sees only Augur Canis on its dedicated link and
        cannot initiate to Augur Canis — Augur Canis is the sole initiator
        on all point-to-point networks.
    
        This is categorically different from a shared watchdog network, where
        a compromised Job could reach all other Jobs. Point-to-point networks
        mean the blast radius of any compromise stops at that Job's own
        networks plus its dedicated watchdog link — and the watchdog link
        cannot be used by the compromised Job to pivot.
    
        HEALTH CHECK MECHANISM — REDIS-MEDIATED:
        Health checks work through Redis pub/sub with no open HTTP ports on
        any Job. The mechanism:
    
        1. The healthcheck binary inside a Job publishes a check request to
           Redis channel tca:check-requests with a unique request_id,
           container_id, and service_name.
        2. Augur Canis subscribes to tca:check-requests, receives the
           request, looks up the canned query for service_name from its DB.
        3. Augur Canis executes the canned query over the dedicated mTLS
           point-to-point network to that Job.
        4. Augur Canis publishes the result to tca:check-results:{request_id}
           with a 30-second TTL. The TTL prevents accumulation if the
           healthcheck binary crashes or times out before reading.
        5. The healthcheck binary subscribes to tca:check-results:{request_id},
           reads the result, exits 0 (healthy) or 1 (unhealthy).
    
        Augur Canis never needs to be a server on the point-to-point networks.
        It remains the sole initiator on those links. No Job ever makes a
        direct network call to Augur Canis. Redis is the coordination layer.
    
        CONTRACT TEST EXECUTION — REDIS-MEDIATED:
        Augur Canis is also the sole executor for SETI Contract Tests. SETI's
        Contract Test Job publishes test requests to the constellation's Redis
        — the same Redis instance Augur Canis already uses. AC subscribes,
        executes each test over the dedicated point-to-point mTLS network to
        the target Job, and publishes results back.
    
        Contract Test never has direct network access to any constellation Job.
        AC is the sole executor on point-to-point networks — for both health
        checks and contract tests. The JWT for authenticated endpoints travels
        inside the test request payload; SETI obtains it via its service account
        credentials from that constellation's Signal Clearance and packages it
        with each request.
    
        Mechanism:
        1. SETI Contract Test publishes to tca:contract-requests on the target
           constellation's Redis. Payload: request_id, service_name, method,
           path, headers (including Authorization if required), body,
           expected_status, expected_response_fields.
        2. AC subscribes to tca:contract-requests, routes to the appropriate
           Job over its dedicated point-to-point network.
        3. AC publishes result to tca:contract-results with 60-second TTL.
        4. SETI Contract Test correlates by request_id, passes to Results Job.
    
        For SETI self-registration, SETI and AC share the same Redis instance.
    
        CANNED QUERIES:
        Augur Canis stores a query definition per Job in its own isolated DB.
        A query is the simplest possible behavioral verification for that Job —
        the minimum request that confirms the Job is alive and responding
        correctly per its contract. Not a contract test. Not a Plot. Just
        enough to distinguish "running and healthy" from "running and broken."
    
        Query definitions are versioned and updateable by the Sec Wr4ngler
        without code changes. The version used is recorded in every check
        result for audit purposes. As a constellation evolves, query
        definitions evolve with it — Augur Canis does not need to be
        redeployed to update a check.
    
        HEALTH FEED:
        Augur Canis publishes all check results to Redis channel tca:augur-canis
        — one channel per constellation carrying health state, latency, and
        time-to-complete for every Job. SETI subscribes to this channel
        alongside tca:events to get constellation health state. The channel
        is designed for trend analysis — the Sec Wr4ngler adds finer-grained
        monitoring as needed.
    
        STUB STATUS: Core Redis pub/sub health check mechanism is stubbed.
        Canned query execution against point-to-point networks is stubbed.
        The /check-request endpoint (for healthcheck binary registration)
        and the tca:augur-canis publisher are the implementation targets.
        Admin and configuration endpoints are implemented.
    
        Internal service — mTLS only on point-to-point Job networks.
        Admin API reachable via Policy Job on the SETI internal network.
      version: 0.3.0
    
    x-tca-security:
      transport: mtls
      tls-min-version: "1.3"
      client-cert-required: true
      reject-without-client-cert: true
      ca-cert: /certs/ca.crt
      service-cert: /certs/watchdog.crt
      service-key: /certs/watchdog.key
      implementation:
        server:
          load-ca-cert: true
          load-service-cert: true
          load-service-key: true
          require-and-verify-client-cert: true
        client:
          load-ca-cert: true
          load-service-cert: true
          load-service-key: true
          verify-server-cert: true
      notes: >
        Augur Canis is primarily an mTLS client — it initiates outbound to
        every Job over dedicated point-to-point networks. It is also an mTLS
        server for admin API calls from the Policy Job and Gateway.
        On point-to-point networks Augur Canis presents its certificate and
        verifies the Job's certificate on every check. Jobs cannot initiate
        connections to Augur Canis over these links — Augur Canis is the
        sole initiator. The check request/response coordination happens
        through Redis, not through the point-to-point network links.
    
    x-tca-observability:
      report-outbound-calls: true
      endpoint: https://seti-observability:4011/event
      pattern: fire-and-forget
      caller-name: "augur-canis"
      required-fields:
        - caller
        - callee
        - method
        - path
        - status_code
        - latency_ms
        - protocol
      implementation:
        timing: wrap-every-outbound-http-call
        non-blocking: true
        on-failure: log-and-drop
        do-not-instrument:
          - seti-observability
      notes: >
        Report all outbound HTTP calls. Augur Canis's primary outbound
        calls are the canned query executions against each Job over the
        point-to-point networks. Every check execution is reported —
        caller: watchdog, callee: the checked service name. This makes
        Watchdog check traffic visible in the SETI observability stream
        separately from normal application traffic.
    
    servers:
      - url: https://augur-canis:4010
        description: Internal SETI network (mTLS enforced) — admin API only
    
    tags:
      - name: queries
        description: Canned query definition management
      - name: checks
        description: Check execution and result retrieval
      - name: jobs
        description: Registered Job management
      - name: configuration
        description: Watchdog behavioral configuration
      - name: health
        description: Watchdog agent health
    
    paths:
    
      # ---------------------------------------------------------------------------
      # CANNED QUERY MANAGEMENT
      # ---------------------------------------------------------------------------
    
      /queries:
        get:
          tags: [queries]
          summary: List all canned query definitions
          description: |
            Returns all canned query definitions across all registered Jobs.
            Each definition describes the minimal behavioral verification
            for one Job — what to call, what to send, what to expect back.
          responses:
            '200':
              description: Query definitions returned
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/QueryDefinitionList'
            '500':
              description: Internal error
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
    
      /queries/{service_name}:
        get:
          tags: [queries]
          summary: Get the canned query definition for a specific Job
          parameters:
            - name: service_name
              in: path
              required: true
              schema:
                type: string
              example: "gateway"
          responses:
            '200':
              description: Query definition returned
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/QueryDefinition'
            '404':
              description: No query defined for this service
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
            '500':
              description: Internal error
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
    
        put:
          tags: [queries]
          summary: Create or update a canned query definition
          description: |
            Defines or updates the canned query for a Job. The query is the
            simplest possible behavioral verification — the minimum request
            that confirms the Job is alive and responding correctly per its
            contract. Version is auto-incremented on update.
    
            The Sec Wr4ngler owns query definitions. Updates take effect
            on the next check cycle — no redeployment required.
          parameters:
            - name: service_name
              in: path
              required: true
              schema:
                type: string
          requestBody:
            required: true
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/QueryDefinitionInput'
                example:
                  description: "Minimal GET /health verification for gateway"
                  method: "GET"
                  path: "/health"
                  expected_status: 200
                  timeout_ms: 2000
                  notes: "Gateway /health does not require auth — simplest possible check"
          responses:
            '200':
              description: Query definition updated
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/QueryDefinition'
            '201':
              description: Query definition created
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/QueryDefinition'
            '400':
              description: Invalid query definition
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
            '404':
              description: Service not registered with Watchdog
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
            '500':
              description: Internal error
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
    
        delete:
          tags: [queries]
          summary: Remove a canned query definition
          description: |
            Removes the query definition for a Job. The Job will no longer
            be checked until a new query is defined. Watchdog logs a warning
            on each check cycle for Jobs with no query defined.
          parameters:
            - name: service_name
              in: path
              required: true
              schema:
                type: string
          responses:
            '200':
              description: Query definition removed
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/QueryRemovalResult'
            '404':
              description: Query definition not found
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
            '500':
              description: Internal error
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
    
      # ---------------------------------------------------------------------------
      # CHECK RESULTS
      # ---------------------------------------------------------------------------
    
      /checks/recent:
        get:
          tags: [checks]
          summary: Get recent check results across all Jobs
          description: |
            Returns the most recent check result per Job plus aggregate
            health statistics. Designed for the admin dashboard view —
            a quick health picture of the full constellation.
          parameters:
            - name: limit
              in: query
              required: false
              schema:
                type: integer
                minimum: 1
                maximum: 100
                default: 50
          responses:
            '200':
              description: Recent check results returned
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/RecentChecksResponse'
            '500':
              description: Internal error
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
    
      /checks/{service_name}:
        get:
          tags: [checks]
          summary: Get check history for a specific Job
          parameters:
            - name: service_name
              in: path
              required: true
              schema:
                type: string
            - name: limit
              in: query
              required: false
              schema:
                type: integer
                minimum: 1
                maximum: 100
                default: 20
          responses:
            '200':
              description: Check history returned
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/CheckHistory'
            '404':
              description: Service not registered
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
            '500':
              description: Internal error
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
    
      /checks/trigger/{service_name}:
        post:
          tags: [checks]
          summary: Trigger an immediate check for a specific Job
          description: |
            STUB — logs trigger and returns last known state.
    
            When implemented: immediately executes the canned query for the
            specified Job over its dedicated point-to-point network and
            returns the result. Use for on-demand verification after
            a deployment or suspected issue.
          parameters:
            - name: service_name
              in: path
              required: true
              schema:
                type: string
          responses:
            '200':
              description: Check result returned (stub returns last known state)
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/CheckResult'
            '404':
              description: Service not registered
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
            '500':
              description: Internal error
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
    
      # ---------------------------------------------------------------------------
      # REGISTERED JOBS
      # ---------------------------------------------------------------------------
    
      /jobs:
        get:
          tags: [jobs]
          summary: List all Jobs registered with Augur Canis
          description: |
            Returns all Jobs Augur Canis knows about — their network
            endpoint on the dedicated point-to-point network, query
            definition status, and last check result.
          responses:
            '200':
              description: Registered Jobs returned
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/RegisteredJobList'
            '500':
              description: Internal error
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
    
        post:
          tags: [jobs]
          summary: Register a Job with Augur Canis
          description: |
            Registers a Job for health monitoring. On registration the
            Watchdog records the Job's endpoint on its dedicated
            point-to-point network and begins including it in check cycles.
            A canned query must be defined separately via PUT /queries/{service_name}.
          requestBody:
            required: true
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/JobRegistration'
                example:
                  service_name: "gateway"
                  network_endpoint: "https://gateway:4000"
                  description: "SETI external gateway"
          responses:
            '201':
              description: Job registered
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/RegisteredJob'
            '400':
              description: Invalid registration
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
            '409':
              description: Job already registered
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
            '500':
              description: Internal error
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
    
      /jobs/{service_name}:
        delete:
          tags: [jobs]
          summary: Deregister a Job from Watchdog monitoring
          parameters:
            - name: service_name
              in: path
              required: true
              schema:
                type: string
          responses:
            '200':
              description: Job deregistered
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/JobDeregistrationResult'
            '404':
              description: Job not registered
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
            '500':
              description: Internal error
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
    
      # ---------------------------------------------------------------------------
      # CONFIGURATION
      # ---------------------------------------------------------------------------
    
      /configuration:
        get:
          tags: [configuration]
          summary: Get current Watchdog configuration
          responses:
            '200':
              description: Configuration returned
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/WatchdogConfiguration'
            '500':
              description: Internal error
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
    
        put:
          tags: [configuration]
          summary: Update Watchdog configuration
          description: |
            Updates check interval, result TTL, and other behavioral
            parameters. Changes take effect on the next check cycle.
          requestBody:
            required: true
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/WatchdogConfigurationUpdate'
          responses:
            '200':
              description: Configuration updated
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/WatchdogConfiguration'
            '400':
              description: Invalid configuration
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
            '500':
              description: Internal error
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
    
      /health:
        get:
          tags: [health]
          summary: Watchdog agent health
          responses:
            '200':
              description: Health status returned
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/HealthResponse'
    
      /federation/register:
        post:
          tags: [federation]
          summary: Register SETI as a verified federation observer
          description: |
            Called by SETI when a Sec Wr4ngler adds a new constellation to
            the monitoring board. SETI presents its star-gazer certificate
            signature to prove its identity.
    
            On receipt, AC:
            1. Verifies the request signature against the known SETI star-gazer
               public key (pre-distributed via the orchestrator at deploy time).
            2. Generates a new session key pair specific to this SETI registration.
            3. Returns the session public certificate to SETI.
            4. Begins signing all tca:augur-canis feed events with the session
               private key.
    
            The session key pair is ephemeral — it lives in AC memory only.
            If AC restarts, the session certificate is lost. SETI detects feed
            silence or signature verification failure and re-submits registration.
            AC treats every registration request identically regardless of whether
            it is a first registration or a re-registration after restart.
          requestBody:
            required: true
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/FederationRegistrationRequest'
          responses:
            '200':
              description: Registration accepted, session certificate returned
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/FederationRegistrationResponse'
            '401':
              description: Star-gazer signature verification failed
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
            '400':
              description: Malformed request
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
    
      /federation/status:
        get:
          tags: [federation]
          summary: Get current federation registration status
          description: |
            Returns whether SETI is currently registered as a federation
            observer, and when the session certificate was last issued.
            Useful for diagnosing feed delivery issues.
          responses:
            '200':
              description: Federation status
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/FederationStatus'
    
      /services/register:
        post:
          tags: [services]
          summary: Self-register a constellation service with Augur Canis
          description: |
            Called by each TCA service on startup. The service signs its
            registration payload with its own private key (from the shared
            certs volume). AC verifies the signature against the constellation
            CA certificate before accepting the registration.
    
            This replaces the bootstrap hardcoded registry. Once self-registration
            is implemented, AC builds its job map dynamically from verified
            registrations rather than a compile-time list.
    
            A service that fails signature verification is logged and rejected.
            It will not appear in the AC job registry and will not receive
            health check queries.
    
            Idempotent — a service that restarts and re-registers simply
            refreshes its entry. AC does not distinguish first registration
            from re-registration.
          requestBody:
            required: true
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/ServiceRegistrationRequest'
          responses:
            '200':
              description: Registration accepted
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/ServiceRegistrationAck'
            '401':
              description: Service signature verification failed
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
            '400':
              description: Malformed registration payload
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
    
    
    components:
      schemas:
    
        QueryDefinitionInput:
          type: object
          required:
            - description
            - method
            - path
            - expected_status
            - timeout_ms
          properties:
            description:
              type: string
              description: >
                Human-readable description of what this query verifies and
                why it was chosen as the minimal check for this Job.
              example: "Minimal GET /health verification — confirms Job is alive and TLS is functioning"
            method:
              type: string
              enum: [GET, POST, PUT, PATCH, DELETE]
              example: "GET"
            path:
              type: string
              description: Request path to call on the Job
              example: "/health"
            request_body:
              type: object
              description: >
                Optional request body for POST/PUT checks. Must be minimal —
                the simplest payload that produces a meaningful response.
                Financial values must be strings.
            expected_status:
              type: integer
              description: HTTP status code that indicates a healthy response
              example: 200
            expected_response_field:
              type: string
              description: >
                Optional dot-notation path to a field in the response body.
                If present, the field must exist for the check to pass.
              example: "status"
            expected_response_value:
              description: >
                Optional expected value for expected_response_field.
                If present, the field must equal this value.
              example: "healthy"
            timeout_ms:
              type: integer
              minimum: 100
              maximum: 10000
              description: >
                Maximum time to wait for a response before marking unhealthy.
                Should be well below the Docker/K8s healthcheck timeout.
              example: 2000
            notes:
              type: string
              description: >
                Additional context for the Sec Wr4ngler — why this specific
                check was chosen, any known caveats, when it should be updated.
    
        QueryDefinition:
          allOf:
            - $ref: '#/components/schemas/QueryDefinitionInput'
            - type: object
              required:
                - service_name
                - version
                - created_at
                - updated_at
              properties:
                service_name:
                  type: string
                  example: "gateway"
                version:
                  type: integer
                  description: >
                    Auto-incremented on each update. Recorded in every check
                    result for audit purposes. When a check starts failing
                    after a query update, the version number identifies which
                    definition was in use.
                  example: 3
                created_at:
                  type: string
                  format: date-time
                updated_at:
                  type: string
                  format: date-time
    
        QueryDefinitionList:
          type: object
          required:
            - queries
            - total
          properties:
            queries:
              type: array
              items:
                $ref: '#/components/schemas/QueryDefinition'
            total:
              type: integer
    
        QueryRemovalResult:
          type: object
          required:
            - service_name
            - version_removed
            - removed_at
          properties:
            service_name:
              type: string
            version_removed:
              type: integer
            removed_at:
              type: string
              format: date-time
    
        CheckResult:
          type: object
          required:
            - request_id
            - service_name
            - healthy
            - latency_ms
            - time_to_complete_ms
            - query_version
            - checked_at
            - stub_active
          properties:
            request_id:
              type: string
              description: Unique identifier correlating the check request to this result
              example: "chk-a1b2c3d4"
            service_name:
              type: string
              example: "gateway"
            healthy:
              type: integer
              enum: [0, 1]
              description: >
                1 — Job responded correctly to the canned query within timeout.
                0 — Job did not respond, responded incorrectly, or timed out.
            failure_reason:
              type: string
              description: >
                Present when healthy is 0. Describes why the check failed.
                Connection refused, timeout, unexpected status code, missing
                response field, or unexpected response value.
              example: "Timeout after 2000ms — no response received"
            latency_ms:
              type: integer
              description: >
                Time from when Augur Canis initiated the canned query to
                when the response was received. Excludes Redis coordination
                overhead — measures only the Job's actual response time.
            time_to_complete_ms:
              type: integer
              description: >
                Total time from check request publication to result publication.
                Includes Redis pub/sub coordination overhead plus query latency.
                This is the value that appears in the tca:augur-canis feed and
                maps to the health check timeout in Docker/K8s configuration.
            query_version:
              type: integer
              description: Version of the query definition used for this check
            checked_at:
              type: string
              format: date-time
            stub_active:
              type: boolean
              description: >
                True when Augur Canis is in stub mode. A result with
                stub_active: true does not reflect real Job health.
    
        CheckHistory:
          type: object
          required:
            - service_name
            - results
            - total
            - healthy_count
            - unhealthy_count
            - average_latency_ms
          properties:
            service_name:
              type: string
            results:
              type: array
              items:
                $ref: '#/components/schemas/CheckResult'
            total:
              type: integer
            healthy_count:
              type: integer
            unhealthy_count:
              type: integer
            average_latency_ms:
              type: integer
              description: Rolling average latency across returned results
    
        RecentChecksResponse:
          type: object
          required:
            - checks
            - total_jobs
            - healthy_jobs
            - unhealthy_jobs
            - jobs_with_no_query
            - generated_at
          properties:
            checks:
              type: array
              items:
                $ref: '#/components/schemas/CheckResult'
              description: Most recent result per Job
            total_jobs:
              type: integer
            healthy_jobs:
              type: integer
            unhealthy_jobs:
              type: integer
            jobs_with_no_query:
              type: integer
              description: >
                Jobs registered but with no query definition. These are not
                checked and generate a warning in the tca:augur-canis feed.
            generated_at:
              type: string
              format: date-time
    
        JobRegistration:
          type: object
          required:
            - service_name
            - network_endpoint
            - description
          properties:
            service_name:
              type: string
              description: >
                Service name exactly as it appears in the constellation.
                Must match the tca:check-requests service_name field sent
                by the healthcheck binary in this Job's container.
              example: "gateway"
            network_endpoint:
              type: string
              description: >
                The Job's address on its dedicated Watchdog point-to-point
                network. The Watchdog calls this endpoint when executing
                the canned query for this Job.
              example: "https://gateway:4000"
            description:
              type: string
              example: "SETI external gateway"
    
        RegisteredJob:
          type: object
          required:
            - service_name
            - network_endpoint
            - description
            - has_query
            - registered_at
          properties:
            service_name:
              type: string
            network_endpoint:
              type: string
            description:
              type: string
            has_query:
              type: boolean
              description: Whether a canned query definition exists for this Job
            last_check:
              $ref: '#/components/schemas/CheckResult'
              description: Most recent check result. Absent if never checked.
            registered_at:
              type: string
              format: date-time
    
        RegisteredJobList:
          type: object
          required:
            - jobs
            - total
          properties:
            jobs:
              type: array
              items:
                $ref: '#/components/schemas/RegisteredJob'
            total:
              type: integer
    
        JobDeregistrationResult:
          type: object
          required:
            - service_name
            - deregistered_at
          properties:
            service_name:
              type: string
            deregistered_at:
              type: string
              format: date-time
    
        WatchdogConfiguration:
          type: object
          required:
            - check_interval_seconds
            - result_ttl_seconds
            - feed_channel
            - request_channel
            - stub_active
            - jobs_registered
            - queries_defined
          properties:
            check_interval_seconds:
              type: integer
              description: >
                How often Augur Canis cycles through all registered Jobs
                and publishes health state to tca:augur-canis. Default 30.
              example: 30
            result_ttl_seconds:
              type: integer
              description: >
                TTL on tca:check-results:{request_id} keys in Redis.
                Prevents accumulation when healthcheck binary times out.
                Default 30. May be reduced as check latencies become known.
              example: 30
            feed_channel:
              type: string
              description: Redis channel for health state publication
              example: "tca:augur-canis"
            request_channel:
              type: string
              description: Redis channel Augur Canis subscribes to for check requests
              example: "tca:check-requests"
            stub_active:
              type: boolean
              description: >
                True when canned query execution is stubbed. Checks are
                simulated — results do not reflect real Job health.
            jobs_registered:
              type: integer
            queries_defined:
              type: integer
    
        WatchdogConfigurationUpdate:
          type: object
          properties:
            check_interval_seconds:
              type: integer
              minimum: 10
              maximum: 300
            result_ttl_seconds:
              type: integer
              minimum: 5
              maximum: 60
              description: >
                Keep this well above the expected time_to_complete_ms for
                the slowest Job in the constellation. A TTL shorter than
                the actual check time means the healthcheck binary will
                always time out waiting for a result that already expired.
    
        HealthResponse:
          type: object
          required:
            - status
            - stub_active
            - jobs_registered
            - queries_defined
            - checks_completed
            - checks_failed
            - redis_connected
            - last_cycle_at
            - uptime_seconds
          properties:
            status:
              type: string
              enum: [healthy, stub_active, degraded]
              description: >
                healthy — check cycles running, Redis connected, real checks.
                stub_active — running in stub mode, no real check execution.
                degraded — Redis disconnected or check cycle stalled.
            stub_active:
              type: boolean
            jobs_registered:
              type: integer
            queries_defined:
              type: integer
            checks_completed:
              type: integer
              description: Total check executions since last restart
            checks_failed:
              type: integer
              description: >
                Checks where healthy was 0. Growing without bound indicates
                a systematic problem with one or more Jobs.
            redis_connected:
              type: boolean
            last_cycle_at:
              type: string
              format: date-time
              description: >
                Timestamp of the last complete check cycle across all Jobs.
                Significantly in the past indicates the cycle scheduler stalled.
            uptime_seconds:
              type: integer
    
    
        FederationRegistrationRequest:
          type: object
          required: [seti_instance_id, star_gazer_public_cert, timestamp, signature]
          properties:
            seti_instance_id:
              type: string
              description: >
                Unique identifier for this SETI instance. Allows AC to associate
                the registration with a specific SETI deployment.
            star_gazer_public_cert:
              type: string
              description: >
                SETI's star-gazer public certificate in PEM format.
                AC stores this for verifying future requests from this SETI instance.
            timestamp:
              type: string
              format: date-time
              description: >
                Registration request timestamp. Included in the signed payload
                to prevent replay attacks.
            signature:
              type: string
              description: >
                Base64-encoded signature of (seti_instance_id + timestamp) signed
                with the star-gazer private key. AC verifies this against the
                star-gazer public cert before proceeding.
    
        FederationRegistrationResponse:
          type: object
          required: [session_cert, session_cert_id, issued_at, feed_channel]
          properties:
            session_cert:
              type: string
              description: >
                Session public certificate in PEM format. SETI stores this and
                uses it to verify the signature on every event published to
                the tca:augur-canis Redis channel. Ephemeral — invalidated when
                AC restarts.
            session_cert_id:
              type: string
              description: >
                Short identifier for the session certificate. Included in every
                signed event so SETI can detect certificate rotation without
                attempting verification with a stale cert.
            issued_at:
              type: string
              format: date-time
            feed_channel:
              type: string
              description: >
                Redis channel name for this constellation's AC health feed.
                Typically tca:augur-canis but may be namespaced in multi-tenant
                deployments.
            constellation_id:
              type: string
              description: >
                Identifier for this constellation as known to the AC.
    
        FederationStatus:
          type: object
          required: [registered, constellation_id]
          properties:
            registered:
              type: boolean
            constellation_id:
              type: string
            session_cert_id:
              type: string
              description: Present when registered is true
            registered_at:
              type: string
              format: date-time
              description: When the current session was established
            events_signed:
              type: integer
              description: Count of events signed in current session
    
        ServiceRegistrationRequest:
          type: object
          required: [service_name, network_endpoint, cert_fingerprint, timestamp, signature]
          properties:
            service_name:
              type: string
              description: >
                Service name as it appears in the constellation's OpenAPI contracts.
                Must match the CN of the service's TLS certificate.
            network_endpoint:
              type: string
              description: >
                HTTPS endpoint AC uses to execute canned queries against this service.
                Typically https://{service_name}:{port}.
            networks:
              type: array
              items:
                type: string
              description: >
                Docker/K8s networks this service is attached to. Used by the
                Bridge pattern for topology verification (future iteration).
            cert_fingerprint:
              type: string
              description: >
                SHA-256 fingerprint of the service's TLS certificate. AC records
                this to detect certificate rotation between restarts.
            timestamp:
              type: string
              format: date-time
              description: >
                Registration timestamp. Included in the signed payload to
                prevent replay attacks.
            signature:
              type: string
              description: >
                Base64-encoded signature of (service_name + network_endpoint +
                cert_fingerprint + timestamp) signed with the service's private key.
                AC verifies against the constellation CA certificate.
    
        ServiceRegistrationAck:
          type: object
          required: [service_name, registered_at, status]
          properties:
            service_name:
              type: string
            registered_at:
              type: string
              format: date-time
            status:
              type: string
              enum: [registered, refreshed]
              description: >
                registered — first time this service has registered in this
                AC session.
                refreshed — service was already known, entry updated (restart
                or re-registration).
    
    
        Error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
              example: "SERVICE_NOT_REGISTERED"
            message:
              type: string
              example: "Service 'gateway' is not registered with Augur Canis"
    
      # ---------------------------------------------------------------------------
      # Redis channel documentation
      # ---------------------------------------------------------------------------
      # tca:check-requests — Watchdog subscribes
      #   Published by: healthcheck binary inside each Job container
      #   Schema: { request_id: string, container_id: string, service_name: string,
      #             published_at: ISO8601 }
      #
      # tca:check-results:{request_id} — healthcheck binary subscribes
      #   Published by: Watchdog after executing canned query
      #   TTL: 30 seconds (configurable, see result_ttl_seconds)
      #   Schema: { request_id: string, healthy: 0|1, latency_ms: int,
      #             time_to_complete_ms: int, failure_reason?: string,
      #             query_version: int, checked_at: ISO8601 }
      #   Exit codes: healthy=1 → exit 0, healthy=0 → exit 1
      #
      # tca:augur-canis — SETI Signal Aggregator subscribes
      #   Published by: AC after each check cycle and individual checks
      #   Schema: { service_name: string, healthy: 0|1, latency_ms: int,
      #             time_to_complete_ms: int, query_version: int,
      #             failure_reason?: string, checked_at: ISO8601,
      #             constellation: string }
      #
      # tca:augur-canis:alerts — SETI, operators, AI monitors subscribe
      #   Published by: AC on condition detection, each bark, on resolve
      #   Schema: { alert_id, service_name, alert_type, severity, message,
      #             triggered_at, bark_number?, resolution_type?, constellation }
      #
      # tca:contract-requests — AC subscribes
      #   Published by: SETI Contract Test Job
      #   TTL: none (consumed immediately or discarded)
      #   Schema: { request_id: string, service_name: string, method: string,
      #             path: string, headers: object, body?: object,
      #             expected_status: int, expected_response_fields?: string[],
      #             test_name: string, contract_version: string,
      #             published_at: ISO8601 }
      #
      # tca:contract-results — SETI Contract Test Job subscribes
      #   Published by: AC after executing contract test request
      #   TTL: 60 seconds
      #   Schema: { request_id: string, service_name: string, test_name: string,
      #             passed: bool, actual_status: int, expected_status: int,
      #             actual_response?: object, failure_reason?: string,
      #             latency_ms: int, executed_at: ISO8601 }
  cert-forge.yaml: |
    openapi: 3.1.0
    
    info:
      title: TCA SETI - cert-forge
      description: |
        PKI abstraction layer for the TCA constellation. Every Job that needs
        cryptographic material — instance certificates, CA trust anchors, signed
        payloads — obtains it through cert-forge. No Job reads from the certs
        volume directly or performs cryptographic operations independently.
    
        This boundary means swapping the underlying PKI implementation (from
        self-generated to Vault, an enterprise CA, or any other provider) requires
        changes only to cert-forge. All other Jobs are unchanged.
    
        cert-forge starts by generating its own certificate, brings up this API,
        then generates the CA and any static certs required by the constellation.
        Services call this API on startup to obtain their instance certificate.
    
        cert-forge holds all private key material. Services never receive or
        store private keys — they call POST /sign when a signature is needed.
        When the signing algorithm changes, only cert-forge changes.
    
        Health verification is handled by Augur Canis via the Redis pub/sub
        healthcheck mechanism — no open HTTP health endpoint. AC's canned query
        for cert-forge is GET /ca, which confirms cert-forge is alive and the
        CA is initialized.
    
        Internal service — mTLS on all endpoints. /ca is the one exception:
        it is unauthenticated because services must retrieve the CA cert before
        they have an instance cert to present.
      version: 1.0.0
    
    x-tca-security:
      transport: mtls
      tls-min-version: "1.3"
      client-cert-required: true
      reject-without-client-cert: true
      ca-cert: /certs/ca.crt
      service-cert: /certs/cert-forge.crt
      service-key: /certs/cert-forge.key
      unauthenticated-paths:
        - /ca
      notes: >
        /ca is intentionally unauthenticated. Services must retrieve the CA public
        cert before they have an instance cert to present — it is needed to build
        the trust pool for all subsequent mTLS calls. The CA cert is public material;
        exposing it unauthenticated is correct and intentional.
    
        All other endpoints require a valid client certificate signed by the
        constellation CA. Connections without a valid client certificate are
        rejected — not downgraded.
    
        cert-forge generates its own certificate on first startup before the HTTP
        server comes up. The bootstrap sequence is: generate own cert in memory →
        start mTLS server using that cert → generate CA → write CA to volume →
        generate static certs (star-gazer, etc.) → ready.
    
    x-tca-observability:
      report-outbound-calls: false
      notes: >
        cert-forge makes no outbound calls. It is a pure responder.
        The x-tca-observability block is present but inactive — cert-forge
        has nothing to report to the Observability Job.
    
    servers:
      - url: https://cert-forge:4014
        description: Internal Docker network (mTLS on all endpoints except /ca)
    
    tags:
      - name: trust
        description: CA trust material
      - name: instance
        description: Instance certificate issuance
      - name: signing
        description: Payload signing on behalf of a service instance
    
    paths:
      /ca:
        get:
          tags: [trust]
          summary: Return the constellation CA public certificate
          description: |
            Returns the CA public certificate in PEM format. Unauthenticated —
            services call this before they have an instance cert, to build
            their mTLS trust pool.
    
            Returns only the public certificate. The CA private key is never
            exposed through any API endpoint under any circumstances.
    
            When the underlying PKI transitions to an enterprise CA, this endpoint
            returns that CA's public certificate. All callers are unaffected.
    
            This endpoint also serves as Augur Canis's canned query for cert-forge
            health verification — if this returns 200, cert-forge is alive and
            the CA is initialized.
          responses:
            '200':
              description: CA certificate PEM
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/CACertResponse'
            '503':
              description: CA not yet initialized
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
    
      /instance-cert:
        post:
          tags: [instance]
          summary: Issue an instance certificate for a service
          description: |
            Generates a certificate for a specific service instance and returns
            it to the caller. cert-forge retains the private key — the caller
            receives only the public certificate and fingerprint.
    
            The certificate CN is {service_name}-{instance_id}, making each
            container instance cryptographically distinct. SANs include both
            the service name (for service-level routing) and the full instance
            CN (for instance-level audit).
    
            The private key is held in cert-forge's memory only. It is never
            written to disk and never returned to the caller. When the container
            exits, the key is gone. A restarting container calls this endpoint
            again and receives a new cert backed by a new key.
    
            mTLS required. On first startup, the calling service presents the
            bootstrap cert issued during cert-forge's static cert generation.
          requestBody:
            required: true
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/InstanceCertRequest'
          responses:
            '200':
              description: Instance certificate issued
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/InstanceCertResponse'
            '400':
              description: Invalid request
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
            '503':
              description: CA not yet initialized
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
    
      /sign:
        post:
          tags: [signing]
          summary: Sign a payload on behalf of a service instance
          description: |
            Signs a payload using the private key cert-forge holds for the
            specified service instance. The caller never has access to the
            private key — signing is always delegated to cert-forge.
    
            This means the signing algorithm is entirely cert-forge's concern.
            When cryptographic requirements change (SHA256 → SHA512, RSA → ECDSA,
            or post-quantum algorithms), only cert-forge changes. No other Job
            is affected.
    
            The payload is base64-encoded by the caller. cert-forge decodes it,
            signs it using the instance's held key and current algorithm
            configuration, and returns the base64-encoded signature.
    
            mTLS required. The client certificate presented must correspond to
            the service_name and instance_id in the request body — cert-forge
            verifies that the caller is who they claim to be before signing.
    
            Returns the fingerprint of the signing cert alongside the signature
            so the verifier can confirm which cert was used.
          requestBody:
            required: true
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/SignRequest'
          responses:
            '200':
              description: Payload signed
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/SignResponse'
            '400':
              description: Invalid request or malformed payload
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
            '401':
              description: Client cert does not match claimed service/instance identity
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
            '404':
              description: No key on record for this service/instance combination
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
            '503':
              description: CA not yet initialized
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
    
    components:
      schemas:
        CACertResponse:
          type: object
          required: [ca_cert, common_name]
          properties:
            ca_cert:
              type: string
              description: CA public certificate in PEM format
            common_name:
              type: string
              description: CA common name — for logging and diagnostics
    
        InstanceCertRequest:
          type: object
          required: [service_name, instance_id]
          properties:
            service_name:
              type: string
              description: >
                The service's name as it appears in the constellation.
                Must match the service's Docker Compose service name.
                Example: "gateway"
            instance_id:
              type: string
              description: >
                Unique identifier for this specific container instance.
                Use $HOSTNAME — Docker sets this to the container ID,
                providing a stable unique identity for each container.
                Example: "a3f2c1d8e4b7"
    
        InstanceCertResponse:
          type: object
          required: [cert, key, fingerprint, instance_cn, valid_until]
          properties:
            cert:
              type: string
              description: >
                Instance certificate in PEM format. CN is
                {service_name}-{instance_id}. SANs include service_name
                and the full instance CN. Signed by the constellation CA.
            key:
              type: string
              description: >
                RSA private key in PEM format. Delivered over the encrypted
                enrollment mTLS connection — never written to disk, never on
                the shared volume. The service holds this in memory only for
                the duration of its lifetime. When the container exits, the
                key is gone. cert-forge retains a copy for /sign operations.
            fingerprint:
              type: string
              description: >
                SHA-256 fingerprint of the certificate in hex with no colons.
                Used in self-registration payloads sent to Augur Canis.
            instance_cn:
              type: string
              description: The CN assigned to this instance — service_name-instance_id
            valid_until:
              type: string
              format: date-time
              description: Certificate expiry timestamp
    
        SignRequest:
          type: object
          required: [service_name, instance_id, payload]
          properties:
            service_name:
              type: string
              description: Service name — must match the caller's mTLS client cert
            instance_id:
              type: string
              description: Instance ID — must match the caller's mTLS client cert
            payload:
              type: string
              description: Base64-encoded bytes to sign
    
        SignResponse:
          type: object
          required: [signature, fingerprint, algorithm]
          properties:
            signature:
              type: string
              description: >
                Base64-encoded signature over the decoded payload.
                Algorithm is determined by cert-forge configuration —
                callers do not specify or need to know the algorithm.
            fingerprint:
              type: string
              description: >
                Fingerprint of the cert whose key produced this signature.
                The verifier uses this to look up the correct public cert.
            algorithm:
              type: string
              description: >
                Human-readable algorithm identifier for logging and diagnostics.
                Example: "RSASSA-PKCS1-v1_5-SHA256". Callers should log this
                but must not depend on a specific value — it will change when
                cryptographic requirements change, which is the point.
    
        Error:
          type: object
          required: [error]
          properties:
            error:
              type: string
  contract-test.yaml: |
    openapi: 3.1.0
    
    info:
      title: SETI - Contract Test Job
      description: |
        Tier one testing Job for the SETI constellation. Executes lightweight
        schema conformance and status code validation tests against registered
        application contracts. Designed to run safely in production on a
        configurable schedule (default: every 15 minutes per application).
    
        Tests are generated from OpenAPI 3.1 contracts read from registered
        application repositories (contracts folder only). No implementation
        knowledge required or used.
    
        Each test run validates:
        - Request schema conformance (valid and invalid payloads)
        - Response shape conformance against contract-defined schemas
        - Status code correctness for success and error conditions
        - Required field presence and type correctness
        - Financial value handling (string decimal, never number)
    
        This Job does not execute Plot scenarios. That is the Plot Test Job's
        responsibility. Contract Test Job is stateless per run — it reads
        contracts, executes, reports results to Results Job, and exits the
        run cycle cleanly.
    
        Failure response is policy-driven. On test failure this Job calls
        the Policy Job to retrieve the configured response, then routes to
        the Interactions Job accordingly.
    
        Internal service — mTLS only, not externally exposed.
      version: 0.1.0
    
    x-tca-security:
      transport: mtls
      tls-min-version: "1.3"
      client-cert-required: true
      reject-without-client-cert: true
      ca-cert: /certs/ca.crt
      service-cert: /certs/contract-test.crt
      service-key: /certs/contract-test.key
      implementation:
        server:
          load-ca-cert: true
          load-service-cert: true
          load-service-key: true
          require-and-verify-client-cert: true
        client:
          load-ca-cert: true
          load-service-cert: true
          load-service-key: true
          verify-server-cert: true
      notes: >
        Every inbound connection must present a certificate signed by the SETI CA.
        Connections without a valid client certificate must be rejected — not
        downgraded to unauthenticated. This applies to all endpoints including
        /health. The scheduler (Policy Job) and gateway are the only authorized
        callers in normal operation.
    
    x-tca-observability:
      report-outbound-calls: true
      endpoint: https://seti-observability:4011/event
      pattern: fire-and-forget
      caller-name: "contract-test"
      required-fields:
        - caller
        - callee
        - method
        - path
        - status_code
        - latency_ms
        - protocol
      implementation:
        timing: wrap-every-outbound-http-call
        non-blocking: true
        on-failure: log-and-drop
        do-not-instrument:
          - seti-observability
      notes: >
        Every outbound HTTP call this Job makes must be reported to the
        SETI Observability Job. This includes calls to Policy Job, Results Job,
        and Interactions Job. Reports are fire-and-forget — never on the
        critical test path. If Observability Job is unreachable, log locally
        and continue.
    
    servers:
      - url: https://contract-test:4003
        description: Internal SETI network (mTLS enforced)
    
    tags:
      - name: runs
        description: Test run lifecycle management
      - name: health
        description: Service health
    
    paths:
      /run:
        post:
          tags: [runs]
          summary: Execute a contract test run for a registered application
          description: |
            Triggers a full contract test run for the specified application.
            Reads the application's contracts from its registered repository
            path, generates test cases, executes them against the application's
            gateway endpoint, and reports results to the Results Job.
    
            On any test failure, retrieves failure response policy from the
            Policy Job and routes to the Interactions Job accordingly.
    
            Run is synchronous — response is returned when all tests complete
            or the run times out. Timeout is configurable per application in
            the Policy Job. Default timeout: 60 seconds.
          requestBody:
            required: true
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/RunRequest'
                example:
                  application_id: "app-tca-vox-prod"
                  environment: "production"
                  triggered_by: "scheduler"
          responses:
            '200':
              description: Run completed — results available (pass or fail)
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/RunResult'
                  example:
                    run_id: "run-a1b2c3d4"
                    application_id: "app-tca-vox-prod"
                    environment: "production"
                    status: "failed"
                    started_at: "2026-03-27T14:00:00Z"
                    completed_at: "2026-03-27T14:00:12Z"
                    duration_ms: 12043
                    summary:
                      total: 47
                      passed: 45
                      failed: 2
                      skipped: 0
                    failures:
                      - job_name: "vote-handler"
                        endpoint: "POST /vote"
                        test_type: "invalid_payload"
                        expected_status: 400
                        actual_status: 500
                        detail: "Missing required field 'poll_guid' returned 500 instead of 400"
                      - job_name: "poll-builder"
                        endpoint: "GET /polls/{poll_guid}"
                        test_type: "response_schema"
                        expected_field: "status"
                        detail: "Response missing required field 'status'"
                    policy_action: "alert"
            '400':
              description: Invalid run request
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
            '404':
              description: Application not found in registry
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
            '408':
              description: Run timed out
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/RunTimeoutError'
            '500':
              description: Internal error — run could not be executed
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
    
      /run/{run_id}:
        get:
          tags: [runs]
          summary: Retrieve a completed run result
          description: |
            Returns the full result of a previously completed contract test run.
            Results are stored in the Results Job — this endpoint proxies the
            retrieval for callers that only have access to contract-test.
          parameters:
            - name: run_id
              in: path
              required: true
              schema:
                type: string
              description: Run identifier returned by POST /run
              example: "run-a1b2c3d4"
          responses:
            '200':
              description: Run result found
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/RunResult'
            '404':
              description: Run not found
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
            '500':
              description: Internal error
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
    
      /health:
        get:
          tags: [health]
          summary: Service health check
          description: |
            Returns current service health and run statistics since last restart.
            Statistics are in-memory counters — they reset on restart and are
            not persisted.
          responses:
            '200':
              description: Service healthy
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/HealthResponse'
    
    components:
      schemas:
        RunRequest:
          type: object
          required:
            - application_id
            - environment
            - triggered_by
          properties:
            application_id:
              type: string
              description: >
                Registered application identifier from the Policy Job registry.
                Must exist in the registry or the run returns 404.
              example: "app-tca-vox-prod"
            environment:
              type: string
              enum: [production, staging, development]
              description: Target environment for this run
              example: "production"
            triggered_by:
              type: string
              enum: [scheduler, deployment, manual, seti-self]
              description: >
                What triggered this run. Used for audit logging and result
                categorization. seti-self indicates SETI running its own
                contract tests.
              example: "scheduler"
            job_filter:
              type: array
              items:
                type: string
              description: >
                Optional. If provided, only test the specified Jobs within
                the application. If omitted, all Jobs are tested.
                Used for post-deployment validation of a single Job.
              example: ["vote-handler", "poll-builder"]
    
        RunResult:
          type: object
          required:
            - run_id
            - application_id
            - environment
            - status
            - started_at
            - completed_at
            - duration_ms
            - summary
          properties:
            run_id:
              type: string
              description: Unique identifier for this run
              example: "run-a1b2c3d4"
            application_id:
              type: string
              example: "app-tca-vox-prod"
            environment:
              type: string
              enum: [production, staging, development]
            triggered_by:
              type: string
              enum: [scheduler, deployment, manual, seti-self]
            status:
              type: string
              enum: [passed, failed, error, timeout]
              description: >
                passed — all tests passed.
                failed — one or more tests failed against the contract.
                error — run could not complete due to infrastructure issue.
                timeout — run exceeded configured timeout.
            started_at:
              type: string
              format: date-time
              description: ISO 8601 UTC timestamp
            completed_at:
              type: string
              format: date-time
              description: ISO 8601 UTC timestamp
            duration_ms:
              type: integer
              description: Total run duration in milliseconds
            summary:
              $ref: '#/components/schemas/RunSummary'
            failures:
              type: array
              items:
                $ref: '#/components/schemas/TestFailure'
              description: Present when status is failed. Empty array when passed.
            policy_action:
              type: string
              enum: [none, alert, rollback, alert_and_rollback, escalate]
              description: >
                Action taken per policy lookup. none when status is passed.
            cache_status:
              type: string
              enum: [cache_hit, cache_miss, cache_refreshed, cache_unavailable]
              description: >
                cache_hit — tests generated from Redis cache, no repository pull.
                cache_miss — no cache entry found, contracts pulled from repository.
                cache_refreshed — test failure triggered a contract version check;
                contracts re-pulled because version had changed, tests regenerated.
                cache_unavailable — Redis unreachable, contracts pulled from
                repository directly. Run succeeded but caching is degraded.
            cache_refresh_reason:
              type: string
              description: >
                Present when cache_status is cache_refreshed. Describes what
                triggered the refresh and whether the contract version changed.
              example: >
                Test failure triggered refresh. Contract version advanced from
                0.3.0 to 0.4.0. Tests regenerated. Re-run passed — implementation
                already honors updated contract.
    
        RunSummary:
          type: object
          required:
            - total
            - passed
            - failed
            - skipped
          properties:
            total:
              type: integer
              description: Total test cases executed
            passed:
              type: integer
            failed:
              type: integer
            skipped:
              type: integer
              description: Tests skipped due to job_filter or dependency unavailability
    
        TestFailure:
          type: object
          required:
            - job_name
            - endpoint
            - test_type
            - detail
          properties:
            job_name:
              type: string
              description: The Job whose contract test failed
              example: "vote-handler"
            endpoint:
              type: string
              description: The endpoint that failed
              example: "POST /vote"
            test_type:
              type: string
              enum:
                - valid_payload
                - invalid_payload
                - response_schema
                - status_code
                - required_field
                - financial_type
              description: Category of test that failed
            expected_status:
              type: integer
              description: Expected HTTP status code (present for status_code failures)
              example: 400
            actual_status:
              type: integer
              description: Actual HTTP status code received
              example: 500
            expected_field:
              type: string
              description: Field name involved in the failure (present for schema failures)
              example: "status"
            detail:
              type: string
              description: Human-readable failure description
              example: "Missing required field 'poll_guid' returned 500 instead of 400"
    
        RunTimeoutError:
          type: object
          required:
            - run_id
            - application_id
            - timed_out_at_ms
            - completed_jobs
            - pending_jobs
          properties:
            run_id:
              type: string
            application_id:
              type: string
            timed_out_at_ms:
              type: integer
              description: Configured timeout value that was exceeded
            completed_jobs:
              type: array
              items:
                type: string
              description: Jobs that completed testing before timeout
            pending_jobs:
              type: array
              items:
                type: string
              description: Jobs that had not completed when timeout occurred
    
        HealthResponse:
          type: object
          required:
            - status
            - runs_completed
            - runs_failed
            - runs_errored
            - uptime_seconds
          properties:
            status:
              type: string
              enum: [healthy, degraded]
              description: >
                degraded when Results Job or Policy Job are unreachable.
                Tests can still run but results may not be persisted.
            runs_completed:
              type: integer
              description: Total runs completed since last restart
            runs_failed:
              type: integer
              description: Runs where one or more tests failed
            runs_errored:
              type: integer
              description: Runs that could not complete due to infrastructure issues
            uptime_seconds:
              type: integer
    
        Error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
              description: Machine-readable error code
              example: "APPLICATION_NOT_FOUND"
            message:
              type: string
              description: Human-readable error description
              example: "Application 'app-tca-vox-prod' not found in registry"
  feed-wrangler.yaml: |
    openapi: 3.1.0
    
    info:
      title: SETI - Feed Wrangler Job
      description: |
        Coordinates authorized signal delivery to Wr4nglers. The Feed
        Wr4ngler is the ring boss of SETI's external delivery layer —
        it coordinates without owning business logic, routes without
        making policy decisions, and delivers without determining what
        gets delivered.
    
        Feed Wr4ngler handles three distinct concerns:
    
        1. FEED PROVISIONING — receives a feed request from the Gateway
           carrying a clearance token from Signal Clearance. Provisions
           a scoped Redis pub/sub channel keyed to the Wr4ngler's
           authorized scope. Returns the channel identifier to the
           Gateway for SSE delivery.
    
        2. EVENT ROUTING — subscribes to Signal Aggregator event streams
           for each active feed's scope. When events arrive that match
           a feed's scope, Feed Wr4ngler publishes them to the
           appropriate scoped channel. A Wr4ngler subscribed to
           production failures for app-tca-vox only receives events
           that match both dimensions — the routing happens here.
    
        3. FEED LIFECYCLE — manages connection state for all active feeds.
           Handles idle timeouts, JWT expiry-driven closes, and explicit
           close requests. When a feed closes, its Redis pub/sub channel
           is cleaned up immediately.
    
        Feed Wr4ngler is built in Elixir for the same reason TCA Blackjack's
        Chat Service is Elixir — OTP supervision trees mean a crashed feed
        process restarts in isolation without affecting other feeds. Under
        high feed count or noisy event streams, individual feed processes
        that crash do not cascade. Each feed is an isolated OTP process.
    
        Internal service — mTLS only, not externally exposed.
        All Wr4ngler interaction reaches Feed Wr4ngler through the Gateway.
      version: 0.1.0
    
    x-tca-security:
      transport: mtls
      tls-min-version: "1.3"
      client-cert-required: true
      reject-without-client-cert: true
      ca-cert: /certs/ca.crt
      service-cert: /certs/feed-wrangler.crt
      service-key: /certs/feed-wrangler.key
      implementation:
        server:
          load-ca-cert: true
          load-service-cert: true
          load-service-key: true
          require-and-verify-client-cert: true
        client:
          load-ca-cert: true
          load-service-cert: true
          load-service-key: true
          verify-server-cert: true
      notes: >
        Every inbound connection must present a certificate signed by the
        SETI CA. Connections without a valid client certificate must be
        rejected. Authorized callers: Gateway (feed provisioning and
        close requests), Signal Aggregator (event forwarding to active
        feeds). Feed Wr4ngler never calls Signal Clearance directly —
        the Gateway handles clearance validation before calling Feed
        Wr4ngler. The clearance token arrives in the provisioning request
        already validated.
    
    x-tca-observability:
      report-outbound-calls: true
      endpoint: https://seti-observability:4011/event
      pattern: fire-and-forget
      caller-name: "feed-wrangler"
      required-fields:
        - caller
        - callee
        - method
        - path
        - status_code
        - latency_ms
        - protocol
      implementation:
        timing: wrap-every-outbound-http-call
        non-blocking: true
        on-failure: log-and-drop
        do-not-instrument:
          - seti-observability
      notes: >
        Report all outbound HTTP calls. Feed Wr4ngler's primary outbound
        HTTP calls are to Signal Aggregator for event stream subscription
        management. Redis pub/sub operations are not HTTP and are
        instrumented via structured logging only.
    
    servers:
      - url: https://feed-wrangler:4007
        description: Internal SETI network (mTLS enforced)
    
    tags:
      - name: feeds
        description: Feed provisioning and lifecycle management
      - name: health
        description: Service health and active feed statistics
    
    paths:
    
      /feeds:
        post:
          tags: [feeds]
          summary: Provision a new signal feed
          description: |
            Called by the Gateway after Signal Clearance validates the
            Wr4ngler's clearance for the requested scope. The clearance
            token from Signal Clearance is included in the request —
            Feed Wr4ngler verifies the token before provisioning.
    
            On provisioning, Feed Wr4ngler:
            1. Verifies the clearance token (signature and TTL)
            2. Creates an OTP process for this feed
            3. Provisions a scoped Redis pub/sub channel
            4. Registers the feed's scope with Signal Aggregator
               for event routing
            5. Returns the feed_id and channel details to the Gateway
    
            The feed is immediately ready for SSE connection. The
            30-second idle timeout begins from provisioning, not from
            SSE connection. Connect promptly.
          requestBody:
            required: true
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/FeedProvisionRequest'
          responses:
            '201':
              description: Feed provisioned successfully
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/FeedRecord'
            '400':
              description: Invalid provisioning request
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
            '401':
              description: Invalid or expired clearance token
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
            '500':
              description: Internal error
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
    
        get:
          tags: [feeds]
          summary: List active feeds
          description: |
            Returns all currently active feeds. Used for operational
            monitoring — high feed count or stale feeds (open but
            inactive) are signals worth watching.
          responses:
            '200':
              description: Active feeds returned
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/FeedList'
            '500':
              description: Internal error
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
    
      /feeds/{feed_id}:
        get:
          tags: [feeds]
          summary: Get a specific feed's state
          parameters:
            - name: feed_id
              in: path
              required: true
              schema:
                type: string
              example: "feed-a1b2c3d4"
          responses:
            '200':
              description: Feed record returned
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/FeedRecord'
            '404':
              description: Feed not found or already closed
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
            '500':
              description: Internal error
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
    
        delete:
          tags: [feeds]
          summary: Close a feed
          description: |
            Closes the feed's OTP process, unsubscribes from Signal
            Aggregator event routing, and releases the Redis pub/sub
            channel. Called by the Gateway on explicit Wr4ngler close
            request, JWT expiry, or idle timeout.
          parameters:
            - name: feed_id
              in: path
              required: true
              schema:
                type: string
          requestBody:
            required: true
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/FeedCloseRequest'
          responses:
            '200':
              description: Feed closed and resources released
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/FeedCloseResult'
            '404':
              description: Feed not found or already closed
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
            '500':
              description: Internal error
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
    
      /feeds/{feed_id}/publish:
        post:
          tags: [feeds]
          summary: Publish an event to a feed
          description: |
            Called by the Signal Aggregator when it receives an event
            matching a feed's scope. Feed Wr4ngler publishes the event
            to the feed's Redis pub/sub channel for SSE delivery.
    
            This is a high-frequency endpoint under active monitoring
            conditions. Must be fast. The OTP process for the target
            feed handles the publish — if the feed process has crashed
            and not yet restarted, the event is dropped and logged.
            Events are not buffered pending feed process restart.
          parameters:
            - name: feed_id
              in: path
              required: true
              schema:
                type: string
          requestBody:
            required: true
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/EventPublishRequest'
          responses:
            '202':
              description: Event accepted for delivery
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/PublishResult'
            '404':
              description: Feed not found — event dropped
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
            '500':
              description: Internal error
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
    
      /health:
        get:
          tags: [health]
          summary: Service health and feed statistics
          responses:
            '200':
              description: Health status returned
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/HealthResponse'
    
    components:
      schemas:
    
        SignalScope:
          type: object
          description: The scope of signals this feed delivers
          properties:
            application_ids:
              type: array
              items:
                type: string
              example: ["app-tca-vox-prod"]
            test_tiers:
              type: array
              items:
                type: string
                enum: [contract, plot]
            environments:
              type: array
              items:
                type: string
                enum: [production, staging, development]
            feed_types:
              type: array
              items:
                type: string
                enum: [results, failures, trends, anomalies, cluster]
    
        FeedProvisionRequest:
          type: object
          required:
            - wrangler_id
            - clearance_token
            - granted_scope
            - jwt_expires_at
          properties:
            wrangler_id:
              type: string
              description: Wr4ngler requesting the feed
              example: "wrnglr-a1b2c3d4"
            clearance_token:
              type: string
              description: >
                Short-lived token from Signal Clearance authorizing
                this feed provisioning. Feed Wr4ngler verifies before
                proceeding. 5-minute TTL — must arrive promptly after
                Signal Clearance issues it.
            granted_scope:
              $ref: '#/components/schemas/SignalScope'
            jwt_expires_at:
              type: string
              format: date-time
              description: >
                Expiry of the Wr4ngler's current JWT. Feed Wr4ngler
                uses this to schedule automatic feed closure when the
                JWT expires — the Wr4ngler must refresh and re-provision.
    
        FeedRecord:
          type: object
          required:
            - feed_id
            - wrangler_id
            - scope
            - status
            - provisioned_at
            - expires_at
            - events_delivered
          properties:
            feed_id:
              type: string
              example: "feed-a1b2c3d4"
            wrangler_id:
              type: string
            scope:
              $ref: '#/components/schemas/SignalScope'
            status:
              type: string
              enum: [active, idle, closing]
              description: >
                active — SSE connection open, events flowing.
                idle — provisioned but no SSE connection yet, or
                connection dropped. Closes after idle_timeout_seconds.
                closing — close in progress.
            provisioned_at:
              type: string
              format: date-time
            expires_at:
              type: string
              format: date-time
              description: Tied to JWT expiry
            idle_since:
              type: string
              format: date-time
              description: Present when status is idle
            events_delivered:
              type: integer
              description: Total events published to this feed since provisioning
            last_event_at:
              type: string
              format: date-time
    
        FeedList:
          type: object
          required:
            - feeds
            - total
            - active
            - idle
          properties:
            feeds:
              type: array
              items:
                $ref: '#/components/schemas/FeedRecord'
            total:
              type: integer
            active:
              type: integer
            idle:
              type: integer
    
        FeedCloseRequest:
          type: object
          required:
            - reason
          properties:
            reason:
              type: string
              enum: [explicit, jwt_expired, idle_timeout, gateway_shutdown]
              description: Why the feed is being closed
            reason_detail:
              type: string
              description: Optional human-readable detail
    
        FeedCloseResult:
          type: object
          required:
            - feed_id
            - events_delivered
            - closed_at
            - reason
          properties:
            feed_id:
              type: string
            events_delivered:
              type: integer
            closed_at:
              type: string
              format: date-time
            reason:
              type: string
    
        EventPublishRequest:
          type: object
          required:
            - event_type
            - application_id
            - payload
            - source_timestamp
          properties:
            event_type:
              type: string
              enum:
                - contract_test_result
                - plot_test_result
                - contract_test_failure
                - plot_test_failure
                - anomaly_detected
                - plot_needs_regeneration
                - application_status_change
            application_id:
              type: string
            environment:
              type: string
            payload:
              type: object
              description: Event-specific data from the originating Job
            source_timestamp:
              type: string
              format: date-time
              description: When the originating event occurred
    
        PublishResult:
          type: object
          required:
            - feed_id
            - delivered
            - published_at
          properties:
            feed_id:
              type: string
            delivered:
              type: boolean
              description: >
                True when the event was published to the Redis channel.
                False when the feed process was unavailable — event dropped.
            published_at:
              type: string
              format: date-time
    
        HealthResponse:
          type: object
          required:
            - status
            - feeds_active
            - feeds_idle
            - events_delivered_total
            - events_dropped_total
            - uptime_seconds
          properties:
            status:
              type: string
              enum: [healthy, degraded]
              description: >
                degraded when Redis pub/sub is unreachable or
                event drop rate exceeds threshold.
            feeds_active:
              type: integer
            feeds_idle:
              type: integer
            events_delivered_total:
              type: integer
              description: Total events delivered across all feeds since restart
            events_dropped_total:
              type: integer
              description: >
                Events dropped due to feed process unavailability.
                Non-zero is expected under rapid feed churn.
                Growing without bound warrants investigation.
            drop_rate:
              type: string
              description: >
                Ratio of dropped to total events as decimal string.
                Above 0.01 is worth investigating.
              example: "0.002"
            uptime_seconds:
              type: integer
    
        Error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
              example: "FEED_NOT_FOUND"
            message:
              type: string
              example: "Feed 'feed-a1b2c3d4' not found or already closed"
  gateway.yaml: |
    openapi: 3.1.0
    
    info:
      title: SETI - Gateway Job
      description: |
        Single external entry point for the SETI constellation. The Gateway
        is the only Job with an externally published port. All Wr4ngler
        traffic and all admin operations enter the constellation here.
    
        Responsibilities:
        - TLS termination on the external boundary
        - JWT validation on all authenticated routes
        - Request routing to internal Jobs via mTLS
        - SSE connection management for real-time feed delivery
        - Rate limiting per Wr4ngler
    
        The Gateway acts as an mTLS client when calling all upstream
        internal Jobs. It presents its own certificate on every upstream
        connection and verifies upstream certificates against the SETI CA.
    
        External boundary: standard TLS. Wr4nglers do not present client
        certificates. JWT validation substitutes for mTLS on the external
        boundary — this is not a weakening of the zero-trust posture, it
        is the correct adaptation for a boundary that terminates user traffic.
    
        Internal boundary: mTLS on every upstream call, identical to all
        other SETI Jobs acting as clients.
    
        The Gateway has no business logic. It routes. It validates tokens.
        It enforces rate limits. It does not interpret the content of
        requests or responses beyond what routing requires.
      version: 0.1.0
    
    x-tca-security:
      external-transport: tls
      internal-transport: mtls
      notes: >
        External (Wr4ngler-facing): standard TLS. JWT validation on all
        authenticated routes. Clearance level extracted from JWT claims
        and passed to upstream Jobs via X-Wrangler-Clearance header.
        Internal (service-to-service): Gateway acts as mTLS client when
        calling all upstream SETI Jobs. Must load its own certificate and
        key and present them on every upstream connection. Must verify
        upstream service certificates against the SETI CA. Upstream Jobs
        will reject connections without a valid client certificate.
      internal-client:
        load-ca-cert: /certs/ca.crt
        load-service-cert: /certs/gateway.crt
        load-service-key: /certs/gateway.key
        verify-server-cert: true
      rate-limiting:
        default-per-wrangler: 60
        window-seconds: 60
        feed-provisioning: 10
        notes: >
          Feed provisioning is rate-limited separately — a Wr4ngler
          should not be opening and closing feed subscriptions rapidly.
          High provisioning rate is a diagnostic signal.
    
    x-tca-observability:
      report-outbound-calls: true
      endpoint: https://seti-observability:4011/event
      pattern: fire-and-forget
      caller-name: "gateway"
      required-fields:
        - caller
        - callee
        - method
        - path
        - status_code
        - latency_ms
        - protocol
      implementation:
        timing: wrap-every-outbound-http-call
        non-blocking: true
        on-failure: log-and-drop
        do-not-instrument:
          - seti-observability
      notes: >
        Every upstream call the Gateway makes to an internal SETI Job must
        be reported to the Observability Job. This includes all routing
        calls, Signal Clearance calls, and feed provisioning calls.
        The Gateway is the highest-traffic reporter in the constellation —
        fire-and-forget discipline is especially important here.
    
    servers:
      - url: https://seti.cluster.internal
        description: External SETI gateway (TLS, JWT required on authenticated routes)
    
    tags:
      - name: auth
        description: Authentication flow (proxied to Signal Clearance)
      - name: feeds
        description: Signal feed provisioning and SSE delivery
      - name: applications
        description: Application registry operations (proxied to Policy)
      - name: results
        description: Test result queries (proxied to Results via Feed Wr4ngler)
      - name: admin
        description: Administrative operations (elevated clearance required)
      - name: health
        description: Gateway health
    
    paths:
    
      # ---------------------------------------------------------------------------
      # AUTHENTICATION — proxied to Signal Clearance
      # ---------------------------------------------------------------------------
    
      /auth/login:
        post:
          tags: [auth]
          summary: Initiate Wr4ngler authentication
          description: |
            Proxied to Signal Clearance /auth/login.
            No JWT required — this is the unauthenticated entry point.
          requestBody:
            required: true
            content:
              application/json:
                schema:
                  type: object
                  required: [contact]
                  properties:
                    contact:
                      type: string
                      example: "michael@example.com"
          responses:
            '200':
              description: Challenge issued
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/ProxiedResponse'
            '404':
              description: Wr4ngler not found
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
            '429':
              description: Rate limit exceeded
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
            '500':
              description: Internal error
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
    
      /auth/verify:
        post:
          tags: [auth]
          summary: Complete Wr4ngler authentication
          description: Proxied to Signal Clearance /auth/verify.
          requestBody:
            required: true
            content:
              application/json:
                schema:
                  type: object
                  required: [challenge_id, credential_response]
                  properties:
                    challenge_id:
                      type: string
                    credential_response:
                      type: object
          responses:
            '200':
              description: Authentication successful. JWT and refresh token returned.
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/ProxiedResponse'
            '401':
              description: Authentication failed
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
            '429':
              description: Rate limit exceeded
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
            '500':
              description: Internal error
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
    
      /auth/refresh:
        post:
          tags: [auth]
          summary: Refresh expired JWT
          description: Proxied to Signal Clearance /auth/refresh.
          requestBody:
            required: true
            content:
              application/json:
                schema:
                  type: object
                  required: [refresh_token]
                  properties:
                    refresh_token:
                      type: string
          responses:
            '200':
              description: New token pair issued
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/ProxiedResponse'
            '401':
              description: Invalid or expired refresh token
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
            '500':
              description: Internal error
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
    
      /auth/logout:
        post:
          tags: [auth]
          summary: Invalidate current session
          description: |
            Proxied to Signal Clearance /auth/logout.
            JWT required.
          security:
            - BearerAuth: []
          responses:
            '200':
              description: Session invalidated
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/ProxiedResponse'
            '401':
              description: Invalid or missing JWT
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
            '500':
              description: Internal error
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
    
      # ---------------------------------------------------------------------------
      # FEEDS — provisioning and SSE delivery
      # ---------------------------------------------------------------------------
    
      /feeds:
        post:
          tags: [feeds]
          summary: Request a signal feed
          description: |
            Validates the Wr4ngler's clearance for the requested scope via
            Signal Clearance, then calls Feed Wr4ngler to provision a
            scoped Redis pub/sub channel. Returns the SSE endpoint URL
            the Wr4ngler should connect to for the feed.
    
            JWT required. Clearance level is extracted from JWT claims
            and used in the Signal Clearance validation call.
          security:
            - BearerAuth: []
          requestBody:
            required: true
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/FeedRequest'
                example:
                  requested_scope:
                    application_ids: ["app-tca-vox-prod"]
                    test_tiers: ["contract"]
                    environments: ["production"]
                    feed_types: ["failures"]
          responses:
            '201':
              description: Feed provisioned. SSE endpoint returned.
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/FeedProvisionResult'
            '400':
              description: Invalid feed request
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
            '401':
              description: Invalid or missing JWT
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
            '403':
              description: Insufficient clearance for requested scope
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/ClearanceDenialResponse'
            '429':
              description: Feed provisioning rate limit exceeded
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
            '500':
              description: Internal error
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
    
      /feeds/{feed_id}/stream:
        get:
          tags: [feeds]
          summary: Connect to a provisioned feed via SSE
          description: |
            Opens a Server-Sent Events stream for a provisioned feed.
            The feed_id is returned by POST /feeds. The Wr4ngler connects
            here immediately after provisioning — feed channels have a
            30-second idle timeout before they are closed.
    
            JWT required. The JWT must match the Wr4ngler who provisioned
            the feed — feed channels are not shareable.
    
            Events are published to this stream as SETI produces test
            results, failures, and anomaly signals matching the feed scope.
            The stream stays open until the Wr4ngler disconnects or the
            JWT expires. On JWT expiry the stream closes — the Wr4ngler
            must refresh their JWT and provision a new feed.
          security:
            - BearerAuth: []
          parameters:
            - name: feed_id
              in: path
              required: true
              schema:
                type: string
              example: "feed-a1b2c3d4"
          responses:
            '200':
              description: SSE stream opened
              content:
                text/event-stream:
                  schema:
                    $ref: '#/components/schemas/SETIEvent'
            '401':
              description: Invalid or missing JWT
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
            '403':
              description: JWT does not match feed owner
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
            '404':
              description: Feed not found or expired
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
            '500':
              description: Internal error
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
    
      /feeds/{feed_id}:
        delete:
          tags: [feeds]
          summary: Close a feed
          description: |
            Closes the feed channel and releases the Redis pub/sub
            subscription. Wr4nglers should close feeds explicitly
            when done rather than letting them timeout.
            JWT required.
          security:
            - BearerAuth: []
          parameters:
            - name: feed_id
              in: path
              required: true
              schema:
                type: string
          responses:
            '200':
              description: Feed closed
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/FeedCloseResult'
            '401':
              description: Invalid or missing JWT
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
            '404':
              description: Feed not found
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
            '500':
              description: Internal error
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
    
      # ---------------------------------------------------------------------------
      # RESULTS — proxied to Results via Feed Wr4ngler clearance check
      # ---------------------------------------------------------------------------
    
      /results/contract:
        get:
          tags: [results]
          summary: Query Contract Test results
          description: |
            Clearance-checked query proxied to Results Job.
            Scope of results returned is bounded by the Wr4ngler's
            clearance level — applications outside their clearance
            are silently excluded from results.
            JWT required.
          security:
            - BearerAuth: []
          parameters:
            - name: application_id
              in: query
              required: false
              schema:
                type: string
            - name: environment
              in: query
              required: false
              schema:
                type: string
                enum: [production, staging, development]
            - name: status
              in: query
              required: false
              schema:
                type: string
                enum: [passed, failed, error, timeout]
            - name: from
              in: query
              required: false
              schema:
                type: string
                format: date-time
            - name: to
              in: query
              required: false
              schema:
                type: string
                format: date-time
            - name: limit
              in: query
              required: false
              schema:
                type: integer
                default: 20
          responses:
            '200':
              description: Results returned (scoped to Wr4ngler clearance)
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/ProxiedResponse'
            '401':
              description: Invalid or missing JWT
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
            '500':
              description: Internal error
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
    
      /results/plot:
        get:
          tags: [results]
          summary: Query Plot Test results
          description: |
            Clearance-checked query proxied to Results Job.
            JWT required.
          security:
            - BearerAuth: []
          parameters:
            - name: application_id
              in: query
              required: false
              schema:
                type: string
            - name: environment
              in: query
              required: false
              schema:
                type: string
                enum: [production, staging, development]
            - name: status
              in: query
              required: false
              schema:
                type: string
                enum: [passed, failed, error, timeout]
            - name: from
              in: query
              required: false
              schema:
                type: string
                format: date-time
            - name: to
              in: query
              required: false
              schema:
                type: string
                format: date-time
            - name: limit
              in: query
              required: false
              schema:
                type: integer
                default: 20
          responses:
            '200':
              description: Results returned (scoped to Wr4ngler clearance)
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/ProxiedResponse'
            '401':
              description: Invalid or missing JWT
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
            '500':
              description: Internal error
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
    
      # ---------------------------------------------------------------------------
      # ADMIN — elevated clearance required
      # ---------------------------------------------------------------------------
    
      /admin/applications:
        post:
          tags: [admin]
          summary: Register a new application for SETI monitoring
          description: |
            Admin clearance required.
            Proxied to Policy Job /applications.
          security:
            - BearerAuth: []
          requestBody:
            required: true
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/ProxiedRequest'
          responses:
            '201':
              description: Application registered
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/ProxiedResponse'
            '400':
              description: Invalid registration payload
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
            '401':
              description: Invalid or missing JWT
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
            '403':
              description: Admin clearance required
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
            '500':
              description: Internal error
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
    
        get:
          tags: [admin]
          summary: List registered applications
          description: Admin clearance required. Proxied to Policy Job.
          security:
            - BearerAuth: []
          responses:
            '200':
              description: Application list returned
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/ProxiedResponse'
            '401':
              description: Invalid or missing JWT
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
            '403':
              description: Admin clearance required
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
            '500':
              description: Internal error
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
    
      /admin/wranglers:
        post:
          tags: [admin]
          summary: Register a new Wr4ngler
          description: Admin clearance required. Proxied to Signal Clearance.
          security:
            - BearerAuth: []
          requestBody:
            required: true
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/ProxiedRequest'
          responses:
            '201':
              description: Wr4ngler registered
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/ProxiedResponse'
            '400':
              description: Invalid registration payload
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
            '401':
              description: Invalid or missing JWT
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
            '403':
              description: Admin clearance required
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
            '500':
              description: Internal error
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
    
      /health:
        get:
          tags: [health]
          summary: Gateway health check
          description: No JWT required.
          responses:
            '200':
              description: Gateway healthy
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/HealthResponse'
    
    components:
    
      securitySchemes:
        BearerAuth:
          type: http
          scheme: bearer
          bearerFormat: JWT
          description: >
            JWT issued by Signal Clearance on successful authentication.
            15-minute TTL. Contains wrangler_id and clearance_level claims.
    
      schemas:
    
        FeedRequest:
          type: object
          required:
            - requested_scope
          properties:
            requested_scope:
              type: object
              description: Signal scope the Wr4ngler is requesting
              properties:
                application_ids:
                  type: array
                  items:
                    type: string
                test_tiers:
                  type: array
                  items:
                    type: string
                    enum: [contract, plot]
                environments:
                  type: array
                  items:
                    type: string
                    enum: [production, staging, development]
                feed_types:
                  type: array
                  items:
                    type: string
                    enum: [results, failures, trends, anomalies, cluster]
    
        FeedProvisionResult:
          type: object
          required:
            - feed_id
            - sse_endpoint
            - granted_scope
            - expires_at
          properties:
            feed_id:
              type: string
              description: Feed identifier for SSE connection and close calls
              example: "feed-a1b2c3d4"
            sse_endpoint:
              type: string
              description: >
                Full SSE endpoint URL. Connect here immediately after
                provisioning — channel has 30-second idle timeout.
              example: "https://seti.cluster.internal/feeds/feed-a1b2c3d4/stream"
            granted_scope:
              type: object
              description: The scope actually granted (may be subset of requested)
            expires_at:
              type: string
              format: date-time
              description: Feed channel expiry — tied to JWT expiry
    
        FeedCloseResult:
          type: object
          required:
            - feed_id
            - closed_at
          properties:
            feed_id:
              type: string
            closed_at:
              type: string
              format: date-time
    
        SETIEvent:
          type: object
          description: >
            Server-Sent Event payload published to feed streams.
            Event type identifies the signal category.
          required:
            - event_type
            - application_id
            - payload
            - published_at
          properties:
            event_type:
              type: string
              enum:
                - contract_test_result
                - plot_test_result
                - contract_test_failure
                - plot_test_failure
                - anomaly_detected
                - plot_needs_regeneration
                - application_status_change
            application_id:
              type: string
            environment:
              type: string
            payload:
              type: object
              description: Event-specific data. Shape varies by event_type.
            published_at:
              type: string
              format: date-time
    
        ClearanceDenialResponse:
          type: object
          required:
            - denied_dimensions
          properties:
            denied_dimensions:
              type: array
              items:
                type: string
              description: Which dimensions of the requested scope exceeded clearance
              example: ["feed_types: anomalies requires elevated clearance"]
    
        ProxiedRequest:
          type: object
          description: >
            Passthrough request body. The Gateway forwards the body
            verbatim to the upstream Job after JWT validation and
            clearance checking. Schema enforcement is the upstream
            Job's responsibility.
    
        ProxiedResponse:
          type: object
          description: >
            Passthrough response body. The Gateway returns the upstream
            Job's response verbatim. See the upstream Job's contract
            for the specific response schema.
    
        HealthResponse:
          type: object
          required:
            - status
            - active_feeds
            - requests_routed
            - upstream_jobs_healthy
            - upstream_jobs_degraded
            - uptime_seconds
          properties:
            status:
              type: string
              enum: [healthy, degraded]
            active_feeds:
              type: integer
              description: Currently open SSE feed connections
            requests_routed:
              type: integer
              description: Total requests routed since last restart
            upstream_jobs_healthy:
              type: integer
            upstream_jobs_degraded:
              type: integer
              description: >
                Non-zero value here means one or more internal Jobs
                are returning degraded health. Specific Job health
                available via /admin endpoints.
            uptime_seconds:
              type: integer
    
        Error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
              example: "INSUFFICIENT_CLEARANCE"
            message:
              type: string
              example: "JWT clearance level 'connie-wr4ngler' does not grant access to anomaly feeds"
  integration.yaml: |
    openapi: 3.1.0
    
    info:
      title: SETI - Integration Job
      description: |
        Read-only API layer for external consumption of SETI data by
        customer tooling. Enables customers to pull SETI results, trends,
        and health signals into their existing infrastructure — Grafana
        dashboards, Splunk pipelines, internal reporting systems, NOC
        displays — without requiring those systems to understand SETI's
        internal architecture.
    
        SCOPE:
        External to SETI but internal to the customer network. The
        Integration Job sits behind the Gateway and requires a valid
        SETI JWT like any other authenticated endpoint. The difference
        is the audience — these endpoints are designed for programmatic
        consumption by systems, not by Wr4ngler browsers.
    
        READ-ONLY: The Integration Job exposes no write operations.
        It is a structured window into Results Job data, clearance-scoped
        to the credentials of the caller.
    
        SERVICE ACCOUNTS:
        Customer tooling authenticates using service account credentials
        rather than interactive AD login. A service account is an AD
        identity with a configured clearance level — the same federated
        auth flow as any Wr4ngler, but non-interactive. The customer
        configures their tools with a client credential that Signal
        Clearance validates via the IdP's client credentials grant.
    
        VERSIONED API:
        All Integration Job endpoints are versioned under /v1/. When
        breaking changes are required, /v2/ is introduced alongside /v1/
        with a defined deprecation window. Customer tooling is not broken
        by SETI upgrades without advance notice.
    
        RESPONSE FORMAT:
        All responses use a consistent envelope for easy parsing by
        automated consumers. Timestamps are always ISO 8601 UTC.
        Financial values are always strings. Pagination is consistent
        across all list endpoints.
    
        Internal service — mTLS only, not externally exposed directly.
        All Integration Job traffic enters via the Gateway.
      version: 0.1.0
    
    x-tca-security:
      transport: mtls
      tls-min-version: "1.3"
      client-cert-required: true
      reject-without-client-cert: true
      ca-cert: /certs/ca.crt
      service-cert: /certs/integration.crt
      service-key: /certs/integration.key
      implementation:
        server:
          load-ca-cert: true
          load-service-cert: true
          load-service-key: true
          require-and-verify-client-cert: true
        client:
          load-ca-cert: true
          load-service-cert: true
          load-service-key: true
          verify-server-cert: true
      notes: >
        Every inbound connection must present a certificate signed by the
        SETI CA. Connections without a valid client certificate must be
        rejected. Authorized callers: Gateway only. All JWT validation
        happens at the Gateway before requests reach this Job. The
        Integration Job trusts the Gateway's JWT validation and the
        clearance level passed in the X-Wrangler-Clearance header.
    
    x-tca-observability:
      report-outbound-calls: true
      endpoint: https://seti-observability:4011/event
      pattern: fire-and-forget
      caller-name: "integration"
      required-fields:
        - caller
        - callee
        - method
        - path
        - status_code
        - latency_ms
        - protocol
      implementation:
        timing: wrap-every-outbound-http-call
        non-blocking: true
        on-failure: log-and-drop
        do-not-instrument:
          - seti-observability
      notes: >
        Report all outbound HTTP calls. Integration Job's outbound calls
        are to Results Job for data retrieval. These calls are the primary
        signal in the observability stream for monitoring Integration Job
        usage patterns — which applications are being queried, at what
        frequency, by which service accounts.
    
    servers:
      - url: https://integration:4013
        description: Internal SETI network (mTLS enforced)
    
    tags:
      - name: v1-applications
        description: Application registry and health data
      - name: v1-results
        description: Test result queries
      - name: v1-trends
        description: Trend and aggregate data
      - name: v1-cluster
        description: Cluster-level data (elevated clearance)
      - name: health
        description: Service health
    
    paths:
    
      # ---------------------------------------------------------------------------
      # V1 — APPLICATIONS
      # ---------------------------------------------------------------------------
    
      /v1/applications:
        get:
          tags: [v1-applications]
          summary: List applications visible to the caller
          description: |
            Returns applications the caller's clearance level grants
            access to. Applications outside the caller's clearance scope
            are not returned — they are not acknowledged to exist.
            Useful for service accounts that need to discover which
            applications they are authorized to query.
          responses:
            '200':
              description: Application list returned
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/ApplicationListResponse'
            '401':
              description: Invalid or missing JWT
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
            '500':
              description: Internal error
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
    
      /v1/applications/{application_id}/health:
        get:
          tags: [v1-applications]
          summary: Get current health summary for an application
          description: |
            Returns the most recent Contract Test and Plot Test run
            results for an application, plus pass rate trends.
            Designed for consumption by monitoring systems that poll
            for health status — Grafana, custom NOC displays, etc.
    
            Returns 403 if the caller's clearance does not cover
            this application.
          parameters:
            - name: application_id
              in: path
              required: true
              schema:
                type: string
              example: "app-tca-vox-prod"
          responses:
            '200':
              description: Application health summary returned
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/ApplicationHealthResponse'
            '401':
              description: Invalid or missing JWT
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
            '403':
              description: Insufficient clearance for this application
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
            '404':
              description: Application not found or not visible at this clearance level
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
            '500':
              description: Internal error
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
    
      # ---------------------------------------------------------------------------
      # V1 — RESULTS
      # ---------------------------------------------------------------------------
    
      /v1/applications/{application_id}/results/contract:
        get:
          tags: [v1-results]
          summary: Query Contract Test results for an application
          description: |
            Returns paginated Contract Test results. Suitable for
            consumption by log aggregators and SIEM tools that ingest
            structured JSON events.
          parameters:
            - name: application_id
              in: path
              required: true
              schema:
                type: string
            - name: environment
              in: query
              required: false
              schema:
                type: string
                enum: [production, staging, development]
            - name: status
              in: query
              required: false
              schema:
                type: string
                enum: [passed, failed, error, timeout]
            - name: from
              in: query
              required: false
              schema:
                type: string
                format: date-time
              description: ISO 8601 UTC — results from this time forward
            - name: to
              in: query
              required: false
              schema:
                type: string
                format: date-time
            - name: limit
              in: query
              required: false
              schema:
                type: integer
                minimum: 1
                maximum: 100
                default: 20
            - name: offset
              in: query
              required: false
              schema:
                type: integer
                default: 0
          responses:
            '200':
              description: Contract Test results returned
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/ContractResultsResponse'
            '401':
              description: Invalid or missing JWT
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
            '403':
              description: Insufficient clearance
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
            '404':
              description: Application not found
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
            '500':
              description: Internal error
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
    
      /v1/applications/{application_id}/results/plot:
        get:
          tags: [v1-results]
          summary: Query Plot Test results for an application
          parameters:
            - name: application_id
              in: path
              required: true
              schema:
                type: string
            - name: environment
              in: query
              required: false
              schema:
                type: string
                enum: [production, staging, development]
            - name: status
              in: query
              required: false
              schema:
                type: string
                enum: [passed, failed, error, timeout]
            - name: from
              in: query
              required: false
              schema:
                type: string
                format: date-time
            - name: to
              in: query
              required: false
              schema:
                type: string
                format: date-time
            - name: limit
              in: query
              required: false
              schema:
                type: integer
                minimum: 1
                maximum: 100
                default: 20
            - name: offset
              in: query
              required: false
              schema:
                type: integer
                default: 0
          responses:
            '200':
              description: Plot Test results returned
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/PlotResultsResponse'
            '401':
              description: Invalid or missing JWT
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
            '403':
              description: Insufficient clearance
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
            '404':
              description: Application not found
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
            '500':
              description: Internal error
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
    
      # ---------------------------------------------------------------------------
      # V1 — TRENDS
      # ---------------------------------------------------------------------------
    
      /v1/applications/{application_id}/trends:
        get:
          tags: [v1-trends]
          summary: Get test result trends for an application
          description: |
            Returns aggregated pass/fail rates over the specified window.
            Designed for time-series ingestion by tools like Grafana,
            Datadog, or custom dashboards. Pass rate is expressed as a
            decimal string for consistent precision.
          parameters:
            - name: application_id
              in: path
              required: true
              schema:
                type: string
            - name: window
              in: query
              required: false
              schema:
                type: string
                enum: [24h, 7d, 30d, 90d]
                default: "24h"
            - name: environment
              in: query
              required: false
              schema:
                type: string
                enum: [production, staging, development]
          responses:
            '200':
              description: Trend data returned
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/TrendsResponse'
            '401':
              description: Invalid or missing JWT
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
            '403':
              description: Insufficient clearance
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
            '404':
              description: Application not found
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
            '500':
              description: Internal error
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
    
      # ---------------------------------------------------------------------------
      # V1 — CLUSTER (elevated clearance)
      # ---------------------------------------------------------------------------
    
      /v1/cluster/health:
        get:
          tags: [v1-cluster]
          summary: Get cluster-wide health summary
          description: |
            Elevated clearance required. Returns aggregate health data
            across all applications in the cluster. The cross-application
            view — designed for NOC-level monitoring and executive
            dashboards where per-application detail is less important
            than overall cluster health posture.
          responses:
            '200':
              description: Cluster health summary returned
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/ClusterHealthResponse'
            '401':
              description: Invalid or missing JWT
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
            '403':
              description: Elevated clearance required for cluster-level data
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
            '500':
              description: Internal error
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
    
      /health:
        get:
          tags: [health]
          summary: Integration Job health check
          responses:
            '200':
              description: Service healthy
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/HealthResponse'
    
    components:
      schemas:
    
        IntegrationEnvelope:
          type: object
          description: >
            Standard response envelope for all Integration Job responses.
            Consistent structure regardless of endpoint — automated
            consumers can parse the envelope first, then the data.
          required:
