      /ai-providers/{provider_id}/active-model:
        put:
          summary: Set the active model for a provider
          parameters:
            - name: provider_id
              in: path
              required: true
              schema:
                type: string
          requestBody:
            required: true
            content:
              application/json:
                schema:
                  type: object
                  required: [model_name]
                  properties:
                    model_name:
                      type: string
                      description: Model name as returned by the provider
          responses:
            '200':
              description: Active model updated
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/AIProvider'
            '404':
              description: Provider or model not found
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
    
      /ai-providers/active:
        get:
          summary: Get the currently active AI provider and model for AI-lien
          description: |
            AI-lien calls this before every analysis to get the current
            provider URL and active model. No caching — always fresh.
            Returns 503 if no provider is configured or none is active.
          responses:
            '200':
              description: Active provider configuration
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/ActiveAIProvider'
            '503':
              description: No active AI provider configured
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
    
      /applications/{application_id}/federation/connect:
        post:
          tags: [federation]
          summary: Initiate or re-initiate federation with an application's AC
          description: |
            Triggers SETI to send a star-gazer signed registration request to
            the application's AC endpoint. On success, the Signal Aggregator
            begins subscribing to the AC's tca:augur-canis feed and verifying
            events against the returned session certificate.
    
            Called automatically when:
            - A new application is registered with an ac_endpoint.
            - The Signal Aggregator detects feed silence beyond the threshold.
            - The Signal Aggregator receives an event that fails signature
              verification (stale session cert after AC restart).
    
            Can also be called manually by a Sec Wr4ngler to force reconnection.
    
            Idempotent — if already registered with a valid session, returns
            the current status without re-registering.
          parameters:
            - name: application_id
              in: path
              required: true
              schema:
                type: string
          responses:
            '200':
              description: Federation registration initiated or already active
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/FederationConnectResponse'
            '404':
              description: Application not found
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
            '400':
              description: Application has no ac_endpoint configured
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
            '502':
              description: AC endpoint unreachable or registration rejected
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
    
      /applications/{application_id}/federation/status:
        get:
          tags: [federation]
          summary: Get federation connection status for an application
          description: |
            Returns the current state of SETI's federation connection to
            this application's AC, including session certificate status
            and feed health.
          parameters:
            - name: application_id
              in: path
              required: true
              schema:
                type: string
          responses:
            '200':
              description: Federation status
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/FederationConnectResponse'
            '404':
              description: Application not found
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
    
    
    components:
      schemas:
    
        ApplicationRegistration:
          type: object
          required:
            - application_id
            - display_name
            - repository_url
            - contracts_path
            - environments
          properties:
            application_id:
              type: string
              description: >
                Unique identifier for this application across all environments.
                Convention: app-{name}-{env} e.g. app-tca-vox-prod
              example: "app-tca-vox-prod"
            display_name:
              type: string
              description: Human-readable application name
              example: "TCA Vox (Production)"
            repository_url:
              type: string
              description: >
                Repository URL. SETI reads from the contracts folder only.
                Read access must be granted before registration.
              example: "https://github.com/Pelentan/tca-vox"
            contracts_path:
              type: string
              description: Path to the contracts folder within the repository
              example: "contracts/openapi"
            environments:
              type: array
              items:
                $ref: '#/components/schemas/EnvironmentConfig'
              minItems: 1
              description: One entry per environment being monitored
            ac_endpoint:
              type: string
              description: >
                HTTPS endpoint for this constellation's Augur Canis instance.
                Set when a Sec Wr4ngler registers the constellation. SETI uses
                this to initiate federation registration with the external AC.
                Required for health feed subscription. Optional for seti-self
                which uses the internal AC directly.
            federation_status:
              type: string
              enum: [pending, registered, degraded, unregistered]
              description: >
                pending — ac_endpoint provided, federation registration not yet
                attempted.
                registered — SETI has a valid session certificate from the AC,
                health feed active.
                degraded — feed silent or signature verification failing, SETI
                is attempting re-registration.
                unregistered — no ac_endpoint, or registration failed permanently.
            federation_registered_at:
              type: string
              format: date-time
              description: When the current session certificate was issued.
            session_cert_id:
              type: string
              description: >
                Short identifier of the session certificate currently in use.
                SETI uses this to detect certificate rotation in incoming events.
            default_schedule:
              $ref: '#/components/schemas/TestScheduleConfig'
              description: >
                Schedule applied to all environments unless overridden.
                If omitted, SETI defaults apply: contract tests every
                15 minutes, plot tests daily at 02:00 UTC.
    
        EnvironmentConfig:
          type: object
          required:
            - environment
            - gateway_endpoint
            - observability_stream
          properties:
            environment:
              type: string
              enum: [production, staging, development]
            gateway_endpoint:
              type: string
              description: Gateway URL for this environment
              example: "https://vox.example.com"
            observability_stream:
              type: string
              description: Redis connection string for tca:events pub/sub
              example: "redis://vox-redis-prod:6379"
            schedule_override:
              $ref: '#/components/schemas/TestScheduleConfig'
              description: >
                Environment-specific schedule. Overrides default_schedule
                for this environment only.
    
        TestScheduleConfig:
          type: object
          properties:
            contract_test_interval_minutes:
              type: integer
              minimum: 5
              maximum: 1440
              description: >
                How often to run Contract Tests in minutes.
                Minimum 5 minutes. Default 15.
              example: 15
            plot_test_cron:
              type: string
              description: >
                Cron expression for Plot Test runs. Default: daily at 02:00 UTC.
              example: "0 2 * * *"
            plot_test_on_deployment:
              type: boolean
              description: >
                Whether to trigger a Plot Test run on deployment detection.
                Default true.
              example: true
            timeout_seconds:
              type: integer
              minimum: 30
              maximum: 300
              description: >
                Maximum time a Contract Test run may take before timing out.
                Default 60 seconds.
              example: 60
    
        ApplicationUpdate:
          type: object
          properties:
            display_name:
              type: string
            repository_url:
              type: string
            contracts_path:
              type: string
            environments:
              type: array
              items:
                $ref: '#/components/schemas/EnvironmentConfig'
            default_schedule:
              $ref: '#/components/schemas/TestScheduleConfig'
    
        Application:
          type: object
          required:
            - application_id
            - display_name
            - repository_url
            - contracts_path
            - status
            - registered_at
            - updated_at
            - environments
          properties:
            application_id:
              type: string
            display_name:
              type: string
            repository_url:
              type: string
            contracts_path:
              type: string
            status:
              type: string
              enum: [active, paused, error]
              description: >
                active — tests running on schedule.
                paused — tests suspended, application still registered.
                error — SETI cannot reach repository or gateway.
            pause_reason:
              type: string
              description: Present when status is paused
            registered_at:
              type: string
              format: date-time
            updated_at:
              type: string
              format: date-time
            environments:
              type: array
              items:
                $ref: '#/components/schemas/EnvironmentConfig'
            default_schedule:
              $ref: '#/components/schemas/TestScheduleConfig'
    
        ApplicationList:
          type: object
          required:
            - applications
            - total
          properties:
            applications:
              type: array
              items:
                $ref: '#/components/schemas/Application'
            total:
              type: integer
    
        DeregistrationResult:
          type: object
          required:
            - application_id
            - schedules_cancelled
            - plots_deprecated
            - results_retained
          properties:
            application_id:
              type: string
            schedules_cancelled:
              type: integer
            plots_deprecated:
              type: integer
            results_retained:
              type: integer
              description: Historical results kept in Results Job
    
        PauseRequest:
          type: object
          required:
            - reason
          properties:
            reason:
              type: string
              description: Why testing is being paused
              example: "Planned maintenance window 2026-03-28 02:00-04:00 UTC"
            resume_at:
              type: string
              format: date-time
              description: >
                Optional. If provided, SETI will automatically resume
                testing at this time.
    
        TestSchedule:
          type: object
          required:
            - application_id
            - default_schedule
            - environment_schedules
          properties:
            application_id:
              type: string
            default_schedule:
              $ref: '#/components/schemas/TestScheduleConfig'
            environment_schedules:
              type: array
              items:
                type: object
                required:
                  - environment
                  - effective_schedule
                properties:
                  environment:
                    type: string
                    enum: [production, staging, development]
                  effective_schedule:
                    $ref: '#/components/schemas/TestScheduleConfig'
                  override_active:
                    type: boolean
    
        TestScheduleUpdate:
          type: object
          properties:
            default_schedule:
              $ref: '#/components/schemas/TestScheduleConfig'
            environment_overrides:
              type: array
              items:
                type: object
                required:
                  - environment
                  - schedule
                properties:
                  environment:
                    type: string
                    enum: [production, staging, development]
                  schedule:
                    $ref: '#/components/schemas/TestScheduleConfig'
    
        PolicyRule:
          type: object
          required:
            - test_tier
            - action
          properties:
            policy_id:
              type: string
              description: Assigned on creation
              example: "pol-a1b2c3d4"
            application_id:
              type: string
              description: Set from path parameter on creation
            job_name:
              type: string
              description: >
                Specific Job this policy applies to.
                If omitted, applies to all Jobs in the application.
              example: "vote-handler"
            test_tier:
              type: string
              enum: [contract, plot, both]
              description: Which test tier triggers this policy
            environment:
              type: string
              enum: [production, staging, development, all]
              description: Which environment this policy applies to. Default all.
            severity:
              type: string
              enum: [critical, high, medium, low, any]
              description: >
                Failure severity level this policy responds to.
                Severity is determined by the test Job based on
                which endpoint failed and the failure type.
                Default any.
            action:
              type: string
              enum: [alert, rollback, alert_and_rollback, escalate, none]
              description: >
                alert — notify via configured channels.
                rollback — trigger deployment rollback, no notification.
                alert_and_rollback — both.
                escalate — route to Interactions Job for human or AI handling.
                none — log only, no external action.
            notification_channels:
              type: array
              items:
                type: string
              description: >
                Present when action includes alert. Channel identifiers
                configured in the Interactions Job.
              example: ["slack-ops", "pagerduty-critical"]
            created_at:
              type: string
              format: date-time
            updated_at:
              type: string
              format: date-time
    
        PolicyList:
          type: object
          required:
            - policies
            - total
          properties:
            policies:
              type: array
              items:
                $ref: '#/components/schemas/PolicyRule'
            total:
              type: integer
    
        PolicyLookupRequest:
          type: object
          required:
            - job_name
            - test_tier
            - environment
            - severity
          properties:
            job_name:
              type: string
              example: "vote-handler"
            test_tier:
              type: string
              enum: [contract, plot]
            environment:
              type: string
              enum: [production, staging, development]
            severity:
              type: string
              enum: [critical, high, medium, low]
    
        PolicyLookupResult:
          type: object
          required:
            - policy_id
            - action
            - matched_on
          properties:
            policy_id:
              type: string
            action:
              type: string
              enum: [alert, rollback, alert_and_rollback, escalate, none]
            notification_channels:
              type: array
              items:
                type: string
            matched_on:
              type: string
              description: >
                Describes which policy fields produced the match.
                Useful for debugging unexpected policy behavior.
              example: "application + job_name + test_tier + environment"
    
        ContractVersionMap:
          type: object
          required:
            - application_id
            - versions
            - last_checked_at
          properties:
            application_id:
              type: string
            versions:
              type: array
              items:
                type: object
                required:
                  - job_name
                  - contract_version
                  - last_seen_at
                properties:
                  job_name:
                    type: string
                    example: "vote-handler"
                  contract_version:
                    type: string
                    example: "0.3.0"
                  last_seen_at:
                    type: string
                    format: date-time
            last_checked_at:
              type: string
              format: date-time
    
        ContractVersionUpdate:
          type: object
          required:
            - versions
          properties:
            versions:
              type: array
              items:
                type: object
                required:
                  - job_name
                  - contract_version
                properties:
                  job_name:
                    type: string
                  contract_version:
                    type: string
    
        ContractVersionUpdateResult:
          type: object
          required:
            - application_id
            - changed_jobs
            - plots_flagged
            - updated_at
          properties:
            application_id:
              type: string
            changed_jobs:
              type: array
              items:
                type: object
                required:
                  - job_name
                  - previous_version
                  - new_version
                properties:
                  job_name:
                    type: string
                  previous_version:
                    type: string
                  new_version:
                    type: string
              description: Jobs where the contract version changed
            plots_flagged:
              type: integer
              description: Number of Plots flagged for regeneration in Plot Store
            updated_at:
              type: string
              format: date-time
    
        HealthResponse:
          type: object
          required:
            - status
            - applications_registered
            - applications_active
            - applications_paused
            - uptime_seconds
          properties:
            status:
              type: string
              enum: [healthy, degraded]
            applications_registered:
              type: integer
            applications_active:
              type: integer
            applications_paused:
              type: integer
            uptime_seconds:
              type: integer
    
    
        AIProviderRequest:
          type: object
          required: [name, ollama_url]
          properties:
            name:
              type: string
              description: Human-readable provider name
            ollama_url:
              type: string
              description: Ollama API base URL (e.g. http://host.docker.internal:11434)
            description:
              type: string
    
        AIProvider:
          type: object
          required: [provider_id, name, ollama_url, status, registered_at]
          properties:
            provider_id:
              type: string
            name:
              type: string
            ollama_url:
              type: string
            description:
              type: string
            status:
              type: string
              enum: [reachable, unreachable, unknown]
            available_models:
              type: array
              items:
                type: string
              description: Model names as reported by Ollama /api/tags
            active_model:
              type: string
              description: Currently selected model for AI-lien use
            last_refreshed_at:
              type: string
              format: date-time
            registered_at:
              type: string
              format: date-time
    
        AIProviderList:
          type: object
          required: [providers, total]
          properties:
            providers:
              type: array
              items:
                $ref: '#/components/schemas/AIProvider'
            total:
              type: integer
    
        ActiveAIProvider:
          type: object
          required: [provider_id, name, ollama_url, active_model]
          properties:
            provider_id:
              type: string
            name:
              type: string
            ollama_url:
              type: string
            active_model:
              type: string
    
        StatusMessage:
          type: object
          required: [status, message]
          properties:
            status:
              type: string
            message:
              type: string
    
    
        FederationConnectResponse:
          type: object
          required: [application_id, federation_status]
          properties:
            application_id:
              type: string
            federation_status:
              type: string
              enum: [pending, registered, degraded, unregistered]
            session_cert_id:
              type: string
              description: Present when federation_status is registered
            federation_registered_at:
              type: string
              format: date-time
              description: When the current session was established
            last_event_at:
              type: string
              format: date-time
              description: Timestamp of the most recent verified event from this AC
            reconnect_count:
              type: integer
              description: >
                Number of times SETI has re-registered with this AC since the
                application was registered. Non-zero indicates AC has restarted
                at least once.
    
        Error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
              example: "APPLICATION_NOT_FOUND"
            message:
              type: string
              example: "Application 'app-tca-vox-prod' not found in registry"
    
    
      # ---------------------------------------------------------------------------
      # AVAILABLE APPLICATIONS (remote-apps.json source)
      # ---------------------------------------------------------------------------
    
      /available-applications:
        get:
          tags: [available-applications]
          summary: List all applications available for SETI monitoring
          description: |
            Returns all applications declared in remote-apps.json, augmented
            with their current active/inactive state in SETI. Applications
            listed here may or may not be actively registered in the Policy
            application registry.
    
            Visible to all authenticated Wr4ngler clearance levels.
            Registration and deregistration require sec-wr4ngler clearance —
            enforced at the Gateway.
          responses:
            '200':
              description: Available application list
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/AvailableApplicationList'
            '500':
              description: Internal error
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
    
      /available-applications/{tag}/test-connection:
        post:
          tags: [available-applications]
          summary: Test read access to an application's contract registry
          description: |
            Attempts to list the contents of the application's contracts/openapi
            directory using the configured registry_url, registry_type, and
            registry_token. Returns success/failure and the number of contract
            files found if successful.
    
            Does not attempt AC federation — tests repository access only.
          parameters:
            - name: tag
              in: path
              required: true
              schema:
                type: string
              description: Short application tag from remote-apps.json
          responses:
            '200':
              description: Connection test result (success or failure)
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/ConnectionTestResult'
            '404':
              description: Tag not found in remote-apps.json
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
    
      /available-applications/{tag}/register:
        post:
          tags: [available-applications]
          summary: Activate monitoring for an available application
          description: |
            Promotes an available application to active monitoring status:
            1. Registers the application in the Policy application registry
               if not already present.
            2. Calls Signal Aggregator to initiate AC federation using
               the application's ac_endpoint.
            3. Calls Plot Store to ingest plots from the application's
               contracts/plots directory in the registry.
    
            Idempotent — if the application is already active, returns
            current status without re-registering. Re-register by calling
            deregister first.
    
            Requires sec-wr4ngler clearance — enforced at Gateway.
          parameters:
            - name: tag
              in: path
              required: true
              schema:
                type: string
          responses:
            '200':
              description: Application registered and monitoring active
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/AvailableApplication'
            '404':
              description: Tag not found in remote-apps.json
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
            '502':
              description: AC federation failed or Plot Store ingest failed
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
            '500':
              description: Internal error
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
    
      /available-applications/{tag}/deregister:
        post:
          tags: [available-applications]
          summary: Deactivate monitoring for an active application
          description: |
            Marks the application inactive — stops contract and plot test
            scheduling, drops the AC federation subscription. Does not
            remove historical results or plots from their respective Jobs.
            The application remains visible in the available-applications
            list with status inactive.
    
            Requires sec-wr4ngler clearance — enforced at Gateway.
          parameters:
            - name: tag
              in: path
              required: true
              schema:
                type: string
          responses:
            '200':
              description: Application deactivated
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/AvailableApplication'
            '404':
              description: Tag not found in remote-apps.json
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
            '409':
              description: Application is not currently active
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
            '500':
              description: Internal error
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
    
        AvailableApplication:
          type: object
          required:
            - tag
            - name
            - description
            - ac_endpoint
            - registry_url
            - registry_type
            - monitoring_status
          properties:
            tag:
              type: string
              description: Short identifier key from remote-apps.json
              example: "tca-vox"
            name:
              type: string
              description: Human-readable application name
              example: "TCA Vox"
            description:
              type: string
              description: Application description
              example: "Polyglot polling application — TCA proof of concept"
            ac_endpoint:
              type: string
              description: HTTPS endpoint for this constellation's Augur Canis
              example: "https://augur-canis.tca-vox.example:4010"
            registry_url:
              type: string
              description: Base URL for contract registry access
              example: "https://api.github.com/repos/Pelentan/tca-vox/contents"
            registry_type:
              type: string
              enum: [github, gitlab, generic]
              description: Registry type — determines auth header format
            monitoring_status:
              type: string
              enum: [active, inactive]
              description: |
                active — application is registered in Policy and tests are running.
                inactive — declared in remote-apps.json but not currently monitored.
            application_id:
              type: string
              description: >
                Policy application_id when monitoring_status is active.
                Absent when inactive.
              example: "app-tca-vox"
            activated_at:
              type: string
              format: date-time
              description: When this application was most recently registered. Absent when inactive.
            connection_last_tested_at:
              type: string
              format: date-time
              description: When test-connection was last run against this application's registry.
            connection_last_status:
              type: string
              enum: [ok, failed, untested]
              description: Result of the most recent test-connection call.
    
        AvailableApplicationList:
          type: object
          required:
            - applications
            - total
            - active_count
            - inactive_count
          properties:
            applications:
              type: array
              items:
                $ref: '#/components/schemas/AvailableApplication'
            total:
              type: integer
            active_count:
              type: integer
            inactive_count:
              type: integer
    
        ConnectionTestResult:
          type: object
          required:
            - tag
            - success
            - tested_at
          properties:
            tag:
              type: string
            success:
              type: boolean
            contracts_found:
              type: integer
              description: Number of YAML files found in contracts/openapi. Present on success.
            plots_found:
              type: integer
              description: Number of Plot files found in contracts/plots. Present on success.
            error:
              type: string
              description: Error detail. Present on failure.
            tested_at:
              type: string
              format: date-time
  results.yaml: |
    openapi: 3.1.0
    
    info:
      title: SETI - Results Job
      description: |
        Owns the historical test results database for the SETI constellation.
        Stores Contract Test and Plot Test outcomes for all monitored
        applications across all environments.
    
        Results Job is the institutional memory of SETI. Every test run
        outcome — pass, fail, error, timeout — is persisted here. Results
        feed trend analysis, cross-application correlation, and the
        Feed Wr4ngler's authorized signal delivery to Wr4nglers.
    
        In the demo environment, Results Job manages its own PostgreSQL
        database instance. In production, the underlying database is
        managed by the infrastructure team. Results Job owns the surface.
        The DB team owns what is behind it. This boundary is intentional
        and must be maintained through the three-year lifecycle.
    
        Results Job does not make policy decisions. It stores and retrieves.
        Callers decide what to do with the data.
    
        Internal service — mTLS only, not externally exposed.
      version: 0.1.0
    
    x-tca-security:
      transport: mtls
      tls-min-version: "1.3"
      client-cert-required: true
      reject-without-client-cert: true
      ca-cert: /certs/ca.crt
      service-cert: /certs/results.crt
      service-key: /certs/results.key
      implementation:
        server:
          load-ca-cert: true
          load-service-cert: true
          load-service-key: true
          require-and-verify-client-cert: true
        client:
          load-ca-cert: true
          load-service-cert: true
          load-service-key: true
          verify-server-cert: true
      notes: >
        Every inbound connection must present a certificate signed by the SETI CA.
        Connections without a valid client certificate must be rejected.
        Authorized callers: Contract Test Job (write), Plot Test Job (write),
        Feed Wr4ngler (read), Signal Aggregator (read for correlation),
        Gateway (read for admin queries).
    
    x-tca-observability:
      report-outbound-calls: true
      endpoint: https://seti-observability:4011/event
      pattern: fire-and-forget
      caller-name: "results"
      required-fields:
        - caller
        - callee
        - method
        - path
        - status_code
        - latency_ms
        - protocol
      implementation:
        timing: wrap-every-outbound-http-call
        non-blocking: true
        on-failure: log-and-drop
        do-not-instrument:
          - seti-observability
      notes: >
        Report all outbound HTTP calls to the SETI Observability Job.
        Results Job's primary traffic is inbound writes from test Jobs
        and outbound reads for Feed Wr4ngler and Signal Aggregator.
    
    servers:
      - url: https://results:4008
        description: Internal SETI network (mTLS enforced)
    
    tags:
      - name: contract-results
        description: Contract Test run result storage and retrieval
      - name: plot-results
        description: Plot Test run result storage and retrieval
      - name: trends
        description: Trend and summary queries across result history
      - name: health
        description: Service health
    
    paths:
    
      # ---------------------------------------------------------------------------
      # CONTRACT TEST RESULTS
      # ---------------------------------------------------------------------------
    
      /contract-results:
        post:
          tags: [contract-results]
          summary: Store a Contract Test run result
          description: |
            Persists a completed Contract Test run result. Called by the
            Contract Test Job immediately after each run completes,
            regardless of pass or fail status.
          requestBody:
            required: true
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/ContractResultWrite'
          responses:
            '201':
              description: Result stored
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/StorageConfirmation'
            '400':
              description: Invalid result payload
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
            '500':
              description: Internal error
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
    
        get:
          tags: [contract-results]
          summary: Query Contract Test results
          description: |
            Returns Contract Test results matching the specified filters.
            Results are returned in reverse chronological order (newest first).
            Used by Feed Wr4ngler when building authorized signal feeds.
          parameters:
            - name: application_id
              in: query
              required: false
              schema:
                type: string
              example: "app-tca-vox-prod"
            - name: environment
              in: query
              required: false
              schema:
                type: string
                enum: [production, staging, development]
            - name: status
              in: query
              required: false
              schema:
                type: string
                enum: [passed, failed, error, timeout]
            - name: job_name
              in: query
              required: false
              schema:
                type: string
              description: Filter to results containing failures for this Job
            - name: from
              in: query
              required: false
              schema:
                type: string
                format: date-time
              description: Results from this timestamp forward (ISO 8601 UTC)
            - name: to
              in: query
              required: false
              schema:
                type: string
                format: date-time
              description: Results up to this timestamp (ISO 8601 UTC)
            - name: limit
              in: query
              required: false
              schema:
                type: integer
                minimum: 1
                maximum: 100
                default: 20
            - name: offset
              in: query
              required: false
              schema:
                type: integer
                minimum: 0
                default: 0
          responses:
            '200':
              description: Results returned
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/ContractResultPage'
            '400':
              description: Invalid query parameters
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
            '500':
              description: Internal error
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
    
      /contract-results/{run_id}:
        get:
          tags: [contract-results]
          summary: Get a specific Contract Test result by run ID
          parameters:
            - name: run_id
              in: path
              required: true
              schema:
                type: string
              example: "run-a1b2c3d4"
          responses:
            '200':
              description: Result found
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/ContractResultRecord'
            '404':
              description: Result not found
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
            '500':
              description: Internal error
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
    
      # ---------------------------------------------------------------------------
      # PLOT TEST RESULTS
      # ---------------------------------------------------------------------------
    
      /plot-results:
        post:
          tags: [plot-results]
          summary: Store a Plot Test run result
          description: |
            Persists a completed Plot Test run result. Called by the
            Plot Test Job immediately after each run completes.
          requestBody:
            required: true
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/PlotResultWrite'
          responses:
            '201':
              description: Result stored
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/StorageConfirmation'
            '400':
              description: Invalid result payload
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
            '500':
              description: Internal error
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
    
        get:
          tags: [plot-results]
          summary: Query Plot Test results
          parameters:
            - name: application_id
              in: query
              required: false
              schema:
                type: string
            - name: environment
              in: query
              required: false
              schema:
                type: string
                enum: [production, staging, development]
            - name: status
              in: query
              required: false
              schema:
                type: string
                enum: [passed, failed, error, timeout]
            - name: plot_id
              in: query
              required: false
              schema:
                type: string
              description: Filter to results for a specific Plot
            - name: from
              in: query
              required: false
              schema:
                type: string
                format: date-time
            - name: to
              in: query
              required: false
              schema:
                type: string
                format: date-time
            - name: limit
              in: query
              required: false
              schema:
                type: integer
                minimum: 1
                maximum: 100
                default: 20
            - name: offset
              in: query
              required: false
              schema:
                type: integer
                minimum: 0
                default: 0
          responses:
            '200':
              description: Results returned
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/PlotResultPage'
            '400':
              description: Invalid query parameters
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
            '500':
              description: Internal error
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
    
      /plot-results/{run_id}:
        get:
          tags: [plot-results]
          summary: Get a specific Plot Test result by run ID
          parameters:
            - name: run_id
              in: path
              required: true
              schema:
                type: string
          responses:
            '200':
              description: Result found
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/PlotResultRecord'
            '404':
              description: Result not found
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
            '500':
              description: Internal error
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
    
      # ---------------------------------------------------------------------------
      # TRENDS
      # ---------------------------------------------------------------------------
    
      /trends/{application_id}:
        get:
          tags: [trends]
          summary: Get test result trends for an application
          description: |
            Returns aggregated pass/fail rates and failure patterns for an
            application over a specified time window. Used by the Feed
            Wr4ngler to populate Wr4ngler dashboards and by the Signal
            Aggregator for cross-application correlation analysis.
          parameters:
            - name: application_id
              in: path
              required: true
              schema:
                type: string
            - name: window
              in: query
              required: false
              schema:
                type: string
                enum: [24h, 7d, 30d, 90d]
                default: "24h"
              description: Time window for trend calculation
            - name: environment
              in: query
              required: false
              schema:
                type: string
                enum: [production, staging, development]
          responses:
            '200':
              description: Trends returned
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/ApplicationTrends'
            '404':
              description: Application not found or no results in window
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
            '500':
              description: Internal error
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
    
      /trends/cluster:
        get:
          tags: [trends]
          summary: Get cluster-wide test result trends
          description: |
            Returns aggregated trends across all registered applications.
            The cross-application view. Used by the Signal Aggregator for
            anomaly detection and by admin feeds.
          parameters:
            - name: window
              in: query
              required: false
              schema:
                type: string
                enum: [24h, 7d, 30d, 90d]
                default: "24h"
            - name: environment
              in: query
              required: false
              schema:
                type: string
                enum: [production, staging, development]
          responses:
            '200':
              description: Cluster trends returned
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/ClusterTrends'
            '500':
              description: Internal error
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
    
      /health:
        get:
          tags: [health]
          summary: Service health check
          responses:
            '200':
              description: Service healthy
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/HealthResponse'
    
    components:
      schemas:
    
        ContractResultWrite:
          type: object
          required:
            - run_id
            - application_id
            - environment
            - triggered_by
            - status
            - started_at
            - completed_at
            - duration_ms
            - summary
            - cache_status
          properties:
            run_id:
              type: string
              example: "run-a1b2c3d4"
            application_id:
              type: string
              example: "app-tca-vox-prod"
            environment:
              type: string
              enum: [production, staging, development]
            triggered_by:
              type: string
              enum: [scheduler, deployment, manual, seti-self]
            status:
              type: string
              enum: [passed, failed, error, timeout]
            started_at:
              type: string
              format: date-time
            completed_at:
              type: string
              format: date-time
            duration_ms:
              type: integer
            summary:
              type: object
              required: [total, passed, failed, skipped]
              properties:
                total:
                  type: integer
                passed:
                  type: integer
                failed:
                  type: integer
                skipped:
                  type: integer
            failures:
              type: array
              items:
                type: object
                required: [job_name, endpoint, test_type, detail]
                properties:
                  job_name:
                    type: string
                  endpoint:
                    type: string
                  test_type:
                    type: string
                  expected_status:
                    type: integer
                  actual_status:
                    type: integer
                  expected_field:
                    type: string
                  detail:
                    type: string
            policy_action:
              type: string
              enum: [none, alert, rollback, alert_and_rollback, escalate]
            cache_status:
              type: string
              enum: [cache_hit, cache_miss, cache_refreshed, cache_unavailable]
            cache_refresh_reason:
              type: string
    
        ContractResultRecord:
          allOf:
            - $ref: '#/components/schemas/ContractResultWrite'
            - type: object
              required:
                - stored_at
              properties:
                stored_at:
                  type: string
                  format: date-time
    
        ContractResultPage:
          type: object
          required:
            - results
            - total
            - limit
            - offset
          properties:
            results:
              type: array
              items:
                $ref: '#/components/schemas/ContractResultRecord'
            total:
              type: integer
              description: Total matching results (before pagination)
            limit:
              type: integer
            offset:
              type: integer
    
        PlotResultWrite:
          type: object
          required:
            - run_id
            - application_id
            - environment
            - triggered_by
            - status
            - started_at
            - completed_at
            - duration_ms
            - summary
          properties:
            run_id:
              type: string
            application_id:
              type: string
            environment:
              type: string
              enum: [production, staging, development]
            triggered_by:
              type: string
              enum: [scheduler, deployment, manual, seti-self]
            status:
              type: string
              enum: [passed, failed, error, timeout]
            started_at:
              type: string
              format: date-time
            completed_at:
              type: string
              format: date-time
            duration_ms:
              type: integer
            summary:
              type: object
              required: [total_plots, passed, failed, skipped, stale_plots_run]
              properties:
                total_plots:
                  type: integer
                passed:
                  type: integer
                failed:
                  type: integer
                skipped:
                  type: integer
                stale_plots_run:
                  type: integer
                  description: >
                    Plots with needs_regeneration status that were run anyway.
                    Results for these are tagged as potentially stale.
            plot_results:
              type: array
              items:
                $ref: '#/components/schemas/PlotRunResult'
    
        PlotRunResult:
          type: object
          required:
            - plot_id
            - plot_name
            - status
            - duration_ms
            - stale
          properties:
            plot_id:
              type: string
            plot_name:
              type: string
            status:
              type: string
              enum: [passed, failed, error]
            duration_ms:
              type: integer
            stale:
              type: boolean
              description: True when plot had needs_regeneration status at run time
            failed_step:
              type: integer
              description: Step number where failure occurred (present when failed)
            failure_detail:
              type: string
              description: >
                Human-readable failure description. Includes both response
                assertion failures and call chain verification failures.
            call_chain_verified:
              type: boolean
              description: >
                Whether the expected inter-service call chain was confirmed
                in the Signal Aggregator event stream.
    
        PlotResultRecord:
          allOf:
            - $ref: '#/components/schemas/PlotResultWrite'
            - type: object
              required:
                - stored_at
              properties:
                stored_at:
                  type: string
                  format: date-time
    
        PlotResultPage:
          type: object
          required:
            - results
            - total
            - limit
            - offset
          properties:
            results:
              type: array
              items:
                $ref: '#/components/schemas/PlotResultRecord'
            total:
              type: integer
            limit:
              type: integer
            offset:
              type: integer
    
        StorageConfirmation:
          type: object
          required:
            - run_id
            - stored_at
          properties:
            run_id:
              type: string
            stored_at:
              type: string
              format: date-time
    
        ApplicationTrends:
          type: object
          required:
            - application_id
            - window
            - contract_tests
            - plot_tests
            - generated_at
          properties:
            application_id:
              type: string
            window:
              type: string
              enum: [24h, 7d, 30d, 90d]
            contract_tests:
              $ref: '#/components/schemas/TierTrends'
            plot_tests:
              $ref: '#/components/schemas/TierTrends'
            generated_at:
              type: string
              format: date-time
    
        TierTrends:
          type: object
          required:
            - total_runs
            - pass_rate
            - most_failing_job
            - most_failing_endpoint
          properties:
            total_runs:
              type: integer
            pass_rate:
              type: string
              description: Pass rate as decimal string e.g. "0.97"
            failure_rate:
              type: string
              description: Failure rate as decimal string e.g. "0.03"
            most_failing_job:
              type: string
              description: Job name with highest failure count in window. Null if no failures.
            most_failing_endpoint:
              type: string
              description: Endpoint with highest failure count. Null if no failures.
            consecutive_failures:
              type: integer
              description: Current run of consecutive failures. 0 if last run passed.
    
        ClusterTrends:
          type: object
          required:
            - window
            - applications_monitored
            - cluster_contract_pass_rate
            - cluster_plot_pass_rate
            - applications_with_failures
            - generated_at
          properties:
            window:
              type: string
              enum: [24h, 7d, 30d, 90d]
            applications_monitored:
              type: integer
            cluster_contract_pass_rate:
              type: string
              description: Aggregate contract test pass rate across all applications
            cluster_plot_pass_rate:
              type: string
              description: Aggregate plot test pass rate across all applications
            applications_with_failures:
              type: array
              items:
                type: object
                required:
                  - application_id
                  - failure_count
                  - last_failure_at
                properties:
                  application_id:
                    type: string
                  failure_count:
                    type: integer
                  last_failure_at:
                    type: string
                    format: date-time
            generated_at:
              type: string
              format: date-time
    
        HealthResponse:
          type: object
          required:
            - status
            - contract_results_stored
            - plot_results_stored
            - uptime_seconds
          properties:
            status:
              type: string
              enum: [healthy, degraded]
              description: >
                degraded when database connection is unhealthy.
            contract_results_stored:
              type: integer
              description: Total contract test results in database
            plot_results_stored:
              type: integer
              description: Total plot test results in database
            uptime_seconds:
              type: integer
    
        Error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
              example: "RESULT_NOT_FOUND"
            message:
              type: string
              example: "Run 'run-a1b2c3d4' not found"
  seti-observability.yaml: |
    openapi: 3.1.0
    info:
      title: SETI - seti-observability
      description: |
        Inter-service event collector and publisher. Go · Scratch container.
    
        Receives event reports from all Jobs (contract obligation: x-tca-observability).
        Validates caller against allowlist. Sanitizes sensitive data from paths.
        Publishes clean events to Redis seti:events pub/sub channel.
        Gateway subscribes to seti:events and fans to SSE clients.
    
        Fire-and-forget from callers — Observability Job always returns 202.
        Never on the critical path.
    
        The Observability Job itself does not report outbound calls —
        doing so would create a reporting loop. The absence of x-tca-observability
        in this contract is intentional and must not be added.
    
        Scratch container: no shell, no package manager, no OS utilities beyond
        the static binary. Minimal attack surface — this service receives traffic
        from every other Job in the constellation.
    
        Known callers (SETI constellation):
          gateway, signal-clearance, policy, contract-test, plot-test, plot-store,
          signal-aggregator, feed-wrangler, results, interactions, augur-canis, ai-lien,
          integration
    
        Internal service — mTLS only. Not externally exposed.
        Ported from TCA Vox with SETI allowlist.
      version: 0.1.0
    
    x-tca-security:
      transport: mtls
      tls-min-version: "1.3"
      client-cert-required: true
      reject-without-client-cert: true
      ca-cert: /certs/ca.crt
      service-cert: /certs/seti-observability.crt
      service-key: /certs/seti-observability.key
      implementation:
        server:
          load-ca-cert: true
          load-service-cert: true
          load-service-key: true
          require-and-verify-client-cert: true
        client:
          load-ca-cert: true
          load-service-cert: true
          load-service-key: true
          verify-server-cert: true
      notes: >
        Every inbound connection must present a certificate signed by the TCA CA.
        Connections without a valid client certificate must be rejected — not
        downgraded to unauthenticated.
    
    servers:
      - url: https://seti-observability:4011
        description: Internal Docker network (mTLS enforced)
    
    tags:
      - name: events
        description: Event ingestion
      - name: debug
        description: Development and debugging endpoints
      - name: health
        description: Service health
    
    paths:
      /health:
        get:
          summary: Service health
          tags: [health]
          responses:
            '200':
              description: Healthy
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/HealthResponse'
    
      /event:
        post:
          summary: Receive an inter-service event report
          description: |
            Always returns 202 — even if the event is dropped due to allowlist
            failure or sanitization. Callers see a uniform response. This is
            consistent with fire-and-forget: callers are not equipped to handle
            differentiated responses.
    
            id and timestamp are assigned here — callers do not generate them.
    
            Allowlist (SETI constellation):
              gateway, signal-clearance, policy, contract-test, plot-test, plot-store,
              signal-aggregator, feed-wrangler, results, interactions, augur-canis, ai-lien,
              integration
    
            Unknown callers or callees are dropped silently. Caller receives 202.
            Silent drop prevents allowlist probing by a compromised service.
    
            Path sanitization before Redis publish:
              - JWT tokens (eyJ...) → [token]
              - IPv4/IPv6 addresses → [ip]
              - UUIDs → [id]
              - Query string values → key=[redacted]
          tags: [events]
          requestBody:
            required: true
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/EventReport'
                example:
                  caller: poll-wr4ngler
                  callee: redis-handler
                  method: POST
                  path: /vote
                  status_code: 202
                  latency_ms: 3
                  protocol: mtls
          responses:
            '202':
              description: Event received (accepted or silently dropped)
    
      /rules:
        get:
          summary: Return active allowlist and sanitization rules
          description: |
            Development and debugging endpoint. Returns the active
            caller/callee allowlist and sanitization patterns.
            Internal only — not for external exposure.
            If inter-service traffic is missing from the dashboard,
            check here first to verify service names are registered.
          tags: [debug]
          responses:
            '200':
              description: Active filter configuration
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/RulesResponse'
    
    components:
      schemas:
        EventReport:
          type: object
          required: [caller, callee, method, path, status_code, latency_ms, protocol]
          properties:
            caller:
              type: string
              description: Reporting service name — must match allowlist exactly
              enum:
                - gateway
                - signal-clearance
                - policy
                - contract-test
                - plot-test
                - plot-store
                - signal-aggregator
                - feed-wrangler
                - results
                - interactions
                - augur-canis
                - ai-lien
                - integration
            callee:
              type: string
              description: Name of the service that was called
            method:
              type: string
              enum: [GET, POST, PUT, DELETE, PATCH, HEAD, OPTIONS]
            path:
              type: string
              description: Request path — sanitized by this service before publishing
            status_code:
              type: integer
            latency_ms:
              type: integer
            protocol:
              type: string
              enum: [http, https, mtls, sse, websocket]
    
        RulesResponse:
          type: object
          properties:
            knownCallers:
              type: array
              items:
                type: string
            knownCallees:
              type: array
              items:
                type: string
            sanitizationPatterns:
              type: array
              items:
                type: object
                properties:
                  pattern:
                    type: string
                  replacement:
                    type: string
    
        HealthResponse:
          type: object
          properties:
            status:
              type: string
              enum: [healthy]
            service:
              type: string
              example: seti-observability
            language:
              type: string
              example: Go
            redis:
              type: string
              enum: [connected, disconnected]
            eventsReceived:
              type: integer
            eventsPublished:
              type: integer
            eventsDropped:
              type: integer
  signal-aggregator.yaml: |
    openapi: 3.1.0
    
    info:
      title: SETI - Signal Aggregator Job
      description: |
        Subscribes to tca:events Redis pub/sub streams from all registered
        TCA applications and aggregates them into a single cluster-level
        signal layer. The Signal Aggregator is the only SETI Job with
        multi-application event stream access.
    
        Three primary functions:
    
        1. CALL CHAIN VERIFICATION — during Plot Test execution, the Plot
           Test Job queries the Signal Aggregator to verify that the
           expected inter-service call chain actually occurred in the
           monitored application's observability stream. The Signal
           Aggregator correlates events by timestamp window and application
           ID to answer the question: "did these calls happen, in this
           order, within the expected time window?"
    
        2. CROSS-APPLICATION CORRELATION — the Signal Aggregator maintains
           a rolling event window across all registered applications. This
           is the foundation for detecting anomalous patterns that are
           invisible to any single application's monitoring — traffic
           correlations, timing relationships, and behavioral changes that
           span application boundaries.
    
        3. WATCHDOG HEALTH AGGREGATION — the Signal Aggregator subscribes
           to each registered application's tca:augur-canis Redis channel
           alongside tca:events. Health state, latency, and
           time-to-complete for every Job in every monitored constellation
           flow into the same signal layer as observability events. This
           gives SETI a unified view of both behavioral traffic and Job
           health across all monitored applications. The Watchdog feed is
           included in cross-application correlation queries and surfaces
           in the Results Job trend data as constellation health metrics.
    
        The Signal Aggregator does not make policy decisions. It observes,
        correlates, and answers queries. Callers decide what to do with
        the data.
    
        Signal Aggregator runs continuously. It maintains Redis subscriptions
        to all registered application event streams and keeps a rolling
        in-memory event window for correlation queries. The window size is
        configurable — default 10 minutes. Events older than the window
        are not retained in memory but are available via the Results Job
        historical query path.
    
        Internal service — mTLS only, not externally exposed.
      version: 0.1.0
    
    x-tca-security:
      transport: mtls
      tls-min-version: "1.3"
      client-cert-required: true
      reject-without-client-cert: true
      ca-cert: /certs/ca.crt
      service-cert: /certs/signal-aggregator.crt
      service-key: /certs/signal-aggregator.key
      implementation:
        server:
          load-ca-cert: true
          load-service-cert: true
          load-service-key: true
          require-and-verify-client-cert: true
        client:
          load-ca-cert: true
          load-service-cert: true
          load-service-key: true
          verify-server-cert: true
      notes: >
        Every inbound connection must present a certificate signed by the
        SETI CA. Connections without a valid client certificate must be
        rejected. Authorized callers: Plot Test Job (call chain
        verification), Watchdog Job (correlation queries), Results Job
        (trend data reads), Feed Wr4ngler (live event forwarding to
        authorized feeds). Signal Aggregator has access to observability
        data from every registered application — it is a high-value
        target. Unknown caller certificates are rejected and logged.
    
    x-tca-observability:
      report-outbound-calls: true
      endpoint: https://seti-observability:4011/event
      pattern: fire-and-forget
      caller-name: "signal-aggregator"
      required-fields:
        - caller
        - callee
        - method
        - path
        - status_code
        - latency_ms
        - protocol
      implementation:
        timing: wrap-every-outbound-http-call
        non-blocking: true
        on-failure: log-and-drop
        do-not-instrument:
          - seti-observability
      notes: >
        Report all outbound HTTP calls to the SETI Observability Job.
        Signal Aggregator's primary outbound traffic is Redis subscription
        management — not HTTP. HTTP calls are to Policy Job (application
        registry reads on startup and registration change events) and
        to the Feed Wr4ngler (forwarding matched events to live feeds).
    
    servers:
      - url: https://signal-aggregator:4006
        description: Internal SETI network (mTLS enforced)
    
    tags:
      - name: verification
        description: Call chain verification for Plot Test execution
      - name: correlation
        description: Cross-application correlation queries
      - name: subscriptions
        description: Application stream subscription management
      - name: health
        description: Service health and subscription status
    
    paths:
    
      # ---------------------------------------------------------------------------
      # CALL CHAIN VERIFICATION
      # ---------------------------------------------------------------------------
    
      /verify/call-chain:
        post:
          tags: [verification]
          summary: Verify an expected inter-service call chain occurred
          description: |
            Called by the Plot Test Job after each Plot step executes.
            Queries the rolling event window to verify that the expected
            sequence of inter-service calls occurred in the target
            application's observability stream within the specified
            time window.
    
            Matching is ordered — the calls must appear in the sequence
            specified. Gaps between calls are allowed (other calls may
            occur between expected ones). Strict mode requires no
            unexpected calls between the expected sequence members.
    
            This is a hot path during Plot Test execution — Plot Test
            waits on this response before proceeding to the next step.
            Response must be fast. The event window query is in-memory.
          requestBody:
            required: true
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/CallChainVerificationRequest'
                example:
                  application_id: "app-tca-vox-prod"
                  window_start: "2026-03-27T14:00:05Z"
                  window_end: "2026-03-27T14:00:08Z"
                  expected_chain:
                    - caller: "game-state"
                      callee: "deck-service"
                      method: "POST"
                      path_pattern: "/deal"
                    - caller: "game-state"
                      callee: "hand-evaluator"
                      method: "POST"
                      path_pattern: "/evaluate"
                  strict: false
          responses:
            '200':
              description: Verification result returned
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/CallChainVerificationResult'
            '400':
              description: Invalid verification request
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
            '404':
              description: Application not found in active subscriptions
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
            '408':
              description: >
                Window not yet available — requested window_end is in the
                future or too recent. Caller should retry after a short delay.
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
            '500':
              description: Internal error
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
    
      # ---------------------------------------------------------------------------
      # CORRELATION
      # ---------------------------------------------------------------------------
    
      /correlate:
        post:
          tags: [correlation]
          summary: Query cross-application event correlations
          description: |
            Queries the rolling event window across multiple applications
            for correlated patterns. Used by the Watchdog Job for anomaly
            detection and by the AI-lien Job when analysis_type is
            cross_application_correlation.
    
            Correlation queries are more expensive than verification
            queries — they span multiple application event streams.
            Not on any critical path. Callers should set appropriate
            timeouts.
          requestBody:
            required: true
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/CorrelationRequest'
          responses:
            '200':
              description: Correlation results returned
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/CorrelationResult'
            '400':
              description: Invalid correlation request
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
            '500':
              description: Internal error
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
    
      /events/{application_id}:
        get:
          tags: [correlation]
          summary: Get recent events for an application from the rolling window
          description: |
            Returns events from the in-memory rolling window for a specific
            application. Used by the Feed Wr4ngler to populate live feeds
            and by the Watchdog for behavioral analysis.
    
            Only returns events within the current window. For historical
            events beyond the window, use the Results Job.
          parameters:
            - name: application_id
              in: path
              required: true
              schema:
                type: string
              example: "app-tca-vox-prod"
            - name: from
              in: query
              required: false
              schema:
                type: string
                format: date-time
              description: >
                Start of time range. Must be within the rolling window.
                If omitted, returns all events in the current window.
            - name: caller
              in: query
              required: false
              schema:
                type: string
              description: Filter by caller service name
            - name: callee
              in: query
              required: false
              schema:
                type: string
              description: Filter by callee service name
            - name: limit
              in: query
              required: false
              schema:
                type: integer
                minimum: 1
                maximum: 500
                default: 100
          responses:
            '200':
              description: Events returned
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/EventPage'
            '404':
              description: Application not found in active subscriptions
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
            '500':
              description: Internal error
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
    
      # ---------------------------------------------------------------------------
      # SUBSCRIPTION MANAGEMENT
      # ---------------------------------------------------------------------------
    
      /subscriptions:
        get:
          tags: [subscriptions]
          summary: List active application stream subscriptions
          description: |
            Returns the current state of all Redis pub/sub subscriptions.
            A missing application here when it should be present is an
            operational signal — subscription may have dropped and not
            recovered.
          responses:
            '200':
              description: Subscription list returned
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/SubscriptionList'
            '500':
              description: Internal error
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
    
      /subscriptions/{application_id}/watchdog:
        post:
          tags: [subscriptions]
          summary: Add a tca:augur-canis subscription for a registered application
          description: |
            Called by the Policy Job when a new application is registered
            with SETI — immediately after the tca:events subscription is
            opened. The Signal Aggregator opens a Redis subscription to
            the application's tca:augur-canis channel and begins including
            Augur Canis health events in the rolling window alongside
            observability events.
    
            Watchdog events in the window are tagged with source: watchdog
            so they can be distinguished from tca:events traffic in
            correlation queries.
          parameters:
            - name: application_id
              in: path
              required: true
              schema:
                type: string
          requestBody:
            required: true
            content:
              application/json:
                schema:
                  \$ref: '#/components/schemas/AugurCanisSubscriptionRequest'
          responses:
            '201':
              description: Augur Canis subscription opened
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Subscription'
            '400':
              description: Invalid subscription request
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
            '409':
              description: Augur Canis subscription already active for this application
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
            '500':
              description: Internal error
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
    
        delete:
          tags: [subscriptions]
          summary: Remove tca:augur-canis subscription for a deregistered application
          parameters:
            - name: application_id
              in: path
              required: true
              schema:
                type: string
          responses:
            '200':
              description: Augur Canis subscription closed
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/SubscriptionCloseResult'
            '404':
              description: No active Augur Canis subscription for this application
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
            '500':
              description: Internal error
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
    
      /subscriptions/{application_id}:
        post:
          tags: [subscriptions]
          summary: Add a subscription for a newly registered application
          description: |
            Called by the Policy Job when a new application is registered
            with SETI. Signal Aggregator opens a Redis subscription to
            the application's tca:events channel and begins including its
            events in the rolling window.
          parameters:
            - name: application_id
              in: path
              required: true
              schema:
                type: string
          requestBody:
            required: true
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/SubscriptionRequest'
          responses:
            '201':
              description: Subscription opened
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Subscription'
            '400':
              description: Invalid subscription request
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
            '409':
              description: Subscription already active for this application
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
            '500':
              description: Internal error
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
    
        delete:
          tags: [subscriptions]
          summary: Remove a subscription for a deregistered application
          description: |
            Called by the Policy Job when an application is deregistered.
            Signal Aggregator closes the Redis subscription and purges
            the application's events from the rolling window.
          parameters:
            - name: application_id
              in: path
              required: true
              schema:
                type: string
          responses:
            '200':
              description: Subscription closed and events purged
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/SubscriptionCloseResult'
            '404':
              description: No active subscription for this application
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
            '500':
              description: Internal error
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
    
      /health:
        get:
          tags: [health]
          summary: Service health and subscription status
          responses:
            '200':
              description: Health status returned
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/HealthResponse'
    
      /federation/events/{application_id}:
        post:
          tags: [federation]
          summary: Ingest a verified health event from an external AC feed
          description: |
            Internal endpoint. Called by the Signal Aggregator's own feed
            monitor when an event arrives on an external AC's tca:augur-canis
            Redis channel.
    
            Before calling this endpoint the feed monitor verifies the event
            signature against the stored session certificate for this
            application. Events that fail verification are dropped and trigger
            a re-registration request to the AC via the Policy Job.
    
            Events that pass verification are merged into the rolling window
            alongside seti-self events. Plot Tests and the AI-lien Job see
            a unified event stream regardless of which constellation generated
            each event.
          parameters:
            - name: application_id
              in: path
              required: true
              schema:
                type: string
          requestBody:
            required: true
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/FederatedHealthEvent'
          responses:
            '202':
              description: Event accepted into rolling window
            '401':
              description: Signature verification failed
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
            '404':
              description: Application not registered
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
    
      /federation/subscriptions:
        get:
          tags: [federation]
          summary: List all active external AC feed subscriptions
          description: |
            Returns the current state of all external AC feed subscriptions.
            Each entry shows the application, the AC endpoint, feed health,
            and when the session certificate was last updated.
    
            A subscription in degraded state means the feed monitor has
            detected silence or verification failure and is attempting
            re-registration. This is expected and recoverable — AC may
            have restarted.
    
            A subscription missing from this list when it should be present
            means the Signal Aggregator has not yet established the subscription
            or it failed to initialize. Check the Policy Job's federation
            status for the affected application.
          responses:
            '200':
              description: Active external AC subscriptions
              content:
                application/json:
                  schema:
                    type: object
                    properties:
                      subscriptions:
                        type: array
                        items:
                          $ref: '#/components/schemas/FederationSubscriptionStatus'
    
      /federation/subscriptions/{application_id}/reconnect:
        post:
          tags: [federation]
          summary: Force reconnection to an external AC feed
          description: |
            Triggers immediate re-registration with the external AC for this
            application. Fetches the current ac_endpoint and session cert from
            the Policy Job, re-submits the star-gazer registration request,
            and updates the stored session certificate on success.
    
            Called automatically by the feed monitor on silence threshold breach
            or signature verification failure. Can also be called manually for
            debugging.
          parameters:
            - name: application_id
              in: path
              required: true
              schema:
                type: string
          responses:
            '200':
              description: Reconnection initiated
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/FederationSubscriptionStatus'
            '404':
              description: Application not found or no ac_endpoint configured
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
            '502':
              description: AC endpoint unreachable
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
    
    
    components:
      schemas:
    
        ExpectedCall:
          type: object
          required:
            - caller
            - callee
          properties:
            caller:
              type: string
              description: Expected caller service name
              example: "game-state"
            callee:
              type: string
              description: Expected callee service name
              example: "deck-service"
            method:
              type: string
              enum: [GET, POST, PUT, PATCH, DELETE]
              description: Optional — if omitted any method satisfies
            path_pattern:
              type: string
              description: >
                Optional path pattern. Supports {id} wildcards.
                If omitted any path satisfies.
              example: "/deal"
            max_latency_ms:
              type: integer
              description: >
                Optional maximum acceptable latency for this call.
                If the observed call exceeded this latency the step
                is flagged even if the call occurred.
    
        ObservedCall:
          type: object
          required:
            - caller
            - callee
            - method
            - path
            - status_code
            - latency_ms
            - protocol
            - observed_at
          properties:
            caller:
              type: string
            callee:
              type: string
            method:
              type: string
            path:
              type: string
              description: Sanitized path from the observability stream
            status_code:
              type: integer
            latency_ms:
              type: integer
            protocol:
              type: string
            observed_at:
              type: string
              format: date-time
    
        CallChainVerificationRequest:
          type: object
          required:
            - application_id
            - window_start
            - window_end
            - expected_chain
          properties:
            application_id:
              type: string
              description: Application whose event stream to query
              example: "app-tca-vox-prod"
            window_start:
              type: string
              format: date-time
              description: Start of the time window to search
            window_end:
              type: string
              format: date-time
              description: End of the time window to search
            expected_chain:
              type: array
              items:
                $ref: '#/components/schemas/ExpectedCall'
              minItems: 1
              description: >
                Expected call sequence in order. Calls must appear
                in this sequence within the window.
            strict:
              type: boolean
              default: false
              description: >
                When true, no calls other than those in expected_chain
                may appear between matched calls. Use for validating
                that a step did not trigger unexpected downstream calls.
    
        CallChainVerificationResult:
          type: object
          required:
            - application_id
            - verified
            - matched_calls
            - window_start
            - window_end
          properties:
            application_id:
              type: string
            verified:
              type: boolean
              description: >
                True when all expected calls were found in sequence
                within the window. False if any expected call was
                missing, out of order, or (in strict mode) unexpected
                calls appeared between sequence members.
            matched_calls:
              type: array
              items:
                type: object
                required:
                  - expected
                  - observed
                  - matched
                properties:
                  expected:
                    $ref: '#/components/schemas/ExpectedCall'
                  observed:
                    $ref: '#/components/schemas/ObservedCall'
                  matched:
                    type: boolean
                  latency_exceeded:
                    type: boolean
                    description: >
                      Present when expected.max_latency_ms was set and
                      the observed call exceeded it.
            missing_calls:
              type: array
              items:
                $ref: '#/components/schemas/ExpectedCall'
              description: Expected calls not found in the window
            unexpected_calls:
              type: array
              items:
                $ref: '#/components/schemas/ObservedCall'
              description: >
                Present in strict mode. Calls observed between sequence
                members that were not in the expected chain.
            window_start:
              type: string
              format: date-time
            window_end:
              type: string
              format: date-time
    
        CorrelationRequest:
          type: object
          required:
            - application_ids
            - window_minutes
          properties:
            application_ids:
              type: array
              items:
                type: string
              minItems: 2
              description: Applications to correlate across
              example: ["app-tca-vox-prod", "app-tca-seti"]
            window_minutes:
              type: integer
              minimum: 1
              maximum: 10
              description: >
                Time window to search for correlations. Bounded by
                the rolling window size. Cannot exceed the configured
                window — use Results Job for longer historical correlation.
              example: 5
            pattern_hints:
              type: array
              items:
                type: string
              description: >
                Optional. Hints to guide the correlation search.
                Used by the Watchdog to focus the query before
                passing results to AI-lien for deeper analysis.
              example:
                - "traffic spike in app-a correlates with errors in app-b"
                - "unusual silence from service after deployment"
    
        CorrelationResult:
          type: object
          required:
            - application_ids
            - window_minutes
            - events_analyzed
            - correlations
            - generated_at
          properties:
            application_ids:
              type: array
              items:
                type: string
            window_minutes:
              type: integer
            events_analyzed:
              type: integer
              description: Total events across all applications in the window
            correlations:
              type: array
              items:
                $ref: '#/components/schemas/Correlation'
              description: Detected correlations. Empty if none found.
            generated_at:
              type: string
              format: date-time
    
        Correlation:
          type: object
          required:
            - correlation_type
            - applications_involved
            - description
            - confidence
            - supporting_events
          properties:
            correlation_type:
              type: string
              enum:
                - traffic_spike_correlation
                - error_rate_correlation
                - timing_correlation
                - silence_correlation
                - latency_spike_correlation
              description: Category of correlation detected
            applications_involved:
              type: array
              items:
                type: string
              description: Which applications are involved in this correlation
            description:
              type: string
              description: >
                Human-readable description of the correlation.
                Written to be directly usable as supporting_data
                for an AI-lien correlation analysis request.
            confidence:
              type: string
              description: Correlation confidence as decimal string
              example: "0.82"
            supporting_events:
              type: array
              items:
                $ref: '#/components/schemas/ObservedCall'
              description: Events that support this correlation finding
    
        EventPage:
          type: object
          required:
            - application_id
            - events
            - total
            - window_start
            - window_end
          properties:
            application_id:
              type: string
            events:
              type: array
              items:
                $ref: '#/components/schemas/ObservedCall'
            total:
              type: integer
            window_start:
              type: string
              format: date-time
            window_end:
              type: string
              format: date-time
    
        SubscriptionRequest:
          type: object
          required:
            - application_id
            - redis_connection
            - channel
          properties:
            application_id:
              type: string
            redis_connection:
              type: string
              description: Redis connection string for this application's event stream
              example: "redis://vox-redis-prod:6379"
            channel:
              type: string
              description: >
                Redis pub/sub channel name. Convention: tca:events.
                Specified explicitly to support applications that
                use a non-standard channel name.
              example: "tca:events"
    
        AugurCanisSubscriptionRequest:
          type: object
          required:
            - application_id
            - redis_connection
          properties:
            application_id:
              type: string
            redis_connection:
              type: string
              description: Redis connection string for this application's Watchdog feed
              example: "redis://vox-redis-prod:6379"
            channel:
              type: string
              description: >
                Redis pub/sub channel name. Convention: tca:augur-canis.
                Specified explicitly to support non-standard channel names.
              default: "tca:augur-canis"
              example: "tca:augur-canis"
    
        Subscription:
          type: object
          required:
            - application_id
            - redis_connection
            - channel
            - status
            - subscribed_at
            - events_received
          properties:
            application_id:
              type: string
            redis_connection:
              type: string
            channel:
              type: string
            status:
              type: string
              enum: [active, reconnecting, failed]
              description: >
                active — subscription healthy, events flowing.
                reconnecting — Redis connection dropped, retrying.
                failed — repeated reconnection failures, manual intervention needed.
            subscribed_at:
              type: string
              format: date-time
            events_received:
              type: integer
              description: Total events received since subscription opened
            last_event_at:
              type: string
              format: date-time
              description: Timestamp of most recent event received
    
        SubscriptionList:
          type: object
          required:
            - subscriptions
            - total
            - active
            - reconnecting
            - failed
          properties:
            subscriptions:
              type: array
              items:
                $ref: '#/components/schemas/Subscription'
            total:
              type: integer
            active:
              type: integer
            reconnecting:
              type: integer
            failed:
              type: integer
              description: Non-zero value here requires immediate attention
    
        SubscriptionCloseResult:
          type: object
          required:
            - application_id
            - events_purged
            - closed_at
          properties:
            application_id:
              type: string
            events_purged:
              type: integer
            closed_at:
              type: string
              format: date-time
    
        HealthResponse:
          type: object
          required:
            - status
            - subscriptions_active
            - subscriptions_reconnecting
            - subscriptions_failed
            - window_size_minutes
            - events_in_window
            - total_events_received
            - uptime_seconds
          properties:
            status:
              type: string
              enum: [healthy, degraded]
              description: >
                degraded when any subscription is in failed state
                or window coverage is incomplete.
            subscriptions_active:
              type: integer
            subscriptions_reconnecting:
              type: integer
            subscriptions_failed:
              type: integer
            window_size_minutes:
              type: integer
              description: Configured rolling window size
            events_in_window:
              type: integer
              description: Current event count across all applications in window
            total_events_received:
              type: integer
              description: Total events received across all subscriptions since restart
            uptime_seconds:
              type: integer
    
    
        FederatedHealthEvent:
          type: object
          required: [service_name, healthy, checked_at, session_cert_id, signature]
          properties:
            service_name:
              type: string
              description: Service name within its own constellation
            healthy:
              type: boolean
            latency_ms:
              type: integer
            checked_at:
              type: string
              format: date-time
            session_cert_id:
              type: string
              description: >
                Identifies which session certificate signed this event.
                If this does not match the stored session_cert_id for this
                application, the feed monitor treats it as a rotation signal
                and triggers re-registration before processing further events.
            signature:
              type: string
              description: >
                Base64-encoded signature of the event payload signed with
                the AC's session private key. Verified against the session
                public certificate stored when SETI last registered with
                this AC.
            alert:
              type: object
              description: Present when the AC is emitting an alert for this event
              properties:
                alert_id:
                  type: string
                alert_type:
                  type: string
                  enum: [silence, latency_drift, failure_rate]
                bark_count:
                  type: integer
                message:
                  type: string
    
        FederationSubscriptionStatus:
          type: object
          required: [application_id, status, ac_endpoint]
          properties:
            application_id:
              type: string
            ac_endpoint:
              type: string
            status:
              type: string
              enum: [active, degraded, reconnecting, failed]
              description: >
                active — feed live, events verifying correctly.
                degraded — silence threshold breached, re-registration in progress.
                reconnecting — re-registration request sent, awaiting response.
                failed — AC unreachable after retry limit, requires Sec Wr4ngler
                attention.
            session_cert_id:
              type: string
              description: Present when status is active
            last_event_at:
              type: string
              format: date-time
            reconnect_count:
              type: integer
            silence_threshold_seconds:
              type: integer
              description: Seconds of feed silence before re-registration is triggered
    
        Error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
              example: "APPLICATION_NOT_SUBSCRIBED"
            message:
              type: string
              example: "Application 'app-tca-vox-prod' has no active subscription"
  signal-clearance.yaml: |
    openapi: 3.1.0
    
    info:
      title: SETI - Signal Clearance Job
      description: |
        SETI's purpose-built authorization layer. Signal Clearance is not
        a standard role-based User Job — it manages clearance levels that
        govern what signals a Wr4ngler is authorized to observe.
    
        The distinction is intentional and architectural. A standard User
        Job manages what a user can do. Signal Clearance manages what a
        Wr4ngler is cleared to see. Those are different enough concerns
        that a specialized implementation is justified — not cosmetically
        different, genuinely different in threat model and access pattern.
    
        IDENTITY: FEDERATED VIA CUSTOMER ACTIVE DIRECTORY
    
        Signal Clearance does not manage passwords, passkeys, or credentials.
        Identity is delegated entirely to the customer's identity provider
        — Active Directory via Azure Entra ID, ADFS, or any OIDC-compliant
        IdP. The customer already manages user lifecycle, MFA enforcement,
        and offboarding. SETI piggybacks on that rather than duplicating it.
    
        Authentication flow:
        1. Wr4ngler requests login via Gateway
        2. Gateway redirects to the customer IdP's OIDC authorization endpoint
        3. Customer IdP authenticates against AD, returns authorization code
        4. Gateway exchanges code for OIDC tokens at the IdP token endpoint
        5. Gateway presents the ID token to Signal Clearance /auth/federated
        6. Signal Clearance validates the ID token against the IdP's JWKS,
           maps the identity to a Wr4ngler record and clearance level,
           and issues SETI's own short-lived JWT
        7. SETI JWT carries wrangler_id and clearance_level — downstream
           Jobs see SETI credentials, never the IdP token
    
        CLEARANCE MAPPING:
        AD group membership maps to SETI clearance levels. The Sec Wr4ngler
        configures the group-to-clearance mapping in Signal Clearance.
        A Wr4ngler's clearance level in SETI is determined by their AD
        group at login time — it is not stored permanently and may change
        between sessions if their AD group membership changes.
    
        Wr4ngler records in SETI are created automatically on first
        federated login if the Wr4ngler's AD identity maps to a known
        clearance level. Wr4nglers whose AD identity maps to no configured
        clearance level are denied access — no manual pre-registration
        required for known groups.
    
        CLEARANCE LEVELS:
        Clearances are defined and administered by the Sec Wr4ngler.
        Clearances determine which signal feeds a Wr4ngler can subscribe
        to. Feed Wr4ngler calls Signal Clearance on every feed provisioning
        request to validate the Wr4ngler's current clearance for the
        requested scope.
    
        The SETI JWT carries the clearance level so Feed Wr4ngler can make
        fast routing decisions without re-calling Signal Clearance on every
        message published to a feed — only on feed provisioning.
    
        Internal service — mTLS only, not externally exposed. All Wr4ngler
        traffic reaches Signal Clearance through the Gateway.
      version: 0.2.0
    
    x-tca-security:
      transport: mtls
      tls-min-version: "1.3"
      client-cert-required: true
      reject-without-client-cert: true
      ca-cert: /certs/ca.crt
      service-cert: /certs/signal-clearance.crt
      service-key: /certs/signal-clearance.key
      implementation:
        server:
          load-ca-cert: true
          load-service-cert: true
          load-service-key: true
          require-and-verify-client-cert: true
        client:
          load-ca-cert: true
          load-service-cert: true
          load-service-key: true
          verify-server-cert: true
      notes: >
        Every inbound connection must present a certificate signed by the
        SETI CA. Connections without a valid client certificate must be
        rejected. Authorized callers: Gateway (all Wr4ngler-facing
        operations), Feed Wr4ngler (clearance validation on feed
        provisioning), Policy Job (clearance definition reads).
        Signal Clearance holds identity and clearance data — it is a
        high-value target. Unknown caller certificates are rejected and
        logged as security events.
    
    x-tca-observability:
      report-outbound-calls: true
      endpoint: https://seti-observability:4011/event
      pattern: fire-and-forget
      caller-name: "signal-clearance"
      required-fields:
        - caller
        - callee
        - method
        - path
        - status_code
        - latency_ms
        - protocol
      implementation:
        timing: wrap-every-outbound-http-call
        non-blocking: true
        on-failure: log-and-drop
        do-not-instrument:
          - seti-observability
      notes: >
        Report all outbound HTTP calls. Signal Clearance outbound HTTP
        calls include the IdP JWKS endpoint (on startup and key rotation),
        and the IdP userinfo endpoint (on refresh when introspection is
        enabled). Redis session management is not HTTP and is instrumented
        via structured logging only.
    
    servers:
      - url: https://signal-clearance:4001
        description: Internal SETI network (mTLS enforced)
    
    tags:
      - name: auth
        description: Federated authentication flow
      - name: identity
        description: Wr4ngler record management
      - name: clearance
        description: Clearance level management and validation
      - name: federation
        description: IdP configuration and AD group mapping
      - name: session
        description: Session management
      - name: health
        description: Service health
    
    paths:
    
      # ---------------------------------------------------------------------------
      # FEDERATED AUTHENTICATION
      # ---------------------------------------------------------------------------
    
      /auth/federated:
        post:
          tags: [auth]
          summary: Complete federated login with IdP ID token
          description: |
            Called by the Gateway after exchanging an authorization code
            for tokens at the customer IdP. The Gateway presents the
            ID token here for validation and SETI JWT issuance.
    
            Signal Clearance:
            1. Validates the ID token signature against the IdP JWKS
            2. Checks token expiry, issuer, and audience claims
            3. Extracts identity and group membership claims
            4. Maps group membership to a SETI clearance level
            5. Creates or updates the Wr4ngler record
            6. Issues a SETI JWT (15-minute TTL) carrying wrangler_id
               and clearance_level
            7. Issues a Redis-backed refresh token (7-day inactivity TTL)
    
            If the identity maps to no configured clearance level: 403.
            The Wr4ngler exists in AD but has not been granted SETI access
            via group membership.
    
            If no Wr4ngler record exists for this identity, one is created
            automatically. No manual pre-registration required.
          requestBody:
            required: true
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/FederatedAuthRequest'
          responses:
            '200':
              description: Authentication successful. SETI JWT issued.
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/AuthResult'
            '401':
              description: ID token invalid, expired, or failed signature validation
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
            '403':
              description: >
                Identity authenticated but maps to no configured SETI
                clearance level. Wr4ngler is not authorized for SETI access.
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
            '503':
              description: >
                IdP JWKS endpoint unreachable — cannot validate token
                signature. Retry after IdP connectivity is restored.
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
            '500':
              description: Internal error
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
    
      /auth/refresh:
        post:
          tags: [session]
          summary: Refresh an expired SETI JWT
          description: |
            Exchanges a valid refresh token for a new SETI JWT and
            refresh token pair. Refresh tokens are single-use.
    
            On refresh, Signal Clearance re-evaluates the Wr4ngler's
            current AD group membership via the IdP userinfo endpoint
            if introspection is enabled. If group membership has changed,
            the new JWT reflects the updated clearance level. Clearance
            changes in AD propagate to SETI without requiring a full
            re-login.
    
            If introspection is not configured, the clearance level from
            the last successful federated login is carried forward.
          requestBody:
            required: true
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/RefreshRequest'
          responses:
            '200':
              description: New token pair issued
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/AuthResult'
            '401':
              description: Invalid or expired refresh token
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
            '403':
              description: >
                Wr4ngler's AD group membership no longer maps to any
                SETI clearance level. Access revoked.
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
            '500':
              description: Internal error
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
    
      /auth/logout:
        post:
          tags: [session]
          summary: Invalidate current SETI session
          description: |
            Immediately invalidates the current refresh token in Redis.
            The SETI JWT remains valid until its 15-minute TTL expires.
            Feed Wr4ngler channel subscriptions are invalidated immediately.
    
            Does not trigger IdP logout — the Wr4ngler's AD session is
            unaffected. SETI session only.
          responses:
            '200':
              description: Session invalidated
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/LogoutResult'
            '401':
              description: No active session
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
            '500':
              description: Internal error
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
    
      # ---------------------------------------------------------------------------
      # IDENTITY
      # ---------------------------------------------------------------------------
    
      /wranglers:
        get:
          tags: [identity]
          summary: List Wr4ngler records
          description: Admin clearance required.
          responses:
            '200':
              description: Wr4ngler list returned
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/WranglerList'
            '403':
              description: Insufficient clearance
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
            '500':
              description: Internal error
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
    
      /wranglers/{wrangler_id}:
        get:
          tags: [identity]
          summary: Get a Wr4ngler record
          description: |
            Admin clearance required to view other Wr4nglers.
            Wr4nglers may view their own record with any clearance level.
          parameters:
            - name: wrangler_id
              in: path
              required: true
              schema:
                type: string
          responses:
            '200':
              description: Wr4ngler record returned
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/WranglerRecord'
            '403':
              description: Insufficient clearance
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
            '404':
              description: Wr4ngler not found
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
            '500':
              description: Internal error
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
    
        delete:
          tags: [identity]
          summary: Revoke a Wr4ngler's SETI access
          description: |
            Admin clearance required. Immediately invalidates all active
            SETI sessions. Record is retained for audit. Hard deletion
            not supported.
    
            Note: Revokes SETI access only. To permanently prevent
            re-access, also remove the Wr4ngler from mapped AD groups.
          parameters:
            - name: wrangler_id
              in: path
              required: true
              schema:
                type: string
          responses:
            '200':
              description: Wr4ngler SETI access revoked
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/RevocationResult'
            '403':
              description: Insufficient clearance
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
            '404':
              description: Wr4ngler not found
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
            '500':
              description: Internal error
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
    
      # ---------------------------------------------------------------------------
      # CLEARANCE
      # ---------------------------------------------------------------------------
    
      /clearance/levels:
        get:
          tags: [clearance]
          summary: List defined clearance levels
          responses:
            '200':
              description: Clearance levels returned
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/ClearanceLevelList'
            '500':
              description: Internal error
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
    
        post:
          tags: [clearance]
          summary: Define a new clearance level
          description: Admin clearance required.
          requestBody:
            required: true
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/ClearanceLevelDefinition'
          responses:
            '201':
              description: Clearance level defined
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/ClearanceLevel'
            '400':
              description: Invalid clearance level definition
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
            '403':
              description: Insufficient clearance
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
            '409':
              description: Clearance level name already defined
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
            '500':
              description: Internal error
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
    
      /clearance/validate:
        post:
          tags: [clearance]
          summary: Validate a Wr4ngler's clearance for a specific feed request
          description: |
            Called by Feed Wr4ngler on every feed provisioning request.
            Hot path — response must be fast.
          requestBody:
            required: true
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/ClearanceValidationRequest'
          responses:
            '200':
              description: Clearance validated. Scoped token issued.
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/ClearanceValidationResult'
            '403':
              description: Insufficient clearance for requested scope
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/ClearanceDenial'
            '404':
              description: Wr4ngler not found or revoked
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
            '500':
              description: Internal error
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
    
      # ---------------------------------------------------------------------------
      # FEDERATION CONFIGURATION
      # ---------------------------------------------------------------------------
    
      /federation/config:
        get:
          tags: [federation]
          summary: Get current IdP federation configuration
          description: |
            Admin clearance required. Sensitive fields (client_secret)
            are redacted in responses.
          responses:
            '200':
              description: Federation configuration returned
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/FederationConfig'
            '403':
              description: Insufficient clearance
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
            '500':
              description: Internal error
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
    
        put:
          tags: [federation]
          summary: Update IdP federation configuration
          description: |
            Admin clearance required. Changes take effect on next
            authentication attempt. Changing the OIDC discovery endpoint
            triggers a JWKS refresh.
          requestBody:
            required: true
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/FederationConfigUpdate'
          responses:
            '200':
              description: Federation configuration updated
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/FederationConfig'
            '400':
              description: Invalid configuration
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
            '403':
              description: Insufficient clearance
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
            '500':
              description: Internal error
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
    
      /federation/groups:
        get:
          tags: [federation]
          summary: List AD group to clearance level mappings
          description: Admin clearance required.
          responses:
            '200':
              description: Group mappings returned
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/GroupMappingList'
            '403':
              description: Insufficient clearance
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
            '500':
              description: Internal error
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
    
        post:
          tags: [federation]
          summary: Add an AD group to clearance level mapping
          description: |
            Admin clearance required. A Wr4ngler in multiple mapped
            groups receives the highest clearance level among their
            groups. Takes effect on next login or refresh.
          requestBody:
            required: true
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/GroupMapping'
          responses:
            '201':
              description: Group mapping created
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/GroupMapping'
            '400':
              description: Invalid mapping
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
            '403':
              description: Insufficient clearance
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
            '409':
              description: Mapping for this AD group already exists
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
            '500':
              description: Internal error
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
    
      /federation/groups/{group_id}:
        delete:
          tags: [federation]
          summary: Remove an AD group mapping
          description: Admin clearance required.
          parameters:
            - name: group_id
              in: path
              required: true
              schema:
                type: string
              example: "xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"
          responses:
            '200':
              description: Group mapping removed
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/GroupMappingRemovalResult'
            '403':
              description: Insufficient clearance
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
            '404':
              description: Group mapping not found
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
            '500':
              description: Internal error
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
    
      /federation/jwks/refresh:
        post:
          tags: [federation]
          summary: Force a JWKS refresh from the IdP
          description: |
            Admin clearance required. Forces re-fetch of the IdP's
            JSON Web Key Set. Use after an IdP key rotation that has
            not yet propagated via the normal refresh cycle.
          responses:
            '200':
              description: JWKS refreshed successfully
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/JWKSRefreshResult'
            '403':
              description: Insufficient clearance
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
            '503':
              description: IdP JWKS endpoint unreachable
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
            '500':
              description: Internal error
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
    
      /health:
        get:
          tags: [health]
          summary: Service health check
          responses:
            '200':
              description: Service healthy
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/HealthResponse'
    
    components:
      schemas:
    
        FederatedAuthRequest:
          type: object
          required:
            - id_token
          properties:
            id_token:
              type: string
              description: >
                OIDC ID token received from the customer IdP after
                successful authorization code exchange.
            idp_config_id:
              type: string
              description: >
                IdP configuration to validate against. Required when
                multiple IdP configurations are registered. If only
                one IdP is configured this field may be omitted.
              example: "idp-primary"
            access_token:
              type: string
              description: >
                Optional. IdP access token. If provided and introspection
                is enabled, Signal Clearance fetches current group
                membership from the IdP userinfo endpoint.
    
        AuthResult:
          type: object
          required:
            - jwt
            - refresh_token
            - jwt_expires_at
            - refresh_expires_at
            - wrangler_id
            - clearance_level
            - identity_source
          properties:
            jwt:
              type: string
              description: >
                SETI JWT. 15-minute TTL. Carries wrangler_id and
                clearance_level. Downstream Jobs see only SETI
                credentials — the IdP token is never forwarded.
            refresh_token:
              type: string
            jwt_expires_at:
              type: string
              format: date-time
            refresh_expires_at:
              type: string
              format: date-time
            wrangler_id:
              type: string
              example: "wrnglr-a1b2c3d4"
            clearance_level:
              type: string
              example: "connie-wr4ngler"
            identity_source:
              type: string
              description: Which IdP configuration authenticated this Wr4ngler
              example: "idp-primary"
            clearance_source:
              type: string
              description: AD group that produced the clearance level
              example: "seti-connie-wr4nglers"
    
        RefreshRequest:
          type: object
          required:
            - refresh_token
          properties:
            refresh_token:
              type: string
    
        LogoutResult:
          type: object
          required:
            - wrangler_id
            - sessions_invalidated
            - logged_out_at
          properties:
            wrangler_id:
              type: string
            sessions_invalidated:
              type: integer
            logged_out_at:
              type: string
              format: date-time
    
        WranglerRecord:
          type: object
          required:
            - wrangler_id
            - display_name
            - ad_identity
            - clearance_level
            - wrangler_type
            - status
            - first_login_at
            - last_login_at
            - updated_at
          properties:
            wrangler_id:
              type: string
            display_name:
              type: string
              description: From IdP name claim. Updated on each login.
              example: "Michael E. Shaffer"
            ad_identity:
              type: string
              description: >
                Stable identity claim from the IdP. Typically UPN or
                object ID. Used to correlate returning Wr4nglers.
              example: "michael@customer.com"
            clearance_level:
              type: string
            clearance_source:
              type: string
              description: AD group that produced this clearance level
            wrangler_type:
              type: string
              enum:
                - connie_wrangler
                - project_wrangler
                - sec_wrangler
                - ops_wrangler
                - show_wrangler
                - admin
            status:
              type: string
              enum: [active, revoked]
            identity_source:
              type: string
            first_login_at:
              type: string
              format: date-time
            last_login_at:
              type: string
              format: date-time
            updated_at:
              type: string
              format: date-time
    
        WranglerList:
          type: object
          required:
            - wranglers
            - total
          properties:
            wranglers:
              type: array
              items:
                $ref: '#/components/schemas/WranglerRecord'
            total:
              type: integer
    
        RevocationResult:
          type: object
          required:
            - wrangler_id
            - sessions_invalidated
            - feed_subscriptions_closed
            - revoked_at
            - note
          properties:
            wrangler_id:
              type: string
            sessions_invalidated:
              type: integer
            feed_subscriptions_closed:
              type: integer
            revoked_at:
              type: string
              format: date-time
            note:
              type: string
              example: >
                SETI access revoked. Wr4ngler will regain access on next
                login if AD group membership still maps to a SETI clearance
                level. To permanently revoke access, remove the Wr4ngler
                from all mapped AD groups.
    
        SignalScope:
          type: object
          properties:
            application_ids:
              type: array
              items:
                type: string
            test_tiers:
              type: array
              items:
                type: string
                enum: [contract, plot, both, "*"]
            environments:
              type: array
              items:
                type: string
                enum: [production, staging, development, "*"]
            feed_types:
              type: array
              items:
                type: string
                enum: [results, failures, trends, anomalies, cluster, "*"]
    
        ClearanceLevelDefinition:
          type: object
          required:
            - name
            - description
            - scope
          properties:
            name:
              type: string
              example: "connie-wr4ngler"
            description:
              type: string
            scope:
              $ref: '#/components/schemas/SignalScope'
    
        ClearanceLevel:
          type: object
          required:
            - name
            - description
            - scope
            - created_at
            - updated_at
          properties:
            name:
              type: string
            description:
              type: string
            scope:
              $ref: '#/components/schemas/SignalScope'
            created_at:
              type: string
              format: date-time
            updated_at:
              type: string
              format: date-time
    
        ClearanceLevelList:
          type: object
          required:
            - levels
            - total
          properties:
            levels:
              type: array
              items:
                $ref: '#/components/schemas/ClearanceLevel'
            total:
              type: integer
    
        ClearanceValidationRequest:
          type: object
          required:
            - wrangler_id
            - requested_scope
          properties:
            wrangler_id:
              type: string
            requested_scope:
              $ref: '#/components/schemas/SignalScope'
    
        ClearanceValidationResult:
          type: object
          required:
            - wrangler_id
            - clearance_token
            - granted_scope
            - token_expires_at
          properties:
            wrangler_id:
              type: string
            clearance_token:
              type: string
              description: Short-lived token for Feed Wr4ngler channel provisioning. 5-minute TTL.
            granted_scope:
              $ref: '#/components/schemas/SignalScope'
            token_expires_at:
              type: string
              format: date-time
    
        ClearanceDenial:
          type: object
          required:
            - wrangler_id
            - wrangler_clearance_level
            - requested_scope
            - denied_dimensions
          properties:
            wrangler_id:
              type: string
            wrangler_clearance_level:
              type: string
            requested_scope:
              $ref: '#/components/schemas/SignalScope'
            denied_dimensions:
              type: array
              items:
                type: string
              example: ["feed_types: anomalies requires elevated clearance"]
    
        FederationConfig:
          type: object
          required:
            - config_id
            - display_name
            - oidc_discovery_url
            - client_id
            - audience
            - groups_claim
            - jwks_last_refreshed_at
            - introspection_enabled
          properties:
            config_id:
              type: string
              example: "idp-primary"
            display_name:
              type: string
              example: "Contoso Azure Entra ID"
            oidc_discovery_url:
              type: string
              example: "https://login.microsoftonline.com/{tenant-id}/v2.0/.well-known/openid-configuration"
            client_id:
              type: string
              example: "xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"
            client_secret:
              type: string
              description: Always redacted in responses
              example: "[REDACTED]"
            audience:
              type: string
              example: "api://seti"
            groups_claim:
              type: string
              description: ID token claim containing group membership
              example: "groups"
            name_claim:
              type: string
              description: ID token claim for Wr4ngler display name
              example: "name"
            identity_claim:
              type: string
              description: Stable ID token claim for Wr4ngler identification
              example: "oid"
            introspection_enabled:
              type: boolean
              description: Whether group membership is re-checked on token refresh
            jwks_last_refreshed_at:
              type: string
              format: date-time
            jwks_refresh_interval_minutes:
              type: integer
              example: 60
    
        FederationConfigUpdate:
          type: object
          properties:
            display_name:
              type: string
            oidc_discovery_url:
              type: string
            client_id:
              type: string
            client_secret:
              type: string
              description: Include only when rotating. Omit to leave unchanged.
            audience:
              type: string
            groups_claim:
              type: string
            name_claim:
              type: string
            identity_claim:
              type: string
            introspection_enabled:
              type: boolean
            jwks_refresh_interval_minutes:
              type: integer
              minimum: 15
              maximum: 1440
    
        GroupMapping:
          type: object
          required:
            - group_id
            - group_display_name
            - clearance_level
          properties:
            group_id:
              type: string
              description: >
                AD group identifier as it appears in the ID token groups
                claim. For Azure Entra ID this is the group object ID.
              example: "xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"
            group_display_name:
              type: string
              example: "SETI-Connie-Wranglers"
            clearance_level:
              type: string
              example: "connie-wr4ngler"
            created_at:
              type: string
              format: date-time
            updated_at:
              type: string
              format: date-time
    
        GroupMappingList:
          type: object
          required:
            - mappings
            - total
          properties:
            mappings:
              type: array
              items:
                $ref: '#/components/schemas/GroupMapping'
            total:
              type: integer
    
        GroupMappingRemovalResult:
          type: object
          required:
            - group_id
            - clearance_level_was
            - affected_wranglers
            - removed_at
          properties:
            group_id:
              type: string
            clearance_level_was:
              type: string
            affected_wranglers:
              type: integer
              description: >
                Wr4nglers whose only mapped group was this one.
                They will lose SETI access on next login or refresh.
            removed_at:
              type: string
              format: date-time
    
        JWKSRefreshResult:
          type: object
          required:
            - config_id
            - keys_loaded
            - refreshed_at
          properties:
            config_id:
              type: string
            keys_loaded:
              type: integer
            refreshed_at:
              type: string
              format: date-time
    
        HealthResponse:
          type: object
          required:
            - status
            - idp_configs
            - wranglers_active
            - wranglers_revoked
            - active_sessions
            - clearance_levels_defined
            - group_mappings
            - uptime_seconds
          properties:
            status:
              type: string
              enum: [healthy, degraded]
              description: >
                degraded when Redis or any IdP JWKS endpoint is unreachable.
            idp_configs:
              type: array
              items:
                type: object
                required:
                  - config_id
                  - display_name
                  - jwks_reachable
                  - last_successful_auth
                properties:
                  config_id:
                    type: string
                  display_name:
                    type: string
                  jwks_reachable:
                    type: boolean
                  last_successful_auth:
                    type: string
                    format: date-time
            wranglers_active:
              type: integer
            wranglers_revoked:
              type: integer
            active_sessions:
              type: integer
            clearance_levels_defined:
              type: integer
            group_mappings:
              type: integer
            uptime_seconds:
              type: integer
    
        Error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
              example: "NO_CLEARANCE_MAPPING"
            message:
              type: string
              example: "Authenticated identity maps to no configured SETI clearance level"
  ui.yaml: |
    openapi: 3.1.0
    
    info:
      title: SETI - UI Job
      description: |
        Serves the SETI monitoring dashboard. A functional, no-frills
        single-page application that gives Wr4nglers real-time visibility
        into constellation health, test results, and the SETI observability
        event stream.
    
        Design philosophy: correct and fast over pretty. The dashboard
        exists to surface signal clearly — not to impress. Wr4nglers
        using this are looking for problems. Everything in the UI serves
        that purpose or it does not belong.
    
        The UI Job serves static assets and a thin API proxy layer. It
        does not contain business logic. All data comes from the Gateway's
        authenticated endpoints. The UI authenticates via the federated
        AD login flow — it redirects to the customer IdP and handles
        the OIDC callback, then stores the SETI JWT for subsequent
        Gateway calls.
    
        INITIAL SCOPE:
        - Landing page: live SETI observability event stream (seti:events)
        - Application health summary: Contract Test pass rates per application
        - Recent failures panel: last N contract and plot test failures
        - Wr4ngler identity display: who is logged in, clearance level
    
        The observability feed is the centerpiece. Wr4nglers land on a
        live view of what SETI is seeing across all applications they
        are cleared to observe. The feed auto-connects on login using
        the Wr4ngler's clearance-appropriate scope.
    
        TypeScript/React. Served by a lightweight Go static file server
        with OIDC callback handling. The Go layer handles the auth
        redirect and callback — the React layer handles everything
        after the SETI JWT is issued.
    
        Externally exposed via the Gateway on port 4000. The UI is the
        only Job whose assets cross the external boundary to a browser.
      version: 0.1.0
    
    x-tca-security:
      external-transport: tls
      internal-transport: mtls
      notes: >
        The UI Job has a split security posture identical to the Gateway.
        External (browser-facing): standard TLS. Serves static assets and
        handles the OIDC redirect/callback. No JWT required for the login
        flow or static asset delivery.
        Internal (service-to-service): UI Job acts as mTLS client when
        calling Gateway API endpoints from its server-side proxy layer.
        The browser never calls internal Jobs directly — all API calls
        go through the Gateway.
      internal-client:
        load-ca-cert: /certs/ca.crt
        load-service-cert: /certs/ui.crt
        load-service-key: /certs/ui.key
        verify-server-cert: true
    
    x-tca-observability:
      report-outbound-calls: true
      endpoint: https://seti-observability:4011/event
      pattern: fire-and-forget
      caller-name: "ui"
      required-fields:
        - caller
        - callee
        - method
        - path
        - status_code
        - latency_ms
        - protocol
      implementation:
        timing: wrap-every-outbound-http-call
        non-blocking: true
        on-failure: log-and-drop
        do-not-instrument:
          - seti-observability
      notes: >
        Report outbound HTTP calls from the UI Job's server-side layer —
        specifically the OIDC token exchange call to the IdP and any
        server-side Gateway proxy calls. Browser-to-Gateway calls are
        not reported here — the Gateway reports those from its own
        observability instrumentation.
    
    servers:
      - url: https://seti.cluster.internal
        description: UI served via Gateway external port (TLS)
    
    tags:
      - name: auth
        description: OIDC authentication redirect and callback
      - name: assets
        description: Static asset delivery
      - name: health
        description: Service health
    
    paths:
    
      /login:
        get:
          tags: [auth]
          summary: Initiate federated login
          description: |
            Entry point for Wr4ngler authentication. Redirects the
            browser to the customer IdP's OIDC authorization endpoint.
            No JWT required — this is the unauthenticated entry point.
    
            Generates a state parameter and PKCE code challenge, stores
            them in a short-lived server-side session, and redirects.
            The state parameter prevents CSRF on the callback.
          responses:
            '302':
              description: Redirect to customer IdP authorization endpoint
              headers:
                Location:
                  schema:
                    type: string
                  description: IdP authorization URL with OIDC parameters
            '503':
              description: IdP configuration not available
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
            '500':
              description: Internal error
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
    
      /auth/callback:
        get:
          tags: [auth]
          summary: Handle OIDC authorization callback
          description: |
            Receives the authorization code from the customer IdP after
            successful authentication. The UI Job:
            1. Validates the state parameter against the stored value
            2. Exchanges the authorization code for tokens at the IdP
            3. Presents the ID token to Signal Clearance via the Gateway
            4. Receives the SETI JWT and refresh token
            5. Stores the refresh token in an httpOnly cookie
            6. Redirects the browser to the dashboard with the JWT
    
            On any failure, redirects to /login with an error indicator.
          parameters:
            - name: code
              in: query
              required: true
              schema:
                type: string
              description: Authorization code from the IdP
            - name: state
              in: query
              required: true
              schema:
                type: string
              description: State parameter for CSRF validation
            - name: error
              in: query
              required: false
              schema:
                type: string
              description: Error code if the IdP denied the request
            - name: error_description
              in: query
              required: false
              schema:
                type: string
          responses:
            '302':
              description: >
                Redirect to dashboard on success, or to /login with
                error indicator on failure.
              headers:
                Location:
                  schema:
                    type: string
                Set-Cookie:
                  schema:
                    type: string
                  description: >
                    httpOnly refresh token cookie on success.
                    Secure, SameSite=Strict.
            '500':
              description: Internal error during token exchange
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
    
      /:
        get:
          tags: [assets]
          summary: Serve the dashboard SPA
          description: |
            Serves the React SPA entry point. JWT required in Authorization
            header or httpOnly cookie. If no valid JWT is present, redirects
            to /login.
    
            The SPA handles all routing client-side after initial load.
            All /app/* paths serve the same index.html — React Router
            handles the rest.
          responses:
            '200':
              description: Dashboard HTML returned
              content:
                text/html:
                  schema:
                    type: string
            '302':
              description: Redirect to /login — no valid JWT present
              headers:
                Location:
                  schema:
                    type: string
                  example: "/login"
            '500':
              description: Internal error
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
    
      /assets/{path}:
        get:
          tags: [assets]
          summary: Serve static assets
          description: |
            Serves compiled React assets — JavaScript bundles, CSS,
            fonts, and icons. No authentication required for static assets.
            Cache headers set for long-term caching with content-hash
            filenames.
          parameters:
            - name: path
              in: path
              required: true
              schema:
                type: string
          responses:
            '200':
              description: Asset returned
            '404':
              description: Asset not found
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
    
      /health:
        get:
          tags: [health]
          summary: UI Job health check
          description: No authentication required.
          responses:
            '200':
              description: Service healthy
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/HealthResponse'
    
    components:
      schemas:
    
        HealthResponse:
          type: object
          required:
            - status
            - gateway_reachable
            - idp_configured
            - uptime_seconds
          properties:
            status:
              type: string
              enum: [healthy, degraded]
              description: >
                degraded when Gateway is unreachable or IdP
                configuration is missing.
            gateway_reachable:
              type: boolean
            idp_configured:
              type: boolean
              description: Whether OIDC configuration is present and valid
            uptime_seconds:
              type: integer
    
        Error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
              example: "IDP_UNAVAILABLE"
            message:
              type: string
              example: "Customer IdP is not reachable — login unavailable"
