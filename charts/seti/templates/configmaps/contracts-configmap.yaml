  interactions.yaml: |
    openapi: 3.1.0
    
    info:
      title: SETI - Interactions Job (Stub)
      description: |
        Receives structured failure escalations from Contract Test Job and
        Plot Test Job when policy requires action beyond logging. Routes
        escalations to the appropriate response channel based on the
        policy action specified in the escalation request.
    
        STUB STATUS: Alert delivery via notification channels is
        implemented. Human-in-the-loop and AI diagnostic paths via
        AI-lien are stubbed — the interfaces are defined and correct,
        the implementations are deferred.
    
        Stub behavior:
        - alert: IMPLEMENTED — delivers to configured notification channels
        - rollback: STUB — logs "STUB: would trigger rollback for
          {application_id} Job {job_name} in {environment}"
        - ai_diagnostic: STUB — logs "STUB: would call AI-lien for
          diagnostic analysis of {failure_type} in {application_id}"
        - human_escalation: STUB — logs "STUB: would page on-call for
          {application_id} with severity {severity}"
    
        When stubs are replaced, no caller changes. The escalation request
        shape and the acknowledgment response shape are locked. Internal
        routing logic is the only thing that changes.
    
        The Interactions Job also handles Connie Wr4ngler notifications
        when Plots are flagged for regeneration. This is a distinct
        concern from failure escalation — it is an advisory notification,
        not a failure response.
    
        Internal service — mTLS only, not externally exposed.
      version: 0.1.0
    
    x-tca-security:
      transport: mtls
      tls-min-version: "1.3"
      client-cert-required: true
      reject-without-client-cert: true
      ca-cert: /certs/ca.crt
      service-cert: /certs/interactions.crt
      service-key: /certs/interactions.key
      implementation:
        server:
          load-ca-cert: true
          load-service-cert: true
          load-service-key: true
          require-and-verify-client-cert: true
        client:
          load-ca-cert: true
          load-service-cert: true
          load-service-key: true
          verify-server-cert: true
      notes: >
        Every inbound connection must present a certificate signed by the
        SETI CA. Connections without a valid client certificate must be
        rejected. Authorized callers: Contract Test Job, Plot Test Job,
        Plot Store Job (regeneration notifications), Policy Job
        (configuration reads).
    
    x-tca-observability:
      report-outbound-calls: true
      endpoint: https://seti-observability:4011/event
      pattern: fire-and-forget
      caller-name: "interactions"
      required-fields:
        - caller
        - callee
        - method
        - path
        - status_code
        - latency_ms
        - protocol
      implementation:
        timing: wrap-every-outbound-http-call
        non-blocking: true
        on-failure: log-and-drop
        do-not-instrument:
          - seti-observability
      notes: >
        Report all outbound HTTP calls. Interactions Job outbound calls
        include notification channel webhooks (implemented), AI-lien
        diagnostic calls (stubbed), and external on-call platform APIs
        (stubbed). All must be reported when implemented.
    
    servers:
      - url: https://interactions:4009
        description: Internal SETI network (mTLS enforced)
    
    tags:
      - name: escalations
        description: Failure escalation handling
      - name: notifications
        description: Advisory notifications (regeneration, status changes)
      - name: health
        description: Service health
    
    paths:
    
      /escalate:
        post:
          tags: [escalations]
          summary: Route a test failure escalation
          description: |
            Called by Contract Test Job and Plot Test Job when a test
            run failure requires action per the policy lookup result.
    
            The policy_action field determines routing:
            - alert: notify configured channels (IMPLEMENTED)
            - rollback: trigger deployment rollback (STUB)
            - alert_and_rollback: both (alert IMPLEMENTED, rollback STUB)
            - escalate: AI diagnostic or human escalation (STUB)
    
            Always returns 202 — escalation is accepted and processed
            asynchronously. Callers do not wait for delivery confirmation.
            The test run result is already stored in Results Job before
            this call is made.
          requestBody:
            required: true
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/EscalationRequest'
                example:
                  application_id: "app-tca-vox-prod"
                  environment: "production"
                  test_tier: "contract"
                  run_id: "run-a1b2c3d4"
                  policy_action: "alert"
                  severity: "high"
                  failure_summary:
                    total_failures: 2
                    failing_jobs: ["vote-handler", "poll-builder"]
                    first_failure_at: "2026-03-27T14:00:06Z"
                  notification_channels: ["slack-ops"]
          responses:
            '202':
              description: Escalation accepted for processing
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/EscalationAcknowledgment'
            '400':
              description: Invalid escalation request
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
            '500':
              description: Internal error
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
    
      /notify/regeneration:
        post:
          tags: [notifications]
          summary: Notify Connie Wr4ngler that Plots need regeneration
          description: |
            Called by Plot Store Job when Plots are flagged for regeneration
            after a contract version change. Sends an advisory notification
            to the Connie Wr4ngler registered as owner of the affected
            application.
    
            Advisory only — does not trigger any automated action. The
            Connie Wr4ngler decides when to regenerate the Plots.
    
            IMPLEMENTED — notification delivery to configured channels.
          requestBody:
            required: true
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/RegenerationNotificationRequest'
          responses:
            '202':
              description: Notification accepted for delivery
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/NotificationAcknowledgment'
            '400':
              description: Invalid notification request
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
            '500':
              description: Internal error
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
    
      /health:
        get:
          tags: [health]
          summary: Service health check
          responses:
            '200':
              description: Service healthy
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/HealthResponse'
    
    components:
      schemas:
    
        EscalationRequest:
          type: object
          required:
            - application_id
            - environment
            - test_tier
            - run_id
            - policy_action
            - severity
            - failure_summary
          properties:
            application_id:
              type: string
            environment:
              type: string
              enum: [production, staging, development]
            test_tier:
              type: string
              enum: [contract, plot]
            run_id:
              type: string
              description: Run ID from Results Job for full failure detail retrieval
            policy_action:
              type: string
              enum: [alert, rollback, alert_and_rollback, escalate]
            severity:
              type: string
              enum: [critical, high, medium, low]
            failure_summary:
              type: object
              required:
                - total_failures
                - failing_jobs
                - first_failure_at
              properties:
                total_failures:
                  type: integer
                failing_jobs:
                  type: array
                  items:
                    type: string
                first_failure_at:
                  type: string
                  format: date-time
                consecutive_failure_count:
                  type: integer
                  description: How many consecutive runs have failed
            notification_channels:
              type: array
              items:
                type: string
              description: >
                Channel identifiers from the policy rule. Required when
                policy_action includes alert.
              example: ["slack-ops", "pagerduty-critical"]
            rollback_target:
              type: object
              description: >
                Present when policy_action includes rollback (STUB).
                Deployment target information for rollback execution.
              properties:
                job_name:
                  type: string
                current_version:
                  type: string
                rollback_to_version:
                  type: string
    
        EscalationAcknowledgment:
          type: object
          required:
            - escalation_id
            - policy_action
            - stub_actions
            - accepted_at
          properties:
            escalation_id:
              type: string
              description: Unique identifier for this escalation event
              example: "esc-a1b2c3d4"
            policy_action:
              type: string
            stub_actions:
              type: array
              items:
                type: string
              description: >
                Actions that were stubbed rather than executed.
                Empty when all actions in the policy_action are implemented.
              example: ["rollback — STUB: would trigger rollback for app-tca-vox-prod"]
            accepted_at:
              type: string
              format: date-time
    
        RegenerationNotificationRequest:
          type: object
          required:
            - application_id
            - plots_flagged
            - contract_changes
          properties:
            application_id:
              type: string
            plots_flagged:
              type: integer
              description: Number of Plots flagged for regeneration
            contract_changes:
              type: array
              items:
                type: object
                required:
                  - job_name
                  - previous_version
                  - new_version
                properties:
                  job_name:
                    type: string
                  previous_version:
                    type: string
                  new_version:
                    type: string
              description: Contract version changes that triggered the flags
            notification_channels:
              type: array
              items:
                type: string
              description: >
                Channels to notify. Defaults to application's configured
                Connie Wr4ngler notification channels if omitted.
    
        NotificationAcknowledgment:
          type: object
          required:
            - notification_id
            - accepted_at
          properties:
            notification_id:
              type: string
            accepted_at:
              type: string
              format: date-time
    
        HealthResponse:
          type: object
          required:
            - status
            - escalations_processed
            - alerts_delivered
            - stub_actions_logged
            - notifications_delivered
            - uptime_seconds
          properties:
            status:
              type: string
              enum: [healthy, degraded]
            escalations_processed:
              type: integer
            alerts_delivered:
              type: integer
            stub_actions_logged:
              type: integer
              description: >
                Count of stub action log entries. Non-zero is expected
                until stubs are replaced. Useful for confirming stubs
                are being triggered correctly during development.
            notifications_delivered:
              type: integer
              description: Regeneration and advisory notifications delivered
            uptime_seconds:
              type: integer
    
        Error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
              example: "INVALID_ESCALATION"
            message:
              type: string
              example: "policy_action 'rollback' requires rollback_target to be present"
  lore.yaml: |
    openapi: 3.1.0
    
    info:
      title: SETI - Lore Job
      description: |
        SETI's institutional memory. Lore is the persistent tier of SETI's
        three-tier event storage model.
    
        The three tiers:
        - Tier 1 (Redis, run-scoped): Transient capture values used for
          step-to-step value passing within a Plot run. TTL tied to run
          lifetime. Lore has no involvement here.
        - Tier 2 (Redis, sliding window): The "bad-whiff buffer" — events
          that passed all tests but carry a smell. 24-hour rolling FIFO.
          AI-lien reasons against this layer and promotes to Lore when
          connective tissue emerges. Lore has no involvement here either
          — it only receives what is deliberately promoted.
        - Tier 3 (Lore, persistent): What Lore owns. Trend points elevated
          from the bad-whiff buffer or written directly by AI-lien or Results.
          Baseline profiles. Incident records with AI assessment and resolution.
          Wr4ngler corrections. Learned patterns.
    
        Lore does not reason. It remembers. All analytical decisions are made
        by AI-lien. Lore provides the institutional context that makes those
        decisions non-amnesiac.
    
        Write paths (two active, one stubbed):
        - AI-lien: primary write path. Writes trend points, incident records,
          assessments, and corrections after reasoning. May or may not have
          bad-whiff buffer input.
        - Results: direct fast path for severe/unambiguous events that warrant
          immediate Lore entry and human escalation simultaneously. No AI
          reasoning step required — the signal is self-evident.
        - Wr4ngler: stubbed. Human-initiated entries and corrections. Endpoint
          defined, returns 501 until implemented.
    
        Read paths:
        - AI-lien: reads baselines and prior incident history before every
          analysis. This is the primary read path — Lore is AI-lien's memory.
        - Plot-test: reads baselines to contextualize assertion failures.
        - Integration: read-only access for external tooling queries.
        - Gateway: proxies Wr4ngler read/write operations (stubbed).
    
        Go implementation. PostgreSQL backend. Standard library plus pgx driver
        (pure Go, no C extensions) — chosen specifically to minimize supply chain
        surface. SETI requires a pristine security posture; every third-party
        dependency is evaluated against that requirement.
    
        Internal service — mTLS only, not externally exposed.
      version: 0.1.0
    
    x-tca-security:
      transport: mtls
      tls-min-version: "1.3"
      client-cert-required: true
      reject-without-client-cert: true
      ca-cert: /certs/ca.crt
      service-cert: /certs/lore.crt
      service-key: /certs/lore.key
      implementation:
        server:
          load-ca-cert: true
          load-service-cert: true
          load-service-key: true
          require-and-verify-client-cert: true
        client:
          load-ca-cert: true
          load-service-cert: true
          load-service-key: true
          verify-server-cert: true
      notes: >
        Every inbound connection must present a certificate signed by the SETI CA.
        Connections without a valid client certificate must be rejected.
        Authorized callers: AI-lien (read/write), Results (write — fast path only),
        Plot-test (read — baselines only), Integration (read — trend points and
        patterns only), Gateway (proxies Wr4ngler operations, stubbed).
    
    x-tca-observability:
      report-outbound-calls: true
      endpoint: https://seti-observability:4011/event
      pattern: fire-and-forget
      caller-name: "lore"
      required-fields:
        - caller
        - callee
        - method
        - path
        - status_code
        - latency_ms
        - protocol
      implementation:
        timing: wrap-every-outbound-http-call
        non-blocking: true
        on-failure: log-and-drop
        do-not-instrument:
          - seti-observability
      notes: >
        Lore's outbound calls are primarily to its PostgreSQL database.
        All inbound calls from authorized callers are visible in the
        observability feed as normal inter-service traffic.
    
    servers:
      - url: https://lore:4110
        description: Internal SETI network (mTLS enforced)
    
    tags:
      - name: trend-points
        description: Promoted events and AI-identified patterns worth watching
      - name: baselines
        description: Normal behavior profiles per Job per application
      - name: incidents
        description: Confirmed incident records with AI assessment and resolution
      - name: patterns
        description: Learned recurring sequences assigned meaning
      - name: corrections
        description: Wr4ngler overrides and corrections to AI assessments
      - name: health
        description: Service health
    
    paths:
    
      # ---------------------------------------------------------------------------
      # TREND POINTS
      # ---------------------------------------------------------------------------
    
      /trend-points:
        post:
          tags: [trend-points]
          summary: Write a trend point to persistent storage
          description: |
            Records a promoted event or AI-identified data point worth
            watching over time. Called by AI-lien after reasoning identifies
            connective tissue, or by Results on the direct fast path for
            self-evident signals.
    
            source_job indicates who wrote this entry — ai-lien, results,
            or wr4ngler (the last currently stubbed). This field is
            authoritative for audit purposes and must not be set by the
            caller to a value other than their own identity.
          requestBody:
            required: true
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/TrendPointWrite'
          responses:
            '201':
              description: Trend point stored
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/TrendPoint'
            '400':
              description: Invalid payload
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
            '500':
              description: Internal error
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
    
        get:
          tags: [trend-points]
          summary: Query trend points
          description: |
            Returns trend points matching the specified filters, in reverse
            chronological order. Used by AI-lien when loading context before
            analysis, and by Integration for external tooling queries.
          parameters:
            - name: application_id
              in: query
              required: false
              schema:
                type: string
              description: Filter by application
            - name: job_name
              in: query
              required: false
              schema:
                type: string
              description: Filter by Job name within the application
            - name: source_job
              in: query
              required: false
              schema:
                type: string
                enum: [ai-lien, results, wr4ngler]
              description: Filter by who wrote the trend point
            - name: since
              in: query
              required: false
              schema:
                type: string
                format: date-time
              description: Return only trend points recorded after this time
            - name: limit
              in: query
              required: false
              schema:
                type: integer
                minimum: 1
                maximum: 500
                default: 100
          responses:
            '200':
              description: Trend points returned
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/TrendPointList'
            '500':
              description: Internal error
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
    
      /trend-points/{trend_point_id}:
        get:
          tags: [trend-points]
          summary: Get a specific trend point
          parameters:
            - name: trend_point_id
              in: path
              required: true
              schema:
                type: string
          responses:
            '200':
              description: Trend point found
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/TrendPoint'
            '404':
              description: Trend point not found
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
    
      # ---------------------------------------------------------------------------
      # BASELINES
      # ---------------------------------------------------------------------------
    
      /baselines/{application_id}/{job_name}:
        get:
          tags: [baselines]
          summary: Get the baseline profile for a Job
          description: |
            Returns the current baseline profile for the specified Job within
            the specified application. AI-lien reads this before every analysis
            to establish what normal looks like. Plot-test reads this to
            contextualize assertion failures.
    
            Returns 404 if no baseline exists yet — callers must handle this
            gracefully. A missing baseline means SETI has not yet established
            normal behavior for this Job, not that something is wrong.
          parameters:
            - name: application_id
              in: path
              required: true
              schema:
                type: string
            - name: job_name
              in: path
              required: true
              schema:
                type: string
          responses:
            '200':
              description: Baseline profile found
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/BaselineProfile'
            '404':
              description: No baseline established for this Job yet
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
            '500':
              description: Internal error
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
    
        put:
          tags: [baselines]
          summary: Update the baseline profile for a Job
          description: |
            Replaces the baseline profile for a Job. Called by AI-lien when
            it determines the current baseline no longer reflects normal
            behavior — typically after a verified deployment or after a
            sustained period of stable operation at new parameters.
    
            Creates the baseline if it does not exist. This is an upsert,
            not a create-only operation.
          parameters:
            - name: application_id
              in: path
              required: true
              schema:
                type: string
            - name: job_name
              in: path
              required: true
              schema:
                type: string
          requestBody:
            required: true
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/BaselineProfileWrite'
          responses:
            '200':
              description: Baseline updated
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/BaselineProfile'
            '400':
              description: Invalid baseline payload
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
            '500':
              description: Internal error
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
    
      # ---------------------------------------------------------------------------
      # INCIDENTS
      # ---------------------------------------------------------------------------
    
      /incidents:
        post:
          tags: [incidents]
          summary: Record a confirmed incident
          description: |
            Stores an incident record after AI-lien has completed its analysis.
            An incident is a failure event with attached AI assessment, recommended
            remediation, and eventual resolution. Incidents are the unit of
            institutional learning — they are what SETI knows happened, why,
            and whether its assessment was correct.
          requestBody:
            required: true
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/IncidentWrite'
          responses:
            '201':
              description: Incident recorded
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Incident'
            '400':
              description: Invalid payload
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
            '500':
              description: Internal error
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
    
        get:
          tags: [incidents]
          summary: Query incident history
          parameters:
            - name: application_id
              in: query
              required: false
              schema:
                type: string
            - name: job_name
              in: query
              required: false
              schema:
                type: string
            - name: status
              in: query
              required: false
              schema:
                type: string
                enum: [open, resolved, unacknowledged_clear]
            - name: since
              in: query
              required: false
              schema:
                type: string
                format: date-time
            - name: limit
              in: query
              required: false
              schema:
                type: integer
                minimum: 1
                maximum: 200
                default: 50
          responses:
            '200':
              description: Incidents returned
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/IncidentList'
            '500':
              description: Internal error
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
    
      /incidents/{incident_id}:
        get:
          tags: [incidents]
          summary: Get a specific incident record
          parameters:
            - name: incident_id
              in: path
              required: true
              schema:
                type: string
          responses:
            '200':
              description: Incident found
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Incident'
            '404':
              description: Incident not found
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
    
      /incidents/{incident_id}/resolve:
        post:
          tags: [incidents]
          summary: Mark an incident as resolved
          description: |
            Records the resolution of an incident. Called by AI-lien when
            it determines the condition that triggered the incident has cleared,
            or by the Results fast path when a previously failing test passes
            again. Resolution does not require human acknowledgment — it is
            condition-driven, not acknowledgment-driven.
          parameters:
            - name: incident_id
              in: path
              required: true
              schema:
                type: string
          requestBody:
            required: true
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/IncidentResolution'
          responses:
            '200':
              description: Incident resolved
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Incident'
            '404':
              description: Incident not found
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
            '409':
              description: Incident already resolved
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
    
      # ---------------------------------------------------------------------------
      # PATTERNS
      # ---------------------------------------------------------------------------
    
      /patterns:
        post:
          tags: [patterns]
          summary: Record a learned pattern
          description: |
            Stores a recurring event sequence that AI-lien has assigned meaning
            to through prior analysis. Patterns are the distilled output of
            incident history — what sequences reliably predict or accompany
            specific outcomes.
          requestBody:
            required: true
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/PatternWrite'
          responses:
            '201':
              description: Pattern recorded
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Pattern'
            '400':
              description: Invalid payload
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
            '500':
              description: Internal error
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
    
        get:
          tags: [patterns]
          summary: Query learned patterns
          parameters:
            - name: application_id
              in: query
              required: false
              schema:
                type: string
            - name: job_name
              in: query
              required: false
              schema:
                type: string
            - name: limit
              in: query
              required: false
              schema:
                type: integer
                minimum: 1
                maximum: 200
                default: 50
          responses:
            '200':
              description: Patterns returned
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/PatternList'
            '500':
              description: Internal error
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
    
      # ---------------------------------------------------------------------------
      # CORRECTIONS
      # ---------------------------------------------------------------------------
    
      /corrections:
        post:
          tags: [corrections]
          summary: Record a Wr4ngler correction to an AI assessment
          description: |
            STUB — returns 501. Endpoint defined for contract completeness.
    
            When implemented: records a human override of an AI-lien assessment.
            The correction feeds back into future AI reasoning — Lore surfaces
            it when AI-lien analyzes similar conditions. Over time, corrections
            train AI-lien's judgment on this specific constellation's behavior.
    
            Requires sec-wr4ngler clearance — enforced at Gateway.
          requestBody:
            required: true
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/CorrectionWrite'
          responses:
            '501':
              description: Not yet implemented
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
    
        get:
          tags: [corrections]
          summary: Query Wr4ngler corrections
          description: STUB — returns 501.
          responses:
            '501':
              description: Not yet implemented
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
    
      # ---------------------------------------------------------------------------
      # HEALTH
      # ---------------------------------------------------------------------------
    
      /health:
        get:
          tags: [health]
          summary: Service health check
          responses:
            '200':
              description: Service healthy
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/HealthResponse'
    
    components:
      schemas:
    
        # ---------------------------------------------------------------------------
        # TREND POINTS
        # ---------------------------------------------------------------------------
    
        TrendPointWrite:
          type: object
          required:
            - application_id
            - job_name
            - source_job
            - signal_type
            - description
            - evidence
          properties:
            application_id:
              type: string
              description: Application this trend point belongs to
              example: "seti"
            job_name:
              type: string
              description: Job within the application this trend point concerns
              example: "contract-test"
            source_job:
              type: string
              enum: [ai-lien, results, wr4ngler]
              description: >
                Which Job is writing this trend point. Callers must set this
                to their own identity — this field is auditable.
            signal_type:
              type: string
              enum: [latency_drift, failure_rate, call_chain_anomaly, assertion_drift, silence, promoted_whiff, direct_escalation]
              description: >
                latency_drift — response times moving outside baseline bounds.
                failure_rate — increasing test failure frequency.
                call_chain_anomaly — unexpected service calls appearing or expected calls missing.
                assertion_drift — response body values trending toward boundary conditions.
                silence — Job stopped appearing in expected feeds.
                promoted_whiff — elevated from the bad-whiff Redis buffer by AI reasoning.
                direct_escalation — written directly by Results on the fast path.
            description:
              type: string
              description: >
                Human-readable description of what this trend point captures
                and why it was considered significant enough to persist.
              example: >
                Contract test latency for seti-observability POST /event has
                increased from a 2ms baseline to 180ms over the last 6 runs.
                Not yet alert-threshold but the trajectory is linear and
                consistent — no noise pattern, pure drift.
            evidence:
              type: object
              description: >
                Structured evidence supporting this trend point. Shape varies
                by signal_type. AI-lien populates this from the bad-whiff buffer
                or current run context. Results populates from the failing run.
              additionalProperties: true
            bad_whiff_window_start:
              type: string
              format: date-time
              description: >
                When the bad-whiff buffer window that contributed to this
                trend point began. Present when source_job is ai-lien and
                buffer data was used. Absent for direct Results writes.
            related_incident_id:
              type: string
              description: >
                If this trend point is associated with an existing incident
                in Lore, its ID. Links trend observation to incident record.
            run_id:
              type: string
              description: >
                The test run ID that generated the data behind this trend point,
                if applicable. Used to cross-reference Results Job records.
    
        TrendPoint:
          allOf:
            - $ref: '#/components/schemas/TrendPointWrite'
            - type: object
              required:
                - trend_point_id
                - recorded_at
              properties:
                trend_point_id:
                  type: string
                  example: "lore-tp-a1b2c3d4"
                recorded_at:
                  type: string
                  format: date-time
    
        TrendPointList:
          type: object
          required:
            - trend_points
            - total
          properties:
            trend_points:
              type: array
              items:
                $ref: '#/components/schemas/TrendPoint'
            total:
              type: integer
    
        # ---------------------------------------------------------------------------
        # BASELINES
        # ---------------------------------------------------------------------------
    
        BaselineProfileWrite:
          type: object
          required:
            - established_by
            - latency_p50_ms
            - latency_p95_ms
            - latency_p99_ms
            - contract_test_pass_rate
            - sample_size
            - observation_window_hours
          properties:
            established_by:
              type: string
              enum: [ai-lien]
              description: Only AI-lien may establish baselines.
            latency_p50_ms:
              type: integer
              description: Median response latency in milliseconds across observed runs
            latency_p95_ms:
              type: integer
              description: 95th percentile response latency
            latency_p99_ms:
              type: integer
              description: 99th percentile response latency
            latency_alert_multiplier:
              type: number
              description: >
                Current reading must exceed baseline_p95 * multiplier for
                K consecutive cycles before AI-lien considers this significant.
                Default 2.0 if not set.
              example: 2.0
            contract_test_pass_rate:
              type: number
              description: >
                Observed contract test pass rate as a decimal between 0 and 1.
                1.0 means all tests passing in all observed runs.
              example: 1.0
            plot_test_pass_rate:
              type: number
              description: Observed plot test pass rate. May be absent if no plot tests yet run.
              example: 1.0
            sample_size:
              type: integer
              description: Number of test runs used to establish this baseline
              example: 48
            observation_window_hours:
              type: integer
              description: How many hours of data were used
              example: 168
            notes:
              type: string
              description: >
                AI-lien's reasoning for this baseline update, if applicable.
                Useful for understanding why the baseline shifted.
    
        BaselineProfile:
          allOf:
            - $ref: '#/components/schemas/BaselineProfileWrite'
            - type: object
              required:
                - application_id
                - job_name
                - established_at
                - updated_at
              properties:
                application_id:
                  type: string
                job_name:
                  type: string
                established_at:
                  type: string
                  format: date-time
                  description: When this baseline was first created
                updated_at:
                  type: string
                  format: date-time
                  description: When this baseline was most recently updated
    
        # ---------------------------------------------------------------------------
        # INCIDENTS
        # ---------------------------------------------------------------------------
    
        IncidentWrite:
          type: object
          required:
            - application_id
            - job_name
            - source_job
            - trigger_type
            - description
            - ai_assessment
            - ai_recommended_action
            - run_id
          properties:
            application_id:
              type: string
            job_name:
              type: string
            source_job:
              type: string
              enum: [ai-lien, results]
              description: Who is recording this incident.
            trigger_type:
              type: string
              enum: [contract_test_failure, plot_test_failure, ac_silence, ac_latency_alert, direct_escalation]
            description:
              type: string
              description: Human-readable description of what failed and the context
            ai_assessment:
              type: string
              description: >
                AI-lien's first-tap assessment: what failed, likely causes,
                suggested investigation steps. Present for ai-lien source.
                May be a summary assessment for results source.
            ai_recommended_action:
              type: string
              description: AI-lien's second-tap recommendation for remediation
            run_id:
              type: string
              description: Test run ID that triggered this incident
            related_trend_point_ids:
              type: array
              items:
                type: string
              description: Trend points in Lore that contributed to this incident's context
    
        Incident:
          allOf:
            - $ref: '#/components/schemas/IncidentWrite'
            - type: object
              required:
                - incident_id
                - status
                - recorded_at
              properties:
                incident_id:
                  type: string
                  example: "lore-inc-a1b2c3d4"
                status:
                  type: string
                  enum: [open, resolved, unacknowledged_clear]
                  description: >
                    open — condition active, no resolution recorded.
                    resolved — condition cleared, resolution recorded.
                    unacknowledged_clear — condition cleared before any
                    human acknowledgment. Flagged for post-mortem review.
                recorded_at:
                  type: string
                  format: date-time
                resolved_at:
                  type: string
                  format: date-time
                resolution_summary:
                  type: string
                  description: Present when status is resolved or unacknowledged_clear
                ai_assessment_correct:
                  type: boolean
                  description: >
                    Whether the AI assessment was correct, as determined by
                    the Wr4ngler correction (if one was filed) or inferred
                    from resolution. Absent if no correction filed and
                    correctness cannot be determined.
    
        IncidentList:
          type: object
          required:
            - incidents
            - total
            - open_count
            - resolved_count
          properties:
            incidents:
              type: array
              items:
                $ref: '#/components/schemas/Incident'
            total:
              type: integer
            open_count:
              type: integer
            resolved_count:
              type: integer
    
        IncidentResolution:
          type: object
          required:
            - resolved_by
            - resolution_summary
          properties:
            resolved_by:
              type: string
              enum: [ai-lien, results]
              description: Who is recording the resolution.
            resolution_summary:
              type: string
              description: What cleared the condition
            ai_assessment_correct:
              type: boolean
              description: >
                Whether the AI assessment proved correct. Set by AI-lien
                when it can determine this from the resolution context.
                Absent if indeterminate.
    
        # ---------------------------------------------------------------------------
        # PATTERNS
        # ---------------------------------------------------------------------------
    
        PatternWrite:
          type: object
          required:
            - application_id
            - name
            - description
            - sequence
            - observed_count
            - associated_outcome
          properties:
            application_id:
              type: string
              description: Application this pattern was observed in
            job_name:
              type: string
              description: >
                Primary Job this pattern concerns, if it can be attributed
                to one. Absent for multi-Job patterns.
            name:
              type: string
              description: Short identifier for this pattern
              example: "pre_failure_latency_spike"
            description:
              type: string
              description: >
                What this pattern is and what it predicts. Written by AI-lien
                at the time of pattern identification.
            sequence:
              type: array
              items:
                type: object
                required:
                  - signal_type
                  - description
                properties:
                  signal_type:
                    type: string
                  description:
                    type: string
                  typical_duration_minutes:
                    type: integer
              description: Ordered sequence of signals that compose this pattern
            observed_count:
              type: integer
              description: Number of times this sequence has been observed
              example: 3
            associated_outcome:
              type: string
              description: What this pattern has reliably preceded or accompanied
              example: "contract test failure on POST /event within 2 hours of pattern onset"
            source_incident_ids:
              type: array
              items:
                type: string
              description: Incident IDs whose analysis led to this pattern being identified
    
        Pattern:
          allOf:
            - $ref: '#/components/schemas/PatternWrite'
            - type: object
              required:
                - pattern_id
                - identified_at
                - updated_at
              properties:
                pattern_id:
                  type: string
                  example: "lore-pat-a1b2c3d4"
                identified_at:
                  type: string
                  format: date-time
                updated_at:
                  type: string
                  format: date-time
                last_observed_at:
                  type: string
                  format: date-time
    
        PatternList:
          type: object
          required:
            - patterns
            - total
          properties:
            patterns:
              type: array
              items:
                $ref: '#/components/schemas/Pattern'
            total:
              type: integer
    
        # ---------------------------------------------------------------------------
        # CORRECTIONS (stubbed)
        # ---------------------------------------------------------------------------
    
        CorrectionWrite:
          type: object
          required:
            - incident_id
            - wrangler_id
            - correction
          properties:
            incident_id:
              type: string
              description: The incident whose AI assessment is being corrected
            wrangler_id:
              type: string
              description: The Wr4ngler filing the correction
            correction:
              type: string
              description: What the correct assessment or action should have been
            ai_was_correct:
              type: boolean
              description: >
                Whether the AI assessment was actually correct despite appearing
                wrong. Allows a Wr4ngler to confirm an assessment rather than
                correct it — useful for audit purposes.
    
        # ---------------------------------------------------------------------------
        # HEALTH
        # ---------------------------------------------------------------------------
    
        HealthResponse:
          type: object
          required:
            - status
            - trend_points_stored
            - baselines_established
            - incidents_open
            - incidents_total
            - patterns_learned
            - uptime_seconds
          properties:
            status:
              type: string
              enum: [healthy, degraded]
              description: >
                degraded when database connectivity is impaired.
                Lore degraded means AI-lien is operating without institutional
                memory — a significant operational risk that warrants immediate
                attention.
            trend_points_stored:
              type: integer
            baselines_established:
              type: integer
            incidents_open:
              type: integer
            incidents_total:
              type: integer
            patterns_learned:
              type: integer
            uptime_seconds:
              type: integer
    
        Error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
              example: "BASELINE_NOT_FOUND"
            message:
              type: string
              example: "No baseline established for job 'contract-test' in application 'seti'"
  notifier.yaml: |
    openapi: 3.1.0
    
    info:
      title: SETI - Notifier Job
      description: |
        Wakes a human. That's it.
    
        The Notifier Job is a thin, intentionally opaque pager. It receives
        a prompt and fires a notification through whatever mechanism the
        operator has configured for their environment. SETI does not know
        and does not care whether that is PagerDuty, SMS, a Teams webhook,
        an email relay, or a physical siren in the server room.
    
        This is a PERMANENT STUB in the open source distribution. If you
        cloned this repository, you must implement this Job for your
        environment before SETI can page humans. The contract is what you
        implement against — the implementation is yours.
    
        STUB STATUS: This implementation logs the notification request and
        returns 202. It does not deliver any notification to any human.
        Replace the stub handler with your notification mechanism before
        deploying to production.
    
        Design principles:
        - The prompt is deliberately minimal. Sensitive incident details
          (topology, credentials, baselines, full Lore context) travel
          through secure internal channels, not through the notification
          payload. The human follows the alert into SETI for the full
          picture.
        - The Notifier does not diagnose, does not reason, and does not
          make decisions. It pages. AI-lien handles briefing assembly in
          parallel via Interactions.
        - Interactions is the only authorized caller. AI-lien returns
          escalation recommendations to Interactions, which calls Notifier.
          AI-lien never calls Notifier directly. This keeps the audit trail
          in one place.
        - The Notifier is fire-and-forget from the caller's perspective.
          Interactions does not wait for delivery confirmation. If the
          Notifier fails, it is an AC health event, not a call failure.
    
        Internal service — mTLS only, not externally exposed.
      version: 0.1.0
    
    x-tca-security:
      transport: mtls
      tls-min-version: "1.3"
      client-cert-required: true
      reject-without-client-cert: true
      ca-cert: /certs/ca.crt
      service-cert: /certs/notifier.crt
      service-key: /certs/notifier.key
      implementation:
        server:
          load-ca-cert: true
          load-service-cert: true
          load-service-key: true
          require-and-verify-client-cert: true
        client:
          load-ca-cert: true
          load-service-cert: true
          load-service-key: true
          verify-server-cert: true
      notes: >
        Sole authorized caller: Interactions Job. All other callers must
        be rejected. The Notifier does not accept unauthenticated requests
        under any circumstances — if it did, anyone on the internal network
        could page on-call engineers arbitrarily.
    
    x-tca-observability:
      report-outbound-calls: true
      endpoint: https://seti-observability:4011/event
      pattern: fire-and-forget
      caller-name: "notifier"
      required-fields:
        - caller
        - callee
        - method
        - path
        - status_code
        - latency_ms
        - protocol
      implementation:
        timing: wrap-every-outbound-http-call
        non-blocking: true
        on-failure: log-and-drop
        do-not-instrument:
          - seti-observability
      notes: >
        The Notifier's outbound calls are to external notification systems
        (PagerDuty, SMS gateway, webhook endpoint, etc.) — these are the
        calls that matter most to instrument. Latency spikes here mean
        humans are not being paged in a timely manner. Report every call.
    
    x-tca-stub:
      permanent: true
      reason: >
        The notification mechanism is operator-specific. No default
        implementation exists or should exist. This is not a temporary
        stub pending Phase N — it is a defined integration point that
        every operator must implement for their environment.
      implementation-guidance: |
        Replace the stub handler in /notify with a call to your
        notification system. The prompt field is all you need to send.
        Do not add logic here — keep the Notifier dumb. If you find
        yourself adding routing logic or severity thresholds to the
        Notifier, that logic belongs in Interactions instead.
      examples:
        - PagerDuty Events API v2: POST to events.pagerduty.com with
          prompt as the summary field
        - Twilio SMS: send prompt as message body to on-call number
        - Microsoft Teams: POST to incoming webhook with prompt as text
        - AWS SNS: publish prompt to configured topic ARN
        - Slack: POST to webhook URL with prompt as text field
    
    servers:
      - url: https://notifier:4300
        description: Internal SETI network (mTLS enforced)
    
    tags:
      - name: notify
        description: Human notification
      - name: health
        description: Service health
    
    paths:
    
      /notify:
        post:
          tags: [notify]
          summary: Page a human
          description: |
            Sends a notification to the on-call human using whatever
            mechanism the operator has configured.
    
            The prompt field is the complete content of the notification.
            It should be terse enough to fit an SMS or a push notification.
            Full incident context is available in SETI — the prompt is a
            signal, not a briefing.
    
            Always returns 202. Delivery confirmation is not part of this
            contract. The Notifier is responsible for retry logic and
            failure handling internally. Callers must not poll for delivery
            status.
    
            STUB: logs the notification request, returns 202, delivers
            nothing to any human. Replace the handler body.
          requestBody:
            required: true
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/NotifyRequest'
                examples:
                  critical_failure:
                    summary: Critical constellation failure
                    value:
                      prompt: "SETI: Critical failure in app-tca-vox-prod. 0/20 contract tests passing. AI briefing in progress."
                      severity: critical
                      application_id: app-tca-vox-prod
                      escalation_id: esc-1775946478584845120
                  ai_escalation:
                    summary: AI-lien recommends human involvement
                    value:
                      prompt: "SETI: Degradation detected in app-tca-vox-prod. AI assessment: recurring latency pattern, Wr4ngler review requested."
                      severity: high
                      application_id: app-tca-vox-prod
                      escalation_id: esc-1775946478584845121
          responses:
            '202':
              description: Notification accepted for delivery
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/NotifyAcknowledgment'
            '400':
              description: Invalid notification request
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
            '500':
              description: Internal error — notification mechanism failure
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
    
      /health:
        get:
          tags: [health]
          summary: Service health check
          description: |
            Returns the Notifier's operational status and delivery
            statistics. The stub_active field will be true in the open
            source distribution — this is expected and not an error.
            It becomes false only when the operator has replaced the
            stub handler with a real implementation.
          responses:
            '200':
              description: Service healthy
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/HealthResponse'
    
    components:
      schemas:
    
        NotifyRequest:
          type: object
          required:
            - prompt
            - severity
            - application_id
            - escalation_id
          properties:
            prompt:
              type: string
              description: |
                The complete notification text. Should be terse — fits
                an SMS or push notification. Full incident detail lives
                in SETI, not in this payload. This is a pager, not a
                briefing document.
              maxLength: 500
              example: "SETI: Critical failure in app-tca-vox-prod. 0/20 contract tests passing. AI briefing in progress."
            severity:
              type: string
              enum: [critical, high, medium, low]
              description: |
                Severity level for routing within the notification system.
                The operator's implementation may use this to determine
                which channel or escalation path to use. SETI treats all
                severities identically — routing decisions belong to the
                operator's notification system, not to SETI.
            application_id:
              type: string
              description: >
                The constellation application that triggered the notification.
                Included so the operator's system can route by application
                if desired.
              example: "app-tca-vox-prod"
            escalation_id:
              type: string
              description: >
                The Interactions escalation ID. Included for correlation —
                if the human contacts the team, they can reference this ID
                to pull the full context from Lore.
              example: "esc-1775946478584845120"
    
        NotifyAcknowledgment:
          type: object
          required:
            - notification_id
            - stub_active
            - accepted_at
          properties:
            notification_id:
              type: string
              description: >
                Unique identifier for this notification event. Used for
                correlation in Lore and Interactions audit trail.
              example: "notif-1775946478584845120"
            stub_active:
              type: boolean
              description: >
                True when the stub handler is in use — no human was
                actually paged. Expected to be true in the open source
                distribution. Must be false in any production deployment.
            accepted_at:
              type: string
              format: date-time
    
        HealthResponse:
          type: object
          required:
            - status
            - stub_active
            - notifications_accepted
            - notifications_delivered
            - uptime_seconds
          properties:
            status:
              type: string
              enum: [healthy, degraded]
            stub_active:
              type: boolean
              description: >
                True when no real notification mechanism is configured.
                A production deployment with stub_active: true means
                no humans will be paged under any circumstances.
            notifications_accepted:
              type: integer
              description: Total notification requests received
            notifications_delivered:
              type: integer
              description: >
                Notifications actually delivered to a human. Will always
                equal zero when stub_active is true. If this diverges
                significantly from notifications_accepted in a live
                deployment, the notification mechanism has a delivery
                problem.
            uptime_seconds:
              type: integer
    
        Error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
              example: "INVALID_REQUEST"
            message:
              type: string
              example: "prompt is required and must not exceed 500 characters"
  plot-store.yaml: |
    openapi: 3.1.0
    
    info:
      title: SETI - Plot Store Job
      description: |
        Owns the Plots database for the SETI constellation. A Plot is a
        versioned, AI-generated scenario definition describing a known valid
        flow through a TCA application — including expected inter-service
        call chains, semantic assertions, and stateful sequences.
    
        Plots are generated by the Connie Wr4ngler AI partner at Job
        completion during application build, while domain context is fully
        loaded. They represent what the application is supposed to do, not
        just what its contract surfaces accept.
    
        Plot Store is the source of truth for:
        - All Plot definitions for all registered applications
        - Plot versioning tied to contract versions
        - Plot validity status (current, needs_regeneration, deprecated)
        - The relationship between Plots and the contract versions they
          were generated against
    
        When a contract changes, Plot Store flags affected Plots as
        needs_regeneration so the Connie Wr4ngler knows which Plots
        require updated domain context before the next Plot Test run.
    
        Plot Store does not execute Plots. That is the Plot Test Job's
        responsibility. Plot Store owns the definitions. Plot Test Job
        owns the execution.
    
        Internal service — mTLS only, not externally exposed.
      version: 0.1.0
    
    x-tca-security:
      transport: mtls
      tls-min-version: "1.3"
      client-cert-required: true
      reject-without-client-cert: true
      ca-cert: /certs/ca.crt
      service-cert: /certs/plot-store.crt
      service-key: /certs/plot-store.key
      implementation:
        server:
          load-ca-cert: true
          load-service-cert: true
          load-service-key: true
          require-and-verify-client-cert: true
        client:
          load-ca-cert: true
          load-service-cert: true
          load-service-key: true
          verify-server-cert: true
      notes: >
        Every inbound connection must present a certificate signed by the SETI CA.
        Connections without a valid client certificate must be rejected — not
        downgraded to unauthenticated. Authorized callers: Plot Test Job (read),
        Gateway (read/write for Wr4ngler-submitted Plots), Policy Job (read for
        regeneration status checks).
    
    x-tca-observability:
      report-outbound-calls: true
      endpoint: https://seti-observability:4011/event
      pattern: fire-and-forget
      caller-name: "plot-store"
      required-fields:
        - caller
        - callee
        - method
        - path
        - status_code
        - latency_ms
        - protocol
      implementation:
        timing: wrap-every-outbound-http-call
        non-blocking: true
        on-failure: log-and-drop
        do-not-instrument:
          - seti-observability
      notes: >
        Plot Store's outbound calls are primarily to its own database layer.
        Report all outbound HTTP calls to the SETI Observability Job.
        Fire-and-forget — never block on observability reporting.
    
    servers:
      - url: https://plot-store:4005
        description: Internal SETI network (mTLS enforced)
    
    tags:
      - name: plots
        description: Plot definition lifecycle management
      - name: applications
        description: Application-scoped Plot queries
      - name: health
        description: Service health
    
    paths:
      /plots:
        post:
          tags: [plots]
          summary: Store a new Plot definition
          description: |
            Stores a new Plot generated by a Connie Wr4ngler AI partner.
            The Plot is tied to a specific application and contract version.
            On creation, status is set to 'current'.
    
            Plots submitted with the same application_id, job_name, and
            plot_name as an existing Plot create a new version — the prior
            version is marked 'deprecated' automatically.
          requestBody:
            required: true
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/PlotSubmission'
          responses:
            '201':
              description: Plot stored successfully
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Plot'
            '400':
              description: Invalid Plot definition
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
            '409':
              description: Plot with this name already exists at this version
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
            '500':
              description: Internal error
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
    
        get:
          tags: [plots]
          summary: List Plots with optional filters
          description: |
            Returns a list of Plot summaries. Supports filtering by
            application, status, and job name. Does not return full
            step definitions — use GET /plots/{plot_id} for full detail.
          parameters:
            - name: application_id
              in: query
              required: false
              schema:
                type: string
              description: Filter by application
              example: "app-tca-vox-prod"
            - name: status
              in: query
              required: false
              schema:
                type: string
                enum: [current, needs_regeneration, deprecated]
              description: Filter by Plot validity status
            - name: job_name
              in: query
              required: false
              schema:
                type: string
              description: Filter by originating Job name
              example: "vote-handler"
          responses:
            '200':
              description: Plot list returned
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/PlotList'
            '500':
              description: Internal error
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
    
      /plots/{plot_id}:
        get:
          tags: [plots]
          summary: Retrieve a full Plot definition
          description: |
            Returns the complete Plot definition including all steps,
            assertions, and expected call chains. Used by the Plot Test
            Job when loading Plots for execution.
          parameters:
            - name: plot_id
              in: path
              required: true
              schema:
                type: string
              example: "plot-a1b2c3d4"
          responses:
            '200':
              description: Plot found
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Plot'
            '404':
              description: Plot not found
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
            '500':
              description: Internal error
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
    
        put:
          tags: [plots]
          summary: Update a Plot definition
          description: |
            Replaces a Plot's step definitions and metadata. Used when
            a Connie Wr4ngler regenerates a Plot after a contract change.
            Updates the contract_version reference and resets status to
            'current'. Prior version is archived in the results history.
          parameters:
            - name: plot_id
              in: path
              required: true
              schema:
                type: string
          requestBody:
            required: true
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/PlotUpdate'
          responses:
            '200':
              description: Plot updated
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Plot'
            '400':
              description: Invalid update payload
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
            '404':
              description: Plot not found
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
            '500':
              description: Internal error
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
    
        delete:
          tags: [plots]
          summary: Deprecate a Plot
          description: |
            Marks a Plot as deprecated. Deprecated Plots are not executed
            by the Plot Test Job. Hard deletion is not supported — Plots
            are retained for historical reference.
          parameters:
            - name: plot_id
              in: path
              required: true
              schema:
                type: string
          responses:
            '200':
              description: Plot deprecated successfully
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/PlotStatusUpdate'
            '404':
              description: Plot not found
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
            '500':
              description: Internal error
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
    
      /plots/{plot_id}/flag:
        post:
          tags: [plots]
          summary: Flag a Plot as needing regeneration
          description: |
            Marks a Plot as needs_regeneration. Called by the Policy Job
            when it detects that a contract has changed for the application
            this Plot belongs to. Flagged Plots are still executed by the
            Plot Test Job but results are tagged as potentially stale.
            The Connie Wr4ngler is notified via the Interactions Job.
          parameters:
            - name: plot_id
              in: path
              required: true
              schema:
                type: string
          requestBody:
            required: true
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/FlagRequest'
          responses:
            '200':
              description: Plot flagged successfully
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/PlotStatusUpdate'
            '404':
              description: Plot not found
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
            '500':
              description: Internal error
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
    
      /applications/{application_id}/plots:
        get:
          tags: [applications]
          summary: Get all current Plots for an application
          description: |
            Returns all Plots with status 'current' or 'needs_regeneration'
            for the specified application. Used by the Plot Test Job when
            loading the full scenario suite for an application's test run.
            Deprecated Plots are excluded.
          parameters:
            - name: application_id
              in: path
              required: true
              schema:
                type: string
              example: "app-tca-vox-prod"
          responses:
            '200':
              description: Application Plots returned
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/ApplicationPlots'
            '404':
              description: Application not found
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
            '500':
              description: Internal error
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
    
      /ingest/{tag}:
        post:
          tags: [plots]
          summary: Ingest plots from a registered application's contract registry
          description: |
            Called by the Policy Job when an application is registered or
            re-registered. Plot Store fetches the contents of the
            contracts/plots directory from the application's registry using
            the provided credentials, then stores each Plot definition.
    
            Plots are submitted with the application tag as the application_id.
            If a Plot with the same application_id, job_name, and plot_name
            already exists, a new version is created and the prior version
            is marked deprecated.
    
            Returns a summary of plots ingested, updated, and skipped.
            A plot is skipped if its JSON is malformed or missing required fields.
    
            Internal endpoint — callable only by Policy Job via mTLS.
          parameters:
            - name: tag
              in: path
              required: true
              schema:
                type: string
              description: Application tag from remote-apps.json
          requestBody:
            required: true
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/IngestRequest'
          responses:
            '200':
              description: Ingest complete
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/IngestResult'
            '400':
              description: Invalid request
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
            '502':
              description: Could not reach registry
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
            '500':
              description: Internal error
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
    
      /health:
        get:
          tags: [health]
          summary: Service health check
          responses:
            '200':
              description: Service healthy
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/HealthResponse'
    
    components:
      schemas:
    
        PlotStep:
          type: object
          required:
            - step_number
            - description
            - call
            - expect_status
          properties:
            step_number:
              type: integer
              description: Execution order. Steps execute in ascending order.
              example: 1
            description:
              type: string
              description: Human-readable description of what this step validates
              example: "Player authenticates with valid passkey credentials"
            call:
              $ref: '#/components/schemas/PlotCall'
            expect_status:
              type: integer
              description: Expected HTTP status code
              example: 200
            capture:
              type: array
              items:
                $ref: '#/components/schemas/CaptureDefinition'
              description: >
                Values to extract from the response for use in subsequent steps.
                Uses dot-notation path into the response body.
            assertions:
              type: array
              items:
                $ref: '#/components/schemas/PlotAssertion'
              description: Semantic assertions on the response beyond schema conformance
            expect_call_chain:
              type: array
              items:
                $ref: '#/components/schemas/ExpectedCall'
              description: >
                Inter-service calls expected in the observability stream as a
                result of this step. Verified against the Signal Aggregator
                event stream after step execution.
    
        PlotCall:
          type: object
          required:
            - method
            - path
          properties:
            method:
              type: string
              enum: [GET, POST, PUT, PATCH, DELETE]
            path:
              type: string
              description: >
                Request path. May reference captured values using {capture_name}
                syntax. Example: /game/{game_id}/hit
              example: "POST /auth/login"
            headers:
              type: object
              additionalProperties:
                type: string
              description: >
                Request headers. May reference captured values using
                {capture_name} syntax.
              example:
                Authorization: "Bearer {jwt}"
            body:
              type: object
              description: >
                Request body. May reference captured values using
                {capture_name} syntax. Financial values must be strings.
    
        CaptureDefinition:
          type: object
          required:
            - name
            - path
          properties:
            name:
              type: string
              description: Name for the captured value, used in subsequent steps
              example: "jwt"
            path:
              type: string
              description: Dot-notation path into the response body
              example: "token"
    
        PlotAssertion:
          type: object
          required:
            - field
            - operator
            - value
          properties:
            field:
              type: string
              description: Dot-notation path into the response body
              example: "balance"
            operator:
              type: string
              enum: [equals, not_equals, contains, not_contains, greater_than, less_than, exists, not_exists]
            value:
              description: >
                Expected value. Type depends on operator. Financial
                comparisons use string decimal values.
              example: "100.00"
    
        ExpectedCall:
          type: object
          required:
            - caller
            - callee
          properties:
            caller:
              type: string
              description: Service name of the caller as it appears in tca:events
              example: "game-state"
            callee:
              type: string
              description: Service name of the callee
              example: "deck-service"
            method:
              type: string
              enum: [GET, POST, PUT, PATCH, DELETE]
              description: Optional — if omitted any method satisfies the expectation
            path_pattern:
              type: string
              description: Optional path pattern to match. Supports {id} wildcards.
              example: "/deal"
    
        PlotSubmission:
          type: object
          required:
            - application_id
            - job_name
            - plot_name
            - contract_version
            - description
            - steps
          properties:
            application_id:
              type: string
              description: Application this Plot belongs to
              example: "app-tca-vox-prod"
            job_name:
              type: string
              description: >
                Primary Job this Plot was generated for. A Plot may
                exercise multiple Jobs but originates from one Job's
                completion during the build.
              example: "vote-handler"
            plot_name:
              type: string
              description: >
                Descriptive name for this Plot. Unique per application
                and job_name combination.
              example: "complete_vote_submission_flow"
            contract_version:
              type: string
              description: >
                Version of the contract this Plot was generated against.
                Used to detect when Plots need regeneration after contract
                changes.
              example: "0.3.0"
            description:
              type: string
              description: >
                Human-readable description of what this Plot validates.
                Written by the Connie Wr4ngler AI partner at generation time.
              example: >
                Validates complete vote submission flow: authenticated user
                submits a valid vote for an open poll, vote is persisted,
                confirmation is returned. Verifies vote-handler calls
                redis-handler and confirms persistence acknowledgment.
            generated_by:
              type: string
              description: >
                Identifier of the AI session that generated this Plot.
                Used for audit and regeneration tracking.
              example: "claude-sonnet-4-6-session-20260327"
            steps:
              type: array
              items:
                $ref: '#/components/schemas/PlotStep'
              minItems: 1
              description: Ordered sequence of steps that compose this Plot
    
        PlotUpdate:
          type: object
          required:
            - contract_version
            - description
            - steps
            - regeneration_reason
          properties:
            contract_version:
              type: string
              description: New contract version this regenerated Plot targets
            description:
              type: string
              description: Updated description reflecting any behavioral changes
            steps:
              type: array
              items:
                $ref: '#/components/schemas/PlotStep'
              minItems: 1
            regeneration_reason:
              type: string
              description: Why this Plot was regenerated
              example: "Contract v0.4.0 added required 'voter_id' field to POST /vote"
            generated_by:
              type: string
              description: AI session identifier for this regeneration
    
        Plot:
          type: object
          required:
            - plot_id
            - application_id
            - job_name
            - plot_name
            - contract_version
            - description
            - status
            - created_at
            - updated_at
            - steps
          properties:
            plot_id:
              type: string
              example: "plot-a1b2c3d4"
            application_id:
              type: string
            job_name:
              type: string
            plot_name:
              type: string
            contract_version:
              type: string
            description:
              type: string
            status:
              type: string
              enum: [current, needs_regeneration, deprecated]
              description: >
                current — Plot is valid against its contract version.
                needs_regeneration — contract has changed, Plot may be stale.
                deprecated — Plot has been superseded or removed.
            flag_reason:
              type: string
              description: >
                Present when status is needs_regeneration. Describes what
                contract change triggered the flag.
            generated_by:
              type: string
            created_at:
              type: string
              format: date-time
            updated_at:
              type: string
              format: date-time
            steps:
              type: array
              items:
                $ref: '#/components/schemas/PlotStep'
    
        PlotSummary:
          type: object
          required:
            - plot_id
            - application_id
            - job_name
            - plot_name
            - contract_version
            - status
            - step_count
            - created_at
            - updated_at
          properties:
            plot_id:
              type: string
            application_id:
              type: string
            job_name:
              type: string
            plot_name:
              type: string
            contract_version:
              type: string
            status:
              type: string
              enum: [current, needs_regeneration, deprecated]
            step_count:
              type: integer
            flag_reason:
              type: string
            created_at:
              type: string
              format: date-time
            updated_at:
              type: string
              format: date-time
    
        PlotList:
          type: object
          required:
            - plots
            - total
          properties:
            plots:
              type: array
              items:
                $ref: '#/components/schemas/PlotSummary'
            total:
              type: integer
    
        ApplicationPlots:
          type: object
          required:
            - application_id
            - plots
            - total
            - needs_regeneration_count
          properties:
            application_id:
              type: string
            plots:
              type: array
              items:
                $ref: '#/components/schemas/Plot'
              description: Full Plot definitions, not summaries — ready for execution
            total:
              type: integer
            needs_regeneration_count:
              type: integer
              description: >
                Number of Plots flagged as needs_regeneration. Non-zero
                signals the Connie Wr4ngler that regeneration is required
                before Plot Test results are fully reliable.
    
        PlotStatusUpdate:
          type: object
          required:
            - plot_id
            - status
            - updated_at
          properties:
            plot_id:
              type: string
            status:
              type: string
              enum: [current, needs_regeneration, deprecated]
            updated_at:
              type: string
              format: date-time
    
        FlagRequest:
          type: object
          required:
            - reason
            - triggered_by
          properties:
            reason:
              type: string
              description: What contract change triggered this flag
              example: "Contract v0.4.0 changed POST /vote request schema"
            triggered_by:
              type: string
              enum: [policy-job, manual]
              description: What initiated the flag
    
        HealthResponse:
          type: object
          required:
            - status
            - plots_total
            - plots_current
            - plots_needs_regeneration
            - plots_deprecated
            - uptime_seconds
          properties:
            status:
              type: string
              enum: [healthy, degraded]
            plots_total:
              type: integer
            plots_current:
              type: integer
            plots_needs_regeneration:
              type: integer
              description: Non-zero value here is an actionable signal for Wr4nglers
            plots_deprecated:
              type: integer
            uptime_seconds:
              type: integer
    
        Error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
              example: "PLOT_NOT_FOUND"
            message:
              type: string
              example: "Plot 'plot-a1b2c3d4' not found"
    
        IngestRequest:
          type: object
          required:
            - registry_url
            - registry_type
            - registry_token
          properties:
            registry_url:
              type: string
              description: Base URL for registry access (e.g. GitHub API contents URL)
              example: "https://api.github.com/repos/Pelentan/tca-vox/contents"
            registry_type:
              type: string
              enum: [github, gitlab, generic]
              description: Registry type — determines auth header format
            registry_token:
              type: string
              description: Read-only access token for the registry
    
        IngestResult:
          type: object
          required:
            - tag
            - ingested
            - updated
            - skipped
            - ingested_at
          properties:
            tag:
              type: string
            ingested:
              type: integer
              description: New plots stored
            updated:
              type: integer
              description: Existing plots versioned (prior version deprecated)
            skipped:
              type: integer
              description: Files skipped due to malformed JSON or missing required fields
            skip_reasons:
              type: array
              items:
                type: string
              description: One entry per skipped file explaining why it was skipped
            ingested_at:
              type: string
              format: date-time
  plot-test.yaml: |
    openapi: 3.1.0
    
    info:
      title: SETI - Plot Test Job
      description: |
        Executes AI-generated Plot scenarios against registered TCA
        applications. The tier-two testing Job in the SETI constellation.
    
        Where the Contract Test Job validates that a Job's surface is
        technically correct, the Plot Test Job validates that the
        constellation navigates correctly — stateful sequences work,
        semantic assertions hold, and inter-service call chains match
        what the Connie Wr4ngler documented when building the application.
    
        A Plot Test run for an application:
        1. Loads all current and needs_regeneration Plots from Plot Store
        2. Executes each Plot's steps in sequence against the application
           gateway
        3. After each step, queries Signal Aggregator to verify the
           expected call chain occurred in the observability stream
        4. Evaluates semantic assertions on each step's response
        5. Reports per-Plot results and the overall run outcome to
           the Results Job
        6. On failure, looks up policy from the Policy Job and routes
           to the Interactions Job accordingly
    
        Plots with needs_regeneration status are executed but their results
        are tagged as potentially stale. The Connie Wr4ngler is notified
        via the Interactions Job that regeneration is needed.
    
        Plot Test runs are triggered two ways:
        - Scheduled: daily per application (configurable in Policy Job)
        - Deployment: when the Policy Job detects a deployment event
          for a registered application
    
        Plot Test runs are longer and more resource-intensive than
        Contract Test runs. They are not designed for production-frequency
        execution. Timeout is configurable per application — default
        5 minutes for the full suite.
    
        Internal service — mTLS only, not externally exposed.
      version: 0.1.0
    
    x-tca-security:
      transport: mtls
      tls-min-version: "1.3"
      client-cert-required: true
      reject-without-client-cert: true
      ca-cert: /certs/ca.crt
      service-cert: /certs/plot-test.crt
      service-key: /certs/plot-test.key
      implementation:
        server:
          load-ca-cert: true
          load-service-cert: true
          load-service-key: true
          require-and-verify-client-cert: true
        client:
          load-ca-cert: true
          load-service-cert: true
          load-service-key: true
          verify-server-cert: true
      notes: >
        Every inbound connection must present a certificate signed by the
        SETI CA. Connections without a valid client certificate must be
        rejected. Authorized callers: Gateway (manual run triggers),
        Policy Job (scheduled and deployment-triggered runs).
        Plot Test Job makes outbound calls to: Plot Store (load Plots),
        Signal Aggregator (call chain verification), Policy Job (policy
        lookup on failure), Results Job (store results), Interactions Job
        (escalation routing), and the target application's gateway
        (executing Plot steps). All outbound calls use mTLS.
    
    x-tca-observability:
      report-outbound-calls: true
      endpoint: https://seti-observability:4011/event
      pattern: fire-and-forget
      caller-name: "plot-test"
      required-fields:
        - caller
        - callee
        - method
        - path
        - status_code
        - latency_ms
        - protocol
      implementation:
        timing: wrap-every-outbound-http-call
        non-blocking: true
        on-failure: log-and-drop
        do-not-instrument:
          - seti-observability
      notes: >
        Report all outbound HTTP calls. Plot Test Job has the highest
        outbound call diversity in the constellation — it calls Plot Store,
        Signal Aggregator, Policy Job, Results Job, Interactions Job, and
        the target application gateway. All must be reported. The target
        application gateway calls are especially valuable in the
        observability stream — they show which Plots are executing and
        how the target application responds.
    
    servers:
      - url: https://plot-test:4004
        description: Internal SETI network (mTLS enforced)
    
    tags:
      - name: runs
        description: Plot test run lifecycle
      - name: health
        description: Service health
    
    paths:
    
      /run:
        post:
          tags: [runs]
          summary: Execute a Plot test run for a registered application
          description: |
            Triggers a full Plot test run for the specified application.
            Loads all current Plots from Plot Store, executes them in
            sequence, verifies call chains against Signal Aggregator,
            and reports results to the Results Job.
    
            Run is synchronous — response is returned when all Plots
            have executed or the run times out. Default timeout: 5 minutes.
    
            Individual Plot execution failures do not abort the run —
            all Plots are attempted regardless of prior failures. This
            ensures a single broken Plot does not mask other failures.
    
            On completion, if any Plots failed, the policy lookup and
            Interactions Job routing happen after all Plots have run,
            not after each individual failure. The overall run result
            is the input to the policy decision.
          requestBody:
            required: true
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/PlotRunRequest'
                example:
                  application_id: "app-tca-vox-prod"
                  environment: "production"
                  triggered_by: "scheduler"
          responses:
            '200':
              description: Run completed — results available (pass or fail)
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/PlotRunResult'
            '400':
              description: Invalid run request
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
            '404':
              description: Application not found in registry
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
            '408':
              description: Run timed out
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/PlotRunTimeoutError'
            '500':
              description: Internal error — run could not be executed
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
    
      /run/{run_id}:
        get:
          tags: [runs]
          summary: Retrieve a completed Plot test run result
          parameters:
            - name: run_id
              in: path
              required: true
              schema:
                type: string
              example: "prun-a1b2c3d4"
          responses:
            '200':
              description: Run result found
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/PlotRunResult'
            '404':
              description: Run not found
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
            '500':
              description: Internal error
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
    
      /health:
        get:
          tags: [health]
          summary: Service health check
          responses:
            '200':
              description: Service healthy
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/HealthResponse'
    
    components:
      schemas:
    
        PlotRunRequest:
          type: object
          required:
            - application_id
            - environment
            - triggered_by
          properties:
            application_id:
              type: string
              example: "app-tca-vox-prod"
            environment:
              type: string
              enum: [production, staging, development]
            triggered_by:
              type: string
              enum: [scheduler, deployment, manual, seti-self]
            plot_filter:
              type: array
              items:
                type: string
              description: >
                Optional. If provided, only execute the specified Plot IDs.
                If omitted, all current and needs_regeneration Plots run.
              example: ["plot-a1b2c3d4", "plot-b2c3d4e5"]
            timeout_override_seconds:
              type: integer
              minimum: 60
              maximum: 600
              description: >
                Override the application's configured timeout for this run.
                Use when manually triggering a run with known slow Plots.
    
        StepResult:
          type: object
          required:
            - step_number
            - description
            - status
            - duration_ms
            - call_chain_verified
          properties:
            step_number:
              type: integer
            description:
              type: string
            status:
              type: string
              enum: [passed, failed, skipped]
              description: >
                skipped when a prior step failed and subsequent steps
                depend on captured values from it.
            duration_ms:
              type: integer
            actual_status_code:
              type: integer
              description: HTTP status code received from the application
            expected_status_code:
              type: integer
            call_chain_verified:
              type: boolean
              description: >
                Whether the expected inter-service call chain was confirmed
                in the Signal Aggregator event stream for this step.
            call_chain_detail:
              $ref: '#/components/schemas/CallChainDetail'
            assertion_results:
              type: array
              items:
                $ref: '#/components/schemas/AssertionResult'
            failure_reason:
              type: string
              description: >
                Present when status is failed. Human-readable description
                of what failed and what was expected.
              example: >
                Expected field 'balance' to equal '100.00' but received '0.00'.
                Vote submission appears to have succeeded but balance was not
                updated. Possible sync gap between vote-handler and bank-service.
    
        CallChainDetail:
          type: object
          required:
            - expected_calls
            - verification_window_ms
            - verified
          properties:
            expected_calls:
              type: integer
              description: Number of calls in the expected chain for this step
            observed_calls:
              type: integer
              description: Number of expected calls found in the event stream
            verification_window_ms:
              type: integer
              description: Time window used for Signal Aggregator verification query
            verified:
              type: boolean
            missing_calls:
              type: array
              items:
                type: object
                properties:
                  caller:
                    type: string
                  callee:
                    type: string
                  path_pattern:
                    type: string
              description: Expected calls not found in the event stream
            latency_exceeded_calls:
              type: array
              items:
                type: object
                properties:
                  caller:
                    type: string
                  callee:
                    type: string
                  expected_max_ms:
                    type: integer
                  observed_ms:
                    type: integer
              description: Calls found but exceeding configured max latency
    
        AssertionResult:
          type: object
          required:
            - field
            - operator
            - passed
          properties:
            field:
              type: string
              example: "balance"
            operator:
              type: string
            expected_value:
              description: The value the assertion expected
            actual_value:
              description: The value actually present in the response
            passed:
              type: boolean
    
        PlotResult:
          type: object
          required:
            - plot_id
            - plot_name
            - status
            - stale
            - duration_ms
            - steps_total
            - steps_passed
            - steps_failed
            - steps_skipped
            - call_chains_verified
            - step_results
          properties:
            plot_id:
              type: string
            plot_name:
              type: string
            status:
              type: string
              enum: [passed, failed, error]
              description: >
                passed — all steps passed and all call chains verified.
                failed — one or more steps failed or call chain unverified.
                error — Plot could not be executed (infrastructure issue).
            stale:
              type: boolean
              description: >
                True when the Plot had needs_regeneration status at
                run time. Results are valid but may not reflect the
                current contract version.
            duration_ms:
              type: integer
            steps_total:
              type: integer
            steps_passed:
              type: integer
            steps_failed:
              type: integer
            steps_skipped:
              type: integer
            call_chains_verified:
              type: integer
              description: Number of steps where call chain verification passed
            call_chains_failed:
              type: integer
              description: Number of steps where call chain verification failed
            step_results:
              type: array
              items:
                $ref: '#/components/schemas/StepResult'
    
        PlotRunResult:
          type: object
          required:
            - run_id
            - application_id
            - environment
            - triggered_by
            - status
            - started_at
            - completed_at
            - duration_ms
            - summary
            - plot_results
          properties:
            run_id:
              type: string
              example: "prun-a1b2c3d4"
            application_id:
              type: string
            environment:
              type: string
              enum: [production, staging, development]
            triggered_by:
              type: string
              enum: [scheduler, deployment, manual, seti-self]
            status:
              type: string
              enum: [passed, failed, error, timeout]
            started_at:
              type: string
              format: date-time
            completed_at:
              type: string
              format: date-time
            duration_ms:
              type: integer
            summary:
              type: object
              required:
                - total_plots
                - passed
                - failed
                - errored
                - stale_plots_run
                - call_chains_verified
                - call_chains_failed
              properties:
                total_plots:
                  type: integer
                passed:
                  type: integer
                failed:
                  type: integer
                errored:
                  type: integer
                stale_plots_run:
                  type: integer
                  description: Plots flagged needs_regeneration that were executed
                call_chains_verified:
                  type: integer
                  description: Total step-level call chain verifications that passed
                call_chains_failed:
                  type: integer
            plot_results:
              type: array
              items:
                $ref: '#/components/schemas/PlotResult'
            policy_action:
              type: string
              enum: [none, alert, rollback, alert_and_rollback, escalate]
              description: Action taken per policy lookup. none when status is passed.
    
        PlotRunTimeoutError:
          type: object
          required:
            - run_id
            - application_id
            - timed_out_at_seconds
            - plots_completed
            - plots_pending
            - partial_results
          properties:
            run_id:
              type: string
            application_id:
              type: string
            timed_out_at_seconds:
              type: integer
            plots_completed:
              type: array
              items:
                type: string
              description: Plot IDs that completed before timeout
            plots_pending:
              type: array
              items:
                type: string
              description: Plot IDs that had not started when timeout occurred
            partial_results:
              type: array
              items:
                $ref: '#/components/schemas/PlotResult'
              description: Results for completed Plots — preserved for diagnostic use
    
        HealthResponse:
          type: object
          required:
            - status
            - runs_completed
            - runs_failed
            - runs_errored
            - plots_executed_total
            - call_chains_verified_total
            - call_chains_failed_total
            - uptime_seconds
          properties:
            status:
              type: string
              enum: [healthy, degraded]
              description: >
                degraded when Plot Store, Signal Aggregator, Results Job,
                or Policy Job are unreachable.
            runs_completed:
              type: integer
            runs_failed:
              type: integer
            runs_errored:
              type: integer
            plots_executed_total:
              type: integer
            call_chains_verified_total:
              type: integer
            call_chains_failed_total:
              type: integer
              description: >
                Growing call chain failure count without corresponding
                contract test failures may indicate observability stream
                gaps rather than application failures.
            uptime_seconds:
              type: integer
    
        Error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
              example: "APPLICATION_NOT_FOUND"
            message:
              type: string
              example: "Application 'app-tca-vox-prod' not found in registry"
  policy.yaml: |
    openapi: 3.1.0
    
    info:
      title: SETI - Policy Job
      description: |
        Owns the primary SETI database. The Policy Job is the administrative
        core of the SETI constellation — it holds the application registry,
        test schedules, failure response policies, and clearance definitions.
    
        Admin access only. Never externally exposed. The only authorized
        callers are the Gateway (for admin operations) and internal SETI
        Jobs that need to read policy during test execution.
    
        The Policy Job owns four distinct concerns:
    
        1. APPLICATION REGISTRY — the list of TCA applications SETI monitors.
           Each entry holds the repository contracts path, gateway endpoint,
           observability stream connection, and environment configuration.
    
        2. SCHEDULES — when Contract Tests and Plot Tests run per application.
           Configurable per application, per test tier, per environment.
           Default: Contract Tests every 15 minutes, Plot Tests daily plus
           on deployment trigger.
    
        3. FAILURE RESPONSE POLICY — what SETI does when a test fails.
           Keyed by application, Job name, test tier, environment, and
           severity. Drives the Interactions Job routing decisions.
    
        4. CONTRACT VERSION TRACKING — the last known contract version per
           Job per application. Used by the Contract Test Job to detect
           version changes and flag Plot Store for regeneration.
    
        Internal service — mTLS only, not externally exposed.
      version: 0.1.0
    
    x-tca-security:
      transport: mtls
      tls-min-version: "1.3"
      client-cert-required: true
      reject-without-client-cert: true
      ca-cert: /certs/ca.crt
      service-cert: /certs/policy.crt
      service-key: /certs/policy.key
      implementation:
        server:
          load-ca-cert: true
          load-service-cert: true
          load-service-key: true
          require-and-verify-client-cert: true
        client:
          load-ca-cert: true
          load-service-cert: true
          load-service-key: true
          verify-server-cert: true
      notes: >
        Every inbound connection must present a certificate signed by the SETI CA.
        Connections without a valid client certificate must be rejected.
        Authorized callers: Gateway (admin operations), Contract Test Job
        (policy lookup, contract version read/write), Plot Test Job (policy
        lookup), Plot Store Job (contract version read), Signal Clearance Job
        (clearance definition read).
    
    x-tca-observability:
      report-outbound-calls: true
      endpoint: https://seti-observability:4011/event
      pattern: fire-and-forget
      caller-name: "policy"
      required-fields:
        - caller
        - callee
        - method
        - path
        - status_code
        - latency_ms
        - protocol
      implementation:
        timing: wrap-every-outbound-http-call
        non-blocking: true
        on-failure: log-and-drop
        do-not-instrument:
          - seti-observability
      notes: >
        Report all outbound HTTP calls to the SETI Observability Job.
        Policy Job's primary outbound calls are to Plot Store (flagging
        Plots for regeneration on contract version change) and to the
        scheduler trigger endpoints on Contract Test and Plot Test Jobs.
    
    servers:
      - url: https://policy:4002
        description: Internal SETI network (mTLS enforced)
    
    tags:
      - name: applications
        description: Application registry management
      - name: schedules
        description: Test schedule configuration
      - name: policies
        description: Failure response policy management
      - name: contracts
        description: Contract version tracking
      - name: health
        description: Service health
      - name: available-applications
        description: Available application manifest from remote-apps.json
    
    paths:
    
      # ---------------------------------------------------------------------------
      # APPLICATION REGISTRY
      # ---------------------------------------------------------------------------
    
      /applications:
        post:
          tags: [applications]
          summary: Register a new application for SETI monitoring
          description: |
            Registers a TCA application in the SETI monitoring registry.
            On registration, SETI gains read access to the application's
            contracts folder and begins scheduling tests per the provided
            schedule configuration.
    
            Registration does not immediately trigger a test run. The first
            scheduled run occurs at the next schedule interval.
          requestBody:
            required: true
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/ApplicationRegistration'
          responses:
            '201':
              description: Application registered successfully
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Application'
            '400':
              description: Invalid registration payload
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
            '409':
              description: Application with this ID already registered
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
            '500':
              description: Internal error
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
    
        get:
          tags: [applications]
          summary: List all registered applications
          parameters:
            - name: environment
              in: query
              required: false
              schema:
                type: string
                enum: [production, staging, development]
            - name: status
              in: query
              required: false
              schema:
                type: string
                enum: [active, paused, error]
          responses:
            '200':
              description: Application list returned
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/ApplicationList'
            '500':
              description: Internal error
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
    
      /applications/{application_id}:
        get:
          tags: [applications]
          summary: Get a registered application
          parameters:
            - name: application_id
              in: path
              required: true
              schema:
                type: string
          responses:
            '200':
              description: Application found
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Application'
            '404':
              description: Application not found
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
            '500':
              description: Internal error
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
    
        put:
          tags: [applications]
          summary: Update application registration
          description: |
            Updates an application's registry entry. Does not affect
            existing test results or Plot definitions. Schedule changes
            take effect at the next schedule evaluation cycle.
          parameters:
            - name: application_id
              in: path
              required: true
              schema:
                type: string
          requestBody:
            required: true
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/ApplicationUpdate'
          responses:
            '200':
              description: Application updated
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Application'
            '400':
              description: Invalid update payload
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
            '404':
              description: Application not found
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
            '500':
              description: Internal error
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
    
        delete:
          tags: [applications]
          summary: Deregister an application
          description: |
            Removes an application from SETI monitoring. Historical test
            results are retained in the Results Job. Plots are marked
            deprecated in Plot Store. Schedules are cancelled.
          parameters:
            - name: application_id
              in: path
              required: true
              schema:
                type: string
          responses:
            '200':
              description: Application deregistered
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/DeregistrationResult'
            '404':
              description: Application not found
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
            '500':
              description: Internal error
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
    
      /applications/{application_id}/pause:
        post:
          tags: [applications]
          summary: Pause testing for an application
          description: |
            Suspends all scheduled test runs for an application without
            deregistering it. Use during planned maintenance windows.
            Resume with POST /applications/{application_id}/resume.
          parameters:
            - name: application_id
              in: path
              required: true
              schema:
                type: string
          requestBody:
            required: true
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/PauseRequest'
          responses:
            '200':
              description: Application testing paused
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Application'
            '404':
              description: Application not found
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
            '500':
              description: Internal error
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
    
      /applications/{application_id}/resume:
        post:
          tags: [applications]
          summary: Resume testing for a paused application
          parameters:
            - name: application_id
              in: path
              required: true
              schema:
                type: string
          responses:
            '200':
              description: Application testing resumed
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Application'
            '404':
              description: Application not found
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
            '500':
              description: Internal error
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
    
      # ---------------------------------------------------------------------------
      # SCHEDULES
      # ---------------------------------------------------------------------------
    
      /applications/{application_id}/schedule:
        get:
          tags: [schedules]
          summary: Get the test schedule for an application
          parameters:
            - name: application_id
              in: path
              required: true
              schema:
                type: string
          responses:
            '200':
              description: Schedule returned
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/TestSchedule'
            '404':
              description: Application not found
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
            '500':
              description: Internal error
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
    
        put:
          tags: [schedules]
          summary: Update the test schedule for an application
          parameters:
            - name: application_id
              in: path
              required: true
              schema:
                type: string
          requestBody:
            required: true
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/TestScheduleUpdate'
          responses:
            '200':
              description: Schedule updated
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/TestSchedule'
            '400':
              description: Invalid schedule configuration
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
            '404':
              description: Application not found
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
            '500':
              description: Internal error
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
    
      # ---------------------------------------------------------------------------
      # FAILURE RESPONSE POLICY
      # ---------------------------------------------------------------------------
    
      /applications/{application_id}/policies:
        get:
          tags: [policies]
          summary: Get all failure response policies for an application
          parameters:
            - name: application_id
              in: path
              required: true
              schema:
                type: string
          responses:
            '200':
              description: Policies returned
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/PolicyList'
            '404':
              description: Application not found
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
            '500':
              description: Internal error
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
    
        post:
          tags: [policies]
          summary: Create a failure response policy
          description: |
            Creates a policy rule governing SETI's response when a specific
            test failure condition is met. Policies are evaluated in
            specificity order — the most specific matching policy wins.
    
            Specificity order (most to least specific):
            application + job_name + test_tier + environment + severity
            application + job_name + test_tier + environment
            application + job_name + test_tier
            application + test_tier
            application (catch-all)
          parameters:
            - name: application_id
              in: path
              required: true
              schema:
                type: string
          requestBody:
            required: true
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/PolicyRule'
          responses:
            '201':
              description: Policy created
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/PolicyRule'
            '400':
              description: Invalid policy definition
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
            '404':
              description: Application not found
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
            '500':
              description: Internal error
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
    
      /applications/{application_id}/policies/lookup:
        post:
          tags: [policies]
          summary: Look up the applicable policy for a test failure
          description: |
            Returns the most specific matching policy for a given failure
            condition. Called by Contract Test Job and Plot Test Job
            immediately after a test failure to determine response action.
            This is the hot path — response must be fast.
          parameters:
            - name: application_id
              in: path
              required: true
              schema:
                type: string
          requestBody:
            required: true
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/PolicyLookupRequest'
                example:
                  job_name: "vote-handler"
                  test_tier: "contract"
                  environment: "production"
                  severity: "critical"
          responses:
            '200':
              description: Applicable policy returned
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/PolicyLookupResult'
            '404':
              description: No matching policy found — use default alert behavior
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
            '500':
              description: Internal error
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
    
      # ---------------------------------------------------------------------------
      # CONTRACT VERSION TRACKING
      # ---------------------------------------------------------------------------
    
      /applications/{application_id}/contract-versions:
        get:
          tags: [contracts]
          summary: Get last known contract versions for all Jobs in an application
          description: |
            Returns the contract version last seen by SETI for each Job
            in the application. Used by the Contract Test Job to detect
            version changes after a test failure triggers a refresh.
          parameters:
            - name: application_id
              in: path
              required: true
              schema:
                type: string
          responses:
            '200':
              description: Contract versions returned
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/ContractVersionMap'
            '404':
              description: Application not found
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
            '500':
              description: Internal error
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
    
        put:
          tags: [contracts]
          summary: Update contract versions after a refresh
          description: |
            Updates the stored contract versions for one or more Jobs after
            the Contract Test Job pulls fresh contracts from the repository.
            If a version change is detected, Policy Job notifies Plot Store
            to flag affected Plots for regeneration.
          parameters:
            - name: application_id
              in: path
              required: true
              schema:
                type: string
          requestBody:
            required: true
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/ContractVersionUpdate'
          responses:
            '200':
              description: Versions updated. Changed jobs listed in response.
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/ContractVersionUpdateResult'
            '400':
              description: Invalid payload
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
            '404':
              description: Application not found
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
            '500':
              description: Internal error
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
    
      /health:
        get:
          tags: [health]
          summary: Service health check
          responses:
            '200':
              description: Service healthy
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/HealthResponse'
    
      /ai-providers:
        get:
          summary: List configured AI providers and their discovered models
          responses:
            '200':
              description: AI provider list
              content:
