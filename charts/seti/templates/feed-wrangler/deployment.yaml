apiVersion: apps/v1
kind: Deployment
metadata:
  name: feed-wrangler
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "seti.labels" . | nindent 4 }}
    app: feed-wrangler
spec:
  replicas: 1
  selector:
    matchLabels:
      app: feed-wrangler
  template:
    metadata:
      labels:
        app: feed-wrangler
        {{- include "seti.labels" . | nindent 8 }}
    spec:
      initContainers:
        {{- include "seti.waitForCertForge" . | nindent 8 }}
        {{- include "seti.waitForAugurCanis" . | nindent 8 }}
      containers:
        - name: feed-wrangler
          image: {{ .Values.registry }}/{{ .Values.imagePrefix }}feed-wrangler:{{ .Values.feedWrangler.tag }}
          imagePullPolicy: Always
          ports:
            - containerPort: {{ .Values.feedWrangler.port }}
          env:
            - name: PORT
              value: {{ .Values.feedWrangler.port | quote }}
            - name: REDIS_URL
              value: {{ .Values.redis.url | quote }}
            - name: SERVICE_NAME
              value: "feed-wrangler"
            - name: PUBLIC_PORT
              value: {{ .Values.certForge.publicPort | quote }}
            - name: ENROLLMENT_CERT
              value: "/certs/enrollment.crt"
            - name: ENROLLMENT_KEY
              value: "/certs/enrollment.key"
            - name: ENROLLMENT_CA
              value: "/certs/enrollment-ca.crt"
            - name: CERT_FORGE_URL
              value: "https://cert-forge:{{ .Values.certForge.port }}"
            - name: ENROLLMENT_PORT
              value: {{ .Values.certForge.enrollmentPort | quote }}
            - name: AUGUR_CANIS_URL
              value: "https://augur-canis:{{ .Values.augurCanis.port }}"
            - name: HOSTNAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          volumeMounts:
            - name: seti-certs
              mountPath: /certs
              readOnly: true
          readinessProbe:
            exec:
              command: ["node", "/healthcheck.js"]
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          livenessProbe:
            exec:
              command: ["node", "/healthcheck.js"]
            initialDelaySeconds: 45
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
      volumes:
        - name: seti-certs
          secret:
            secretName: {{ .Values.certSecretName }}
---
apiVersion: v1
kind: Service
metadata:
  name: feed-wrangler
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "seti.labels" . | nindent 4 }}
    app: feed-wrangler
spec:
  selector:
    app: feed-wrangler
  ports:
    - port: {{ .Values.feedWrangler.port }}
      targetPort: {{ .Values.feedWrangler.port }}
