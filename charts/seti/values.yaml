# charts/seti/values.yaml
# Base values. Environment-specific files in values/ override these.

namespace: seti

# Image registry — override in dev with k3d local registry
registry: localhost:5000

# Image name prefix — set to "seti-" in dev to avoid registry collisions
# with other constellations. Empty string in production (dedicated registry).
imagePrefix: ""

# Secret name cert-forge writes to and all services mount
certSecretName: seti-certs

certForge:
  tag: latest
  port: 4014
  enrollmentPort: 4015
  publicPort: 4016

redis:
  tag: "7-alpine"
  url: "redis:6379"

setiObservability:
  tag: latest
  port: 4011

postgres:
  tag: "16-alpine"
  storage: 5Gi
  storageClass: ""

lore:
  tag: latest
  port: 4110

augurCanis:
  tag: latest
  port: 4010

signalClearance:
  tag: latest
  port: 4001

policy:
  tag: latest
  port: 4002

contractTest:
  tag: latest
  port: 4003

results:
  tag: latest
  port: 4008

signalAggregator:
  tag: latest
  port: 4006

plotStore:
  tag: latest
  port: 4005

plotTest:
  tag: latest
  port: 4004

interactions:
  tag: latest
  port: 4009

feedWrangler:
  tag: latest
  port: 4007

integration:
  tag: latest
  port: 4013

aiLien:
  tag: latest
  port: 4252

notifier:
  tag: latest
  port: 4300

ui:
  tag: latest
  port: 4020

gateway:
  tag: latest
  port: 4000
  externalHostname: ""

jwtSecret: ""
authMode: "dev"