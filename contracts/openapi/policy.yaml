        policy_id:
          type: string
        action:
          type: string
          enum: [alert, rollback, alert_and_rollback, escalate, none]
        notification_channels:
          type: array
          items:
            type: string
        matched_on:
          type: string
          description: >
            Describes which policy fields produced the match.
            Useful for debugging unexpected policy behavior.
          example: "application + job_name + test_tier + environment"

    ContractVersionMap:
