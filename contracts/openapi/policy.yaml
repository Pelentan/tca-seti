openapi: 3.1.0

info:
  title: SETI - Policy Job
  description: |
    Owns the primary SETI database. The Policy Job is the administrative
    core of the SETI constellation — it holds the application registry,
    test schedules, failure response policies, and clearance definitions.

    Admin access only. Never externally exposed. The only authorized
    callers are the Gateway (for admin operations) and internal SETI
    Jobs that need to read policy during test execution.

    The Policy Job owns four distinct concerns:

    1. APPLICATION REGISTRY — the list of TCA applications SETI monitors.
       Each entry holds the repository contracts path, gateway endpoint,
       observability stream connection, and environment configuration.

    2. SCHEDULES — when Contract Tests and Plot Tests run per application.
       Configurable per application, per test tier, per environment.
       Default: Contract Tests every 15 minutes, Plot Tests daily plus
       on deployment trigger.

    3. FAILURE RESPONSE POLICY — what SETI does when a test fails.
       Keyed by application, Job name, test tier, environment, and
       severity. Drives the Interactions Job routing decisions.

    4. CONTRACT VERSION TRACKING — the last known contract version per
       Job per application. Used by the Contract Test Job to detect
       version changes and flag Plot Store for regeneration.

    Internal service — mTLS only, not externally exposed.
  version: 0.1.0

x-tca-security:
  transport: mtls
  tls-min-version: "1.3"
  client-cert-required: true
  reject-without-client-cert: true
  ca-cert: /certs/ca.crt
  service-cert: /certs/policy.crt
  service-key: /certs/policy.key
  implementation:
    server:
      load-ca-cert: true
      load-service-cert: true
      load-service-key: true
      require-and-verify-client-cert: true
    client:
      load-ca-cert: true
      load-service-cert: true
      load-service-key: true
      verify-server-cert: true
  notes: >
    Every inbound connection must present a certificate signed by the SETI CA.
    Connections without a valid client certificate must be rejected.
    Authorized callers: Gateway (admin operations), Contract Test Job
    (policy lookup, contract version read/write), Plot Test Job (policy
    lookup), Plot Store Job (contract version read), Signal Clearance Job
    (clearance definition read).

x-tca-observability:
  report-outbound-calls: true
  endpoint: https://seti-observability:4011/event
  pattern: fire-and-forget
  caller-name: "policy"
  required-fields:
    - caller
    - callee
    - method
    - path
    - status_code
    - latency_ms
    - protocol
  implementation:
    timing: wrap-every-outbound-http-call
    non-blocking: true
    on-failure: log-and-drop
    do-not-instrument:
      - seti-observability
  notes: >
    Report all outbound HTTP calls to the SETI Observability Job.
    Policy Job's primary outbound calls are to Plot Store (flagging
    Plots for regeneration on contract version change) and to the
    scheduler trigger endpoints on Contract Test and Plot Test Jobs.

x-tca-lifecycle:
  shutdown:
    signal: SIGTERM
    drain-timeout-seconds: 15
    terminationGracePeriodSeconds: 20
    steps:
      - stop-accepting-connections
      - drain-in-flight-requests
      - close-redis
      - exit-0
    notes: >
      policy publishes schedule events to Redis but holds no subscriptions. In-memory application registry state is not persisted on shutdown — services re-register with AC on their next startup.

servers:
  - url: https://policy:4002
    description: Internal SETI network (mTLS enforced)

tags:
  - name: applications
    description: Application registry management
  - name: schedules
    description: Test schedule configuration
  - name: policies
    description: Failure response policy management
  - name: contracts
    description: Contract version tracking
  - name: health
    description: Service health
  - name: available-applications
    description: Available application manifest from remote-apps.json

paths:

  # ---------------------------------------------------------------------------
  # APPLICATION REGISTRY
  # ---------------------------------------------------------------------------

  /applications:
    post:
      tags: [applications]
      summary: Register a new application for SETI monitoring
      description: |
        Registers a TCA application in the SETI monitoring registry.
        On registration, SETI gains read access to the application's
        contracts folder and begins scheduling tests per the provided
        schedule configuration.

        Registration does not immediately trigger a test run. The first
        scheduled run occurs at the next schedule interval.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplicationRegistration'
      responses:
        '201':
          description: Application registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Application'
        '400':
          description: Invalid registration payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Application with this ID already registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    get:
      tags: [applications]
      summary: List all registered applications
      parameters:
        - name: environment
          in: query
          required: false
          schema:
            type: string
            enum: [production, staging, development]
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [active, paused, error]
      responses:
        '200':
          description: Application list returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationList'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /applications/{application_id}:
    get:
      tags: [applications]
      summary: Get a registered application
      parameters:
        - name: application_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Application found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Application'
        '404':
          description: Application not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    put:
      tags: [applications]
      summary: Update application registration
      description: |
        Updates an application's registry entry. Does not affect
        existing test results or Plot definitions. Schedule changes
        take effect at the next schedule evaluation cycle.
      parameters:
        - name: application_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplicationUpdate'
      responses:
        '200':
          description: Application updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Application'
        '400':
          description: Invalid update payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Application not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    delete:
      tags: [applications]
      summary: Deregister an application
      description: |
        Removes an application from SETI monitoring. Historical test
        results are retained in the Results Job. Plots are marked
        deprecated in Plot Store. Schedules are cancelled.
      parameters:
        - name: application_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Application deregistered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeregistrationResult'
        '404':
          description: Application not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /applications/{application_id}/pause:
    post:
      tags: [applications]
      summary: Pause testing for an application
      description: |
        Suspends all scheduled test runs for an application without
        deregistering it. Use during planned maintenance windows.
        Resume with POST /applications/{application_id}/resume.
      parameters:
        - name: application_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PauseRequest'
      responses:
        '200':
          description: Application testing paused
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Application'
        '404':
          description: Application not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /applications/{application_id}/resume:
    post:
      tags: [applications]
      summary: Resume testing for a paused application
      parameters:
        - name: application_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Application testing resumed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Application'
        '404':
          description: Application not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ---------------------------------------------------------------------------
  # SCHEDULES
  # ---------------------------------------------------------------------------

  /applications/{application_id}/schedule:
    get:
      tags: [schedules]
      summary: Get the test schedule for an application
      parameters:
        - name: application_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Schedule returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestSchedule'
        '404':
          description: Application not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    put:
      tags: [schedules]
      summary: Update the test schedule for an application
      parameters:
        - name: application_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TestScheduleUpdate'
      responses:
        '200':
          description: Schedule updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestSchedule'
        '400':
          description: Invalid schedule configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Application not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ---------------------------------------------------------------------------
  # FAILURE RESPONSE POLICY
  # ---------------------------------------------------------------------------

  /applications/{application_id}/policies:
    get:
      tags: [policies]
      summary: Get all failure response policies for an application
      parameters:
        - name: application_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Policies returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyList'
        '404':
          description: Application not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    post:
      tags: [policies]
      summary: Create a failure response policy
      description: |
        Creates a policy rule governing SETI's response when a specific
        test failure condition is met. Policies are evaluated in
        specificity order — the most specific matching policy wins.

        Specificity order (most to least specific):
        application + job_name + test_tier + environment + severity
        application + job_name + test_tier + environment
        application + job_name + test_tier
        application + test_tier
        application (catch-all)
      parameters:
        - name: application_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PolicyRule'
      responses:
        '201':
          description: Policy created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyRule'
        '400':
          description: Invalid policy definition
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Application not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /applications/{application_id}/policies/lookup:
    post:
      tags: [policies]
      summary: Look up the applicable policy for a test failure
      description: |
        Returns the most specific matching policy for a given failure
        condition. Called by Contract Test Job and Plot Test Job
        immediately after a test failure to determine response action.
        This is the hot path — response must be fast.
      parameters:
        - name: application_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PolicyLookupRequest'
            example:
              job_name: "vote-handler"
              test_tier: "contract"
              environment: "production"
              severity: "critical"
      responses:
        '200':
          description: Applicable policy returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyLookupResult'
        '404':
          description: No matching policy found — use default alert behavior
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ---------------------------------------------------------------------------
  # CONTRACT VERSION TRACKING
  # ---------------------------------------------------------------------------

  /applications/{application_id}/contract-versions:
    get:
      tags: [contracts]
      summary: Get last known contract versions for all Jobs in an application
      description: |
        Returns the contract version last seen by SETI for each Job
        in the application. Used by the Contract Test Job to detect
        version changes after a test failure triggers a refresh.
      parameters:
        - name: application_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Contract versions returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContractVersionMap'
        '404':
          description: Application not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    put:
      tags: [contracts]
      summary: Update contract versions after a refresh
      description: |
        Updates the stored contract versions for one or more Jobs after
        the Contract Test Job pulls fresh contracts from the repository.
        If a version change is detected, Policy Job notifies Plot Store
        to flag affected Plots for regeneration.
      parameters:
        - name: application_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContractVersionUpdate'
      responses:
        '200':
          description: Versions updated. Changed jobs listed in response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContractVersionUpdateResult'
        '400':
          description: Invalid payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Application not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /health:
    get:
      tags: [health]
      summary: Service health check
      responses:
        '200':
          description: Service healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /ai-providers:
    get:
      summary: List configured AI providers and their discovered models
      responses:
        '200':
          description: AI provider list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AIProviderList'
    post:
      summary: Register or update an AI provider
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AIProviderRequest'
      responses:
        '201':
          description: Provider registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AIProvider'
        '200':
          description: Provider updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AIProvider'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /ai-providers/{provider_id}:
    get:
      summary: Get a specific AI provider with its current model list
      parameters:
        - name: provider_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Provider details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AIProvider'
        '404':
          description: Provider not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      summary: Remove an AI provider
      parameters:
        - name: provider_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Provider removed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusMessage'
        '404':
          description: Provider not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /ai-providers/{provider_id}/refresh:
    post:
      summary: Query the provider for available models and update stored list
      parameters:
        - name: provider_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Model list refreshed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AIProvider'
        '404':
          description: Provider not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: Could not reach AI provider
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /ai-providers/{provider_id}/active-model:
    put:
      summary: Set the active model for a provider
      parameters:
        - name: provider_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [model_name]
              properties:
                model_name:
                  type: string
                  description: Model name as returned by the provider
      responses:
        '200':
          description: Active model updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AIProvider'
        '404':
          description: Provider or model not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /ai-providers/active:
    get:
      summary: Get the currently active AI provider and model for AI-lien
      description: |
        AI-lien calls this before every analysis to get the current
        provider URL and active model. No caching — always fresh.
        Returns 503 if no provider is configured or none is active.
      responses:
        '200':
          description: Active provider configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActiveAIProvider'
        '503':
          description: No active AI provider configured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /applications/{application_id}/federation/connect:
    post:
      tags: [federation]
      summary: Initiate or re-initiate federation with an application's AC
      description: |
        Triggers SETI to send a star-gazer signed registration request to
        the application's AC endpoint. On success, the Signal Aggregator
        begins subscribing to the AC's tca:augur-canis feed and verifying
        events against the returned session certificate.

        Called automatically when:
        - A new application is registered with an ac_endpoint.
        - The Signal Aggregator detects feed silence beyond the threshold.
        - The Signal Aggregator receives an event that fails signature
          verification (stale session cert after AC restart).

        Can also be called manually by a Sec Wr4ngler to force reconnection.

        Idempotent — if already registered with a valid session, returns
        the current status without re-registering.
      parameters:
        - name: application_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Federation registration initiated or already active
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FederationConnectResponse'
        '404':
          description: Application not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '400':
          description: Application has no ac_endpoint configured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: AC endpoint unreachable or registration rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /applications/{application_id}/federation/status:
    get:
      tags: [federation]
      summary: Get federation connection status for an application
      description: |
        Returns the current state of SETI's federation connection to
        this application's AC, including session certificate status
        and feed health.
      parameters:
        - name: application_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Federation status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FederationConnectResponse'
        '404':
          description: Application not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'


components:
  schemas:

    ApplicationRegistration:
      type: object
      required:
        - application_id
        - display_name
        - repository_url
        - contracts_path
        - environments
      properties:
        application_id:
          type: string
          description: >
            Unique identifier for this application across all environments.
            Convention: app-{name}-{env} e.g. app-tca-vox-prod
          example: "app-tca-vox-prod"
        display_name:
          type: string
          description: Human-readable application name
          example: "TCA Vox (Production)"
        repository_url:
          type: string
          description: >
            Repository URL. SETI reads from the contracts folder only.
            Read access must be granted before registration.
          example: "https://github.com/Pelentan/tca-vox"
        contracts_path:
          type: string
          description: Path to the contracts folder within the repository
          example: "contracts/openapi"
        environments:
          type: array
          items:
            $ref: '#/components/schemas/EnvironmentConfig'
          minItems: 1
          description: One entry per environment being monitored
        ac_endpoint:
          type: string
          description: >
            HTTPS endpoint for this constellation's Augur Canis instance.
            Set when a Sec Wr4ngler registers the constellation. SETI uses
            this to initiate federation registration with the external AC.
            Required for health feed subscription. Optional for seti-self
            which uses the internal AC directly.
        federation_status:
          type: string
          enum: [pending, registered, degraded, unregistered]
          description: >
            pending — ac_endpoint provided, federation registration not yet
            attempted.
            registered — SETI has a valid session certificate from the AC,
            health feed active.
            degraded — feed silent or signature verification failing, SETI
            is attempting re-registration.
            unregistered — no ac_endpoint, or registration failed permanently.
        federation_registered_at:
          type: string
          format: date-time
          description: When the current session certificate was issued.
        session_cert_id:
          type: string
          description: >
            Short identifier of the session certificate currently in use.
            SETI uses this to detect certificate rotation in incoming events.
        default_schedule:
          $ref: '#/components/schemas/TestScheduleConfig'
          description: >
            Schedule applied to all environments unless overridden.
            If omitted, SETI defaults apply: contract tests every
            15 minutes, plot tests daily at 02:00 UTC.

    EnvironmentConfig:
      type: object
      required:
        - environment
        - gateway_endpoint
        - observability_stream
      properties:
        environment:
          type: string
          enum: [production, staging, development]
        gateway_endpoint:
          type: string
          description: Gateway URL for this environment
          example: "https://vox.example.com"
        observability_stream:
          type: string
          description: Redis connection string for tca:events pub/sub
          example: "redis://vox-redis-prod:6379"
        schedule_override:
          $ref: '#/components/schemas/TestScheduleConfig'
          description: >
            Environment-specific schedule. Overrides default_schedule
            for this environment only.

    TestScheduleConfig:
      type: object
      properties:
        contract_test_interval_minutes:
          type: integer
          minimum: 5
          maximum: 1440
          description: >
            How often to run Contract Tests in minutes.
            Minimum 5 minutes. Default 15.
          example: 15
        plot_test_cron:
          type: string
          description: >
            Cron expression for Plot Test runs. Default: daily at 02:00 UTC.
          example: "0 2 * * *"
        plot_test_on_deployment:
          type: boolean
          description: >
            Whether to trigger a Plot Test run on deployment detection.
            Default true.
          example: true
        timeout_seconds:
          type: integer
          minimum: 30
          maximum: 300
          description: >
            Maximum time a Contract Test run may take before timing out.
            Default 60 seconds.
          example: 60

    ApplicationUpdate:
      type: object
      properties:
        display_name:
          type: string
        repository_url:
          type: string
        contracts_path:
          type: string
        environments:
          type: array
          items:
            $ref: '#/components/schemas/EnvironmentConfig'
        default_schedule:
          $ref: '#/components/schemas/TestScheduleConfig'

    Application:
      type: object
      required:
        - application_id
        - display_name
        - repository_url
        - contracts_path
        - status
        - registered_at
        - updated_at
        - environments
      properties:
        application_id:
          type: string
        display_name:
          type: string
        repository_url:
          type: string
        contracts_path:
          type: string
        status:
          type: string
          enum: [active, paused, error]
          description: >
            active — tests running on schedule.
            paused — tests suspended, application still registered.
            error — SETI cannot reach repository or gateway.
        pause_reason:
          type: string
          description: Present when status is paused
        registered_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        environments:
          type: array
          items:
            $ref: '#/components/schemas/EnvironmentConfig'
        default_schedule:
          $ref: '#/components/schemas/TestScheduleConfig'

    ApplicationList:
      type: object
      required:
        - applications
        - total
      properties:
        applications:
          type: array
          items:
            $ref: '#/components/schemas/Application'
        total:
          type: integer

    DeregistrationResult:
      type: object
      required:
        - application_id
        - schedules_cancelled
        - plots_deprecated
        - results_retained
      properties:
        application_id:
          type: string
        schedules_cancelled:
          type: integer
        plots_deprecated:
          type: integer
        results_retained:
          type: integer
          description: Historical results kept in Results Job

    PauseRequest:
      type: object
      required:
        - reason
      properties:
        reason:
          type: string
          description: Why testing is being paused
          example: "Planned maintenance window 2026-03-28 02:00-04:00 UTC"
        resume_at:
          type: string
          format: date-time
          description: >
            Optional. If provided, SETI will automatically resume
            testing at this time.

    TestSchedule:
      type: object
      required:
        - application_id
        - default_schedule
        - environment_schedules
      properties:
        application_id:
          type: string
        default_schedule:
          $ref: '#/components/schemas/TestScheduleConfig'
        environment_schedules:
          type: array
          items:
            type: object
            required:
              - environment
              - effective_schedule
            properties:
              environment:
                type: string
                enum: [production, staging, development]
              effective_schedule:
                $ref: '#/components/schemas/TestScheduleConfig'
              override_active:
                type: boolean

    TestScheduleUpdate:
      type: object
      properties:
        default_schedule:
          $ref: '#/components/schemas/TestScheduleConfig'
        environment_overrides:
          type: array
          items:
            type: object
            required:
              - environment
              - schedule
            properties:
              environment:
                type: string
                enum: [production, staging, development]
              schedule:
                $ref: '#/components/schemas/TestScheduleConfig'

    PolicyRule:
      type: object
      required:
        - test_tier
        - action
      properties:
        policy_id:
          type: string
          description: Assigned on creation
          example: "pol-a1b2c3d4"
        application_id:
          type: string
          description: Set from path parameter on creation
        job_name:
          type: string
          description: >
            Specific Job this policy applies to.
            If omitted, applies to all Jobs in the application.
          example: "vote-handler"
        test_tier:
          type: string
          enum: [contract, plot, both]
          description: Which test tier triggers this policy
        environment:
          type: string
          enum: [production, staging, development, all]
          description: Which environment this policy applies to. Default all.
        severity:
          type: string
          enum: [critical, high, medium, low, any]
          description: >
            Failure severity level this policy responds to.
            Severity is determined by the test Job based on
            which endpoint failed and the failure type.
            Default any.
        action:
          type: string
          enum: [alert, rollback, alert_and_rollback, escalate, none]
          description: >
            alert — notify via configured channels.
            rollback — trigger deployment rollback, no notification.
            alert_and_rollback — both.
            escalate — route to Interactions Job for human or AI handling.
            none — log only, no external action.
        notification_channels:
          type: array
          items:
            type: string
          description: >
            Present when action includes alert. Channel identifiers
            configured in the Interactions Job.
          example: ["slack-ops", "pagerduty-critical"]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    PolicyList:
      type: object
      required:
        - policies
        - total
      properties:
        policies:
          type: array
          items:
            $ref: '#/components/schemas/PolicyRule'
        total:
          type: integer

    PolicyLookupRequest:
      type: object
      required:
        - job_name
        - test_tier
        - environment
        - severity
      properties:
        job_name:
          type: string
          example: "vote-handler"
        test_tier:
          type: string
          enum: [contract, plot]
        environment:
          type: string
          enum: [production, staging, development]
        severity:
          type: string
          enum: [critical, high, medium, low]

    PolicyLookupResult:
      type: object
      required:
