# CodeQL configuration for tca-seti
#
# go/request-forgery is excluded because CodeQL's taint model propagates
# through url.Parse and URL.String(), treating them as taint-preserving
# operations.  This makes the rule unable to recognize URL validation as
# a sanitizer, generating persistent false positives for any service that
# validates URLs before use.  All flagged endpoints have explicit
# sanitizeHTTPSURL calls that validate scheme and host before use.
# The rule cannot be trusted to distinguish secured from unsecured patterns
# in this codebase, so it is excluded entirely.

query-filters:
  - exclude:
      id: go/request-forgery
