# CodeQL configuration for tca-seti
#
# go/request-forgery is excluded because CodeQL's taint model propagates
# through url.Parse and URL.String(), treating them as taint-preserving
# operations.  This makes the rule unable to recognize URL validation as
# a sanitizer, generating persistent false positives for any service that
# validates URLs before use.  All flagged endpoints have explicit
# sanitizeHTTPSURL calls that validate scheme and host before use.
# The rule cannot be trusted to distinguish secured from unsecured patterns
# in this codebase, so it is excluded entirely.

query-filters:
  - exclude:
      id: go/request-forgery
  - exclude:
      # go/log-injection is excluded for the same reason as go/request-forgery.
      # All endpoints that accept tag values from URL paths are on the mTLS port —
      # only authenticated internal services with valid constellation certs can
      # reach them.  No unauthenticated user can supply a tag value.
      id: go/log-injection
  - exclude:
      # js/remote-property-injection is excluded because signal-clearance is
      # mTLS-only — no unauthenticated user can send query parameters or cookies
      # to it.  The Object.create(null) fix already prevents prototype pollution;
      # the remaining dynamic property write is inherent to any query string parser
      # and carries no exploitable risk in this network topology.
      id: js/remote-property-injection

