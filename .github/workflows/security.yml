name: SETI Security Scanning

on:
  push:
    branches: ["master", "develop"]
  pull_request:
    branches: ["master", "develop"]
  schedule:
    # Daily at 02:00 UTC — catches dependency vulnerabilities
    # discovered after last push
    - cron: '0 2 * * *'

jobs:
  codeql:
    name: CodeQL Analysis — ${{ matrix.language }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language:
          - go
          - javascript-typescript
          - python

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"

  # Elixir does not have native CodeQL support.
  # mix_audit covers dependency vulnerabilities.
  # Sobelow covers Phoenix/Elixir-specific security patterns.
  elixir-security:
    name: Elixir Security Audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./feed-wrangler

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.18'
          otp-version: '26'

      - name: Restore dependencies cache
        uses: actions/cache@v4
        with:
          path: feed-wrangler/deps
          key: ${{ runner.os }}-mix-${{ hashFiles('feed-wrangler/mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-

      - name: Install dependencies
        run: mix deps.get

      - name: Run mix_audit (dependency vulnerability check)
        run: mix deps.audit

      - name: Run Sobelow (static security analysis)
        run: |
          mix sobelow --exit

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
