# ---------------------------------------------------------------------------
# Volumes
# ---------------------------------------------------------------------------
volumes:
  certs:
    driver: local
  postgres_data:
    driver: local

# ---------------------------------------------------------------------------
# Networks
# ---------------------------------------------------------------------------
networks:
  seti-internal:
    driver: bridge
  # ac-net: shared Augur Canis network (Docker Compose dev)
  # Maps to per-service NetworkPolicies in K8s for true point-to-point isolation
  ac-net:
    driver: bridge
