      - ac-net
    depends_on:
      cert-forge:
        condition: service_healthy
      postgres:
        condition: service_healthy
      seti-observability:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
